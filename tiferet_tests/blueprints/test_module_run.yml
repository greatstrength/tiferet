fixtures:
  domain_tester:
    module_path: tiferet.domain
    class_name: TesterObject
    attributes:
      type: domain
      id: domain.ErrorMessage
      module_path: tiferet.domain.error
      class_name: ErrorMessage
      sample_data: {lang: en_US, text: An error occurred.}

tests:
  positional_session_keeps_tester_ctx:
    conditions:
      fixtures: [domain_tester]
    execute:
      - {target: {module_path: tiferet.blueprints.tester, attribute: build_tester_context}, method: build_tester_context, args: [$fixture.domain_tester], as: test_ctx}
      - &session {target: {module_path: tiferet.blueprints.tester, attribute: build_test_session}, method: build_test_session, args: [$r.test_ctx], as: session}
      - {target: {module_path: tiferet.blueprints.tester, attribute: build_test_session}, method: build_test_session, raises: true, as: neither}
      - {target: {module_path: tiferet.blueprints.tester, attribute: build_test_session}, method: build_test_session, args: [$r.test_ctx], kwargs: {test_context: $r.test_ctx}, raises: true, as: both}
    assert:
      - outcome: session
        attribute: tester_ctx
        equals: $r.test_ctx
      - outcome: session
        attribute: test_context
        "null": true
      - outcome: neither
        type: &value_error {module_path: builtins, class_name: ValueError}
      - outcome: both
        type: *value_error

  registry_mappings_stay:
    conditions: {}
    execute:
      - target: {module_path: importlib, attribute: import_module}
        method: import_module
        args: [tiferet.domain]
        as: domain_mod
      - target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.domain_mod, Request]
        as: request_cls
      - target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.domain_mod, Feature]
        as: feature_cls
      - target: {module_path: importlib, attribute: import_module}
        method: import_module
        args: [tiferet.domain.tester_phase]
        as: phase_domain
      - target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.phase_domain, Test]
        as: test_cls
      - target: {module_path: tiferet.contexts.core, class_name: BaseContext}
        method: for_domain
        args: [$r.request_cls]
        as: request_ctx
      - target: {module_path: tiferet.contexts.core, class_name: BaseContext}
        method: for_domain
        args: [$r.feature_cls]
        as: feature_ctx
      - target: {module_path: tiferet.contexts.core, class_name: BaseContext}
        method: for_domain
        args: [$r.test_cls]
        as: test_ctx
      - target: {module_path: importlib, attribute: import_module}
        method: import_module
        args: [tiferet.contexts.tester]
        as: tester_mod
      - target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.tester_mod, TestSessionContext]
        as: session_cls
      - target: {module_path: importlib, attribute: import_module}
        method: import_module
        args: [builtins]
        as: builtins_mod_for_session_dict
      - target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.builtins_mod_for_session_dict, object]
        as: object_cls_for_session_dict
      - target: $r.object_cls_for_session_dict
        method: __getattribute__
        args: [$r.session_cls, __dict__]
        as: session_dict
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.session_dict, domain_type]
        as: session_has
    assert:
      - outcome: request_ctx
        is: {module_path: tiferet.contexts.request, class_name: RequestContext}
      - outcome: feature_ctx
        is: {module_path: tiferet.contexts.feature, class_name: FeatureContext}
      - outcome: test_ctx
        is: {module_path: tiferet.contexts.tester_phase, class_name: TestContext}
      - {outcome: session_has, equals: false}

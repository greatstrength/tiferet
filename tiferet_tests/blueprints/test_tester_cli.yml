fixtures:
  loader:
    module_path: tiferet.utils.yaml
    class_name: YamlLoader
    attributes: {}

tests:
  build_cache_seeds_the_catalog:
    conditions: {}
    execute:
      - &build_cache {target: {module_path: tiferet.blueprints.tester_cli, attribute: build_cache}, method: build_cache, as: cache}
      - {target: $r.cache, method: get_by_prefix, args: [cli, commands], as: commands}
      - {target: $r.cache, method: get_by_prefix, args: [app, features], as: features}
      - {target: $r.cache, method: get_by_prefix, args: [app, services], as: services}
      - {target: $r.cache, method: get_by_prefix, args: [app, constants], as: constants}
      - {target: {module_path: operator, attribute: contains}, method: contains, args: [$r.commands, module.run], as: has_command}
      - {target: {module_path: operator, attribute: contains}, method: contains, args: [$r.features, module.run], as: has_feature}
      - {target: {module_path: operator, attribute: contains}, method: contains, args: [$r.services, get_fixture_evt], as: has_event_0}
      - {target: {module_path: operator, attribute: contains}, method: contains, args: [$r.services, list_fixtures_evt], as: has_event_1}
      - {target: {module_path: operator, attribute: contains}, method: contains, args: [$r.services, get_test_evt], as: has_event_2}
      - {target: {module_path: operator, attribute: contains}, method: contains, args: [$r.services, list_tests_evt], as: has_event_3}
      - {target: {module_path: operator, attribute: contains}, method: contains, args: [$r.services, get_tester_evt], as: has_event_4}
      - {target: {module_path: operator, attribute: contains}, method: contains, args: [$r.services, list_testers_evt], as: has_event_5}
      - {target: {module_path: operator, attribute: contains}, method: contains, args: [$r.services, add_fixture_evt], as: has_event_6}
      - {target: {module_path: operator, attribute: contains}, method: contains, args: [$r.services, update_fixture_evt], as: has_event_7}
      - {target: {module_path: operator, attribute: contains}, method: contains, args: [$r.services, remove_fixture_evt], as: has_event_8}
      - {target: {module_path: operator, attribute: contains}, method: contains, args: [$r.services, add_test_evt], as: has_event_9}
      - {target: {module_path: operator, attribute: contains}, method: contains, args: [$r.services, update_test_evt], as: has_event_10}
      - {target: {module_path: operator, attribute: contains}, method: contains, args: [$r.services, remove_test_evt], as: has_event_11}
      - {target: {module_path: operator, attribute: contains}, method: contains, args: [$r.services, add_tester_evt], as: has_event_12}
      - {target: {module_path: operator, attribute: contains}, method: contains, args: [$r.services, update_tester_evt], as: has_event_13}
      - {target: {module_path: operator, attribute: contains}, method: contains, args: [$r.services, remove_tester_evt], as: has_event_14}
      - {target: {module_path: operator, attribute: contains}, method: contains, args: [$r.services, attach_test_evt], as: has_event_15}
      - {target: {module_path: operator, attribute: contains}, method: contains, args: [$r.services, detach_test_evt], as: has_event_16}
      - {target: $r.services, method: get, args: [di_service], as: di_service}
      - {target: $r.cache, method: get, args: [tester_cli, app, sessions], as: session}
      - {target: {module_path: operator, attribute: is_}, method: is_, args: [$r.session, null], as: session_missing}
    assert:
      - {outcome: has_command, equals: true}
      - {outcome: has_feature, equals: true}
      - {outcome: has_event_0, equals: true}
      - {outcome: has_event_1, equals: true}
      - {outcome: has_event_2, equals: true}
      - {outcome: has_event_3, equals: true}
      - {outcome: has_event_4, equals: true}
      - {outcome: has_event_5, equals: true}
      - {outcome: has_event_6, equals: true}
      - {outcome: has_event_7, equals: true}
      - {outcome: has_event_8, equals: true}
      - {outcome: has_event_9, equals: true}
      - {outcome: has_event_10, equals: true}
      - {outcome: has_event_11, equals: true}
      - {outcome: has_event_12, equals: true}
      - {outcome: has_event_13, equals: true}
      - {outcome: has_event_14, equals: true}
      - {outcome: has_event_15, equals: true}
      - {outcome: has_event_16, equals: true}
      - outcome: di_service
        attribute: service_id
        equals: di_service
      - outcome: constants
        attribute: di_config
        equals: unused
      - {outcome: session_missing, equals: false}

  writer_add_needs_no_config_file:
    conditions:
      stage: true
      fixtures: [loader]
    execute:
      - {target: $stage, method: exists, args: [config.yml], as: had_config}
      - &base_dir {target: $stage, method: path, as: base_dir}
      - &add_cli
        target: &tester_cli {module_path: tiferet.blueprints, attribute: build_tester_cli}
        method: build_tester_cli
        kwargs:
          argv: [fixture, add, domain/test_error, error_message, --payload, 'class_name: ErrorMessage', --base-dir, $r.base_dir]
        as: result
      - &module_path {target: $stage, method: path, args: [tiferet_tests, domain, test_error.yml], as: module_path}
      - &load {target: loader, method: load_mapping, args: [$r.module_path], as: loaded}
    assert:
      - {outcome: had_config, equals: false}
      - {outcome: result, equals: $r.module_path}
      - outcome: loaded
        equals:
          fixtures:
            error_message: {class_name: ErrorMessage}

  writer_get_does_not_replace_the_file:
    conditions:
      stage: true
      fixtures: [loader]
    execute:
      - *base_dir
      - *add_cli
      - *module_path
      - {target: loader, method: load_mapping, args: [$r.module_path], as: before}
      - target: *tester_cli
        method: build_tester_cli
        kwargs:
          argv: [fixture, get, domain/test_error, error_message, --base-dir, $r.base_dir]
        as: got
      - {target: loader, method: load_mapping, args: [$r.module_path], as: after}
    assert:
      - {outcome: after, equals: $r.before}
      - outcome: got
        fields:
          record:
            fields: {name: error_message}

  unwired_runner_raises:
    conditions: {}
    execute:
      - *build_cache
      - {target: $r.cache, method: get, args: [tester_cli, app, sessions], as: session}
      - {target: {module_path: tiferet.blueprints.tester_cli, attribute: build_tester_cli_session_context}, method: build_tester_cli_session_context, args: [$r.session, $r.cache], as: context}
      - {target: $r.context, method: __setattr__, args: [_run_test_module, null]}
      - {target: $r.context, method: run, args: [[module, run, tests/test_sample.py]], raises: true, as: caught}
    assert:
      - outcome: caught
        type: {module_path: tiferet.assets, class_name: TiferetAPIError}
      - {outcome: caught, message: run_test_module}

  package_exports_and_script:
    conditions: {}
    execute:
      - {target: {module_path: importlib, attribute: import_module}, method: import_module, args: [tiferet.blueprints], as: blueprints}
      - {target: {module_path: builtins, attribute: getattr}, method: getattr, args: [$r.blueprints, TesterCLI], as: tester_cli_alias}
      - {target: {module_path: builtins, attribute: getattr}, method: getattr, args: [$r.blueprints, build_tester_cli], as: build_tester_cli}
      - {target: {module_path: operator, attribute: is_}, method: is_, args: [$r.tester_cli_alias, $r.build_tester_cli], as: same}
      - {target: {module_path: builtins, attribute: getattr}, method: getattr, args: [$r.blueprints, __all__], as: blueprints_all}
      - {target: {module_path: operator, attribute: contains}, method: contains, args: [$r.blueprints_all, TesterCLI], as: exports_alias}
      - {target: {module_path: operator, attribute: contains}, method: contains, args: [$r.blueprints_all, build_tester_cli], as: exports_entry}
      - {target: {module_path: importlib, attribute: import_module}, method: import_module, args: [tiferet], as: package}
      - {target: {module_path: builtins, attribute: getattr}, method: getattr, args: [$r.package, __all__], as: package_all}
      - {target: {module_path: operator, attribute: contains}, method: contains, args: [$r.package_all, TesterCLI], as: package_exports_alias}
      - {target: {module_path: builtins, attribute: getattr}, method: getattr, args: [$r.package, __version__], as: version}
    assert:
      - {outcome: same, equals: true}
      - {outcome: exports_alias, equals: true}
      - {outcome: exports_entry, equals: true}
      - {outcome: package_exports_alias, equals: false}
      - {outcome: version, equals: 2.2.1b1}

  resolver_registers_the_empty_flag_container:
    conditions: {}
    execute:
      - *build_cache
      - {target: $r.cache, method: get, args: [tester_cli, app, sessions], as: session}
      - target: {module_path: tiferet.blueprints.core, attribute: build_app_service_container}
        method: build_app_service_container
        args: [$r.cache, $r.session]
        as: container
      - target: {module_path: tiferet.blueprints.tester_cli, attribute: build_tester_service_resolver}
        method: build_tester_service_resolver
        args: [$r.container]
        as: resolver
      - target: $r.resolver
        method: get_container
        args: [app]
        as: app_container
      - target: $r.resolver
        method: get_container
        as: empty_flag_container
      - target: {module_path: operator, attribute: is_}
        method: is_
        args: [$r.app_container, $r.container]
        as: app_same
      - target: {module_path: operator, attribute: is_}
        method: is_
        args: [$r.empty_flag_container, $r.container]
        as: empty_same
      - target: {module_path: importlib, attribute: import_module}
        method: import_module
        args: [tiferet.blueprints.tester_cli]
        as: tester_cli_mod
      - target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.tester_cli_mod, __file__]
        as: cli_file
      - target: {module_path: pathlib, attribute: Path}
        method: Path
        args: [$r.cli_file]
        as: cli_path
      - target: $r.cli_path
        method: read_text
        kwargs: {encoding: utf-8}
        as: cli_source
      - target: $r.cli_source
        method: split
        args: ['def build_tester_service_resolver', 1]
        as: after_resolver_def
      - target: $r.after_resolver_def
        method: __getitem__
        args: [1]
        as: from_resolver
      - target: $r.from_resolver
        method: split
        args: ['\ndef ', 1]
        as: resolver_parts
      - target: $r.resolver_parts
        method: __getitem__
        args: [0]
        as: resolver_source
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.resolver_source, list_all]
        as: resolver_has_list_all
    assert:
      - {outcome: app_same, equals: true}
      - {outcome: empty_same, equals: true}
      - {outcome: resolver_has_list_all, equals: false}

  catalog_parent_arguments_reads_the_catalog:
    conditions: {}
    execute:
      - target: {module_path: tiferet.blueprints.tester_cli, attribute: catalog_parent_arguments}
        method: catalog_parent_arguments
        as: arguments
      - target: {module_path: builtins, attribute: len}
        method: len
        args: [$r.arguments]
        as: arg_count
      - target: $r.arguments
        method: __getitem__
        args: [0]
        as: first
      - target: {module_path: importlib, attribute: import_module}
        method: import_module
        args: [tiferet.assets.tester_cli]
        as: assets
      - target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.assets, TESTER_DEFAULT_PARENT_ARGUMENTS]
        as: catalog
      - target: $r.catalog
        method: __getitem__
        args: [0]
        as: catalog_first
      - target: $r.catalog_first
        method: __getitem__
        args: [name_or_flags]
        as: catalog_flags
      - target: {module_path: importlib, attribute: import_module}
        method: import_module
        args: [tiferet.blueprints.tester_cli]
        as: tester_cli_mod
      - target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.tester_cli_mod, __file__]
        as: cli_file
      - target: {module_path: pathlib, attribute: Path}
        method: Path
        args: [$r.cli_file]
        as: cli_path
      - target: $r.cli_path
        method: read_text
        kwargs: {encoding: utf-8}
        as: cli_source
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.cli_source, '# *** functions']
        as: has_functions_banner
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.cli_source, argparse]
        as: has_argparse
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.cli_source, '--base-dir']
        as: has_base_dir_flag
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.cli_source, '--config']
        as: has_config_flag
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.cli_source, config.yml]
        as: has_config_yml
    assert:
      - {outcome: arg_count, equals: 1}
      - outcome: first
        attribute: name_or_flags
        equals: $r.catalog_flags
      - outcome: first
        attribute: default
        equals: .
      - {outcome: has_functions_banner, equals: false}
      - {outcome: has_argparse, equals: false}
      - {outcome: has_base_dir_flag, equals: false}
      - {outcome: has_config_flag, equals: false}
      - {outcome: has_config_yml, equals: false}

  parse_tester_args_sets_the_address_resolver:
    conditions: {}
    execute:
      - {target: {module_path: tiferet.blueprints.tester_cli, attribute: build_cache}, method: build_cache, as: cache}
      - target: {module_path: tiferet.blueprints.tester_cli, attribute: parse_tester_args}
        method: parse_tester_args
        args: [$r.cache]
        as: handler
      - target: $r.handler
        method: __call__
        args: [[fixture, get, domain/test_error, error_message]]
        as: parsed
      - target: $r.parsed
        method: __getitem__
        args: [0]
        as: feature_id
      - target: $r.parsed
        method: __getitem__
        args: [2]
        as: data
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.data, group]
        as: has_group
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.data, command]
        as: has_command
      - target: $r.data
        method: __getitem__
        args: [base_dir]
        as: base_dir
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.data, resolve_address]
        as: has_resolve_address
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.data, replace_module]
        as: has_replace_module
      - target: {module_path: importlib, attribute: import_module}
        method: import_module
        args: [tiferet.blueprints.tester_cli]
        as: tester_cli_mod
      - target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.tester_cli_mod, __file__]
        as: cli_file
      - target: {module_path: pathlib, attribute: Path}
        method: Path
        args: [$r.cli_file]
        as: cli_path
      - target: $r.cli_path
        method: read_text
        kwargs: {encoding: utf-8}
        as: cli_source
      - target: $r.cli_source
        method: split
        args: ['def list_tester_commands', 1]
        as: after_list_def
      - target: $r.after_list_def
        method: __getitem__
        args: [1]
        as: from_list
      - target: $r.from_list
        method: split
        args: ['\ndef ', 1]
        as: list_parts
      - target: $r.list_parts
        method: __getitem__
        args: [0]
        as: list_source
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.list_source, list_all]
        as: list_has_list_all
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.list_source, get_dependency]
        as: list_has_get_dependency
    assert:
      - {outcome: feature_id, equals: fixture.get}
      - {outcome: has_group, equals: false}
      - {outcome: has_command, equals: false}
      - {outcome: base_dir, equals: .}
      - {outcome: has_resolve_address, equals: false}
      - {outcome: has_replace_module, equals: false}
      - {outcome: list_has_list_all, equals: false}
      - {outcome: list_has_get_dependency, equals: false}

        method: contains
        args: [$r.tiferet_all, remove_fixture]
        as: in_tiferet_remove_fixture
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.blueprints_all, remove_fixture]
        as: in_blueprints_remove_fixture
      - target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.tester_blueprints, add_test]
        as: fn_add_test
      - target: {module_path: builtins, attribute: hasattr}
        method: hasattr
        args: [$r.fn_add_test, __call__]
        as: callable_add_test
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.tiferet_all, add_test]
        as: in_tiferet_add_test
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.blueprints_all, add_test]
        as: in_blueprints_add_test
      - target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.tester_blueprints, get_test]
        as: fn_get_test
      - target: {module_path: builtins, attribute: hasattr}
        method: hasattr
        args: [$r.fn_get_test, __call__]
        as: callable_get_test
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.tiferet_all, get_test]
        as: in_tiferet_get_test

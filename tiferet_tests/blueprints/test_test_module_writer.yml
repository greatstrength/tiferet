fixtures:
  loader:
    module_path: tiferet.utils.yaml
    class_name: YamlLoader
    attributes: {}

tests:
  add_fixture_creates_only_the_test_module:
    conditions:
      stage: true
      fixtures: [loader]
    execute:
      - {target: $stage, method: path, as: base_dir}
      - target: {module_path: tiferet.blueprints.tester, attribute: add_fixture}
        method: add_fixture
        args: [domain/test_error, error_message]
        kwargs: {payload: {class_name: ErrorMessage}, anchor: error_message, base_dir: $r.base_dir}
      - {target: $stage, method: path, args: [tiferet_tests, domain, test_error.yml], as: module_path}
      - {target: loader, method: load_mapping, args: [$r.module_path], as: loaded}
      - {target: $stage, method: exists, args: [tests], as: has_tests_dir}
    assert:
      - outcome: loaded
        equals:
          fixtures:
            error_message: {class_name: ErrorMessage}
      - {outcome: has_tests_dir, equals: false}

  add_test_keeps_stage_flag:
    conditions:
      stage: true
      fixtures: [loader]
    execute:
      - {target: $stage, method: path, as: base_dir}
      - target: {module_path: tiferet.blueprints.tester, attribute: add_test}
        method: add_test
        args: [utils/test_staged, staged]
        kwargs:
          fragment: "conditions:\n  stage: true\nexecute:\n  - target: $stage\n    method: path\n    as: directory\nassert:\n  - outcome: directory\n    message: tiferet\n"
          base_dir: $r.base_dir
      - {target: $stage, method: path, args: [tiferet_tests, utils, test_staged.yml], as: module_path}
      - {target: loader, method: load_mapping, args: [$r.module_path], as: stored}
      - {target: $r.stored, method: __getitem__, args: [tests], as: tests}
      - {target: $r.tests, method: __getitem__, args: [staged], as: staged}
      - {target: $r.staged, method: __getitem__, args: [execute], as: execute}
      - {target: $r.execute, method: __getitem__, args: [0], as: first_step}
      - {target: $r.first_step, method: __getitem__, args: [target], as: stored_target}
      - {target: {module_path: builtins, attribute: len}, method: len, args: [$r.stored_target], as: target_length}
    assert:
      - outcome: staged
        attribute: conditions
        equals: {stage: true}
      - outcome: stored_target
        message: '$stag'
      - outcome: target_length
        equals: 6

  no_writer_modules_are_added:
    conditions: {}
    execute:
      - target: {module_path: importlib, attribute: import_module}
        method: import_module
        args: [tiferet]
        as: tiferet_mod
      - target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.tiferet_mod, __file__]
        as: tiferet_file
      - target: {module_path: pathlib, attribute: Path}
        method: Path
        args: [$r.tiferet_file]
        as: tiferet_init
      - target: $r.tiferet_init
        method: __getattribute__
        args: [parent]
        as: root
      - target: $r.root
        method: __truediv__
        args: [events]
        as: events_dir
      - target: $r.events_dir
        method: __truediv__
        args: [tester.py]
        as: events_tester
      - target: $r.events_tester
        method: exists
        as: events_tester_exists
      - target: $r.events_dir
        method: __truediv__
        args: [yaml.py]
        as: yaml_path
      - target: $r.yaml_path
        method: read_text
        as: yaml_source
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.yaml_source, LoadYamlMapping]
        as: has_load_yaml_mapping
      - target: $r.root
        method: __truediv__
        args: [interfaces]
        as: interfaces_dir
      - target: $r.interfaces_dir
        method: __truediv__
        args: [tester.py]
        as: interfaces_tester
      - target: $r.interfaces_tester
        method: exists
        as: interfaces_tester_exists
      - target: $r.root
        method: __truediv__
        args: [mappers]
        as: mappers_dir
      - target: $r.mappers_dir
        method: __truediv__
        args: [tester.py]
        as: mappers_tester
      - target: $r.mappers_tester
        method: exists
        as: mappers_tester_exists
      - target: $r.root
        method: __truediv__
        args: [repos]
        as: repos_dir
      - target: $r.repos_dir
        method: __truediv__
        args: [tester.py]
        as: repos_tester
      - target: $r.repos_tester
        method: exists
        as: repos_tester_exists
      - target: $r.root
        method: __truediv__
        args: [tiferet_tests]
        as: nested_tests
      - target: $r.nested_tests
        method: exists
        as: nested_tests_exists
      - target: $r.events_dir
        method: __truediv__
        args: [tester_module.py]
        as: tester_module_path
      - target: $r.tester_module_path
        method: is_file
        as: tester_module_is_file
      - target: $r.tester_module_path
        method: read_text
        as: event_source
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.event_source, 'class ReadTestModuleDocument']
        as: has_read
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.event_source, 'class WriteTestModuleDocument']
        as: has_write
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.event_source, 'class GetAnchoredYaml']
        as: has_get_anchored
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.event_source, TesterService]
        as: has_tester_service
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.event_source, 'yaml.safe_dump']
        as: has_safe_dump
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.event_source, 'YamlLoader.save']
        as: has_yaml_loader_save
    assert:
      - {outcome: events_tester_exists, equals: false}
      - {outcome: has_load_yaml_mapping, equals: false}
      - {outcome: interfaces_tester_exists, equals: false}
      - {outcome: mappers_tester_exists, equals: false}
      - {outcome: repos_tester_exists, equals: false}
      - {outcome: nested_tests_exists, equals: false}
      - {outcome: tester_module_is_file, equals: true}
      - {outcome: has_read, equals: true}
      - {outcome: has_write, equals: true}
      - {outcome: has_get_anchored, equals: false}
      - {outcome: has_tester_service, equals: false}
      - {outcome: has_safe_dump, equals: false}
      - {outcome: has_yaml_loader_save, equals: false}

  add_fixture_preserves_recorded_anchors:
    conditions:
      stage: true
      fixtures: [loader]
    execute:
      - {target: $stage, method: path, as: base_dir}
      - target: {module_path: importlib, attribute: import_module}
        method: import_module
        args: [tiferet.contexts.tester_phase]
        as: phase_mod
      - target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.phase_mod, FIXTURE_REF_PREFIX]
        as: fixture_prefix
      - target: $r.fixture_prefix
        method: __add__
        args: [error_message]
        as: fixture_error_message
      - target: {module_path: pathlib, attribute: Path}
        method: Path
        args: [$r.base_dir]
        as: base_path
      - target: $r.base_path
        method: __truediv__
        args: [tiferet_tests]
        as: tests_root
      - target: $r.tests_root
        method: __truediv__
        args: [domain]
        as: domain_dir
      - target: $r.domain_dir
        method: mkdir
        kwargs: {parents: true}
        as: made
      - target: $r.domain_dir
        method: __truediv__
        args: [test_error.yml]
        as: module_path
      - target: $r.module_path
        method: write_text
        args: ["fixtures:\n  error_message: &error_message\n    module_path: &error_module tiferet.domain.error\n    class_name: ErrorMessage\n    attributes: &plain_message\n      lang: &lang en_US\n      text: &plain An error occurred.\n  formatted_error_message:\n    <<: *error_message\n    attributes:\n      lang: *lang\n      text: &formatted 'An error occurred: {error}'\n\ntests:\n  error_message_format:\n    conditions:\n      fixtures: [error_message, formatted_error_message]\n    execute:\n      - target: error_message\n        method: format\n        as: raw\n    assert:\n      - outcome: raw\n        equals: *plain\n\ntesters:\n  test_error:\n    module_path: *error_module\n    class_name: Error\n    attributes:\n      id: &error_id TEST_ERROR\n      name: Test Error\n      message: [$fixture.error_message]\n    fixtures:\n      error_message: *error_message\n    tests:\n      construction_derives_error_code:\n        conditions:\n          fixtures: [error_message]\n        execute:\n          - target: self\n            method: new\n            as: built\n        assert:\n          - outcome: built\n            fields:\n              id: *error_id\n              error_code: *error_id\n"]
        as: written
      - target: {module_path: tiferet.blueprints.tester, attribute: add_fixture}
        method: add_fixture
        args: [domain/test_error, extra]
        kwargs: {payload: {class_name: Extra}, base_dir: $r.base_dir}
      - target: $r.module_path
        method: read_text
        as: text
      - target: $r.text
        method: split
        args: ['formatted_error_message:', 1]
        as: split1
      - target: $r.split1
        method: __getitem__
        args: [1]
        as: after_formatted
      - target: $r.after_formatted
        method: split
        args: ['tests:', 1]
        as: split2
      - target: $r.split2
        method: __getitem__
        args: [0]
        as: merged
      - target: $r.merged
        method: split
        args: ['attributes:', 1]
        as: merged_parts
      - target: $r.merged_parts
        method: __getitem__
        args: [0]
        as: before_attrs
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.before_attrs, module_path]
        as: merged_has_module_path
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.text, "&error_message"]
        as: token_0
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.text, "*error_message"]
        as: token_1
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.text, "&plain_message"]
        as: token_2
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.text, "&lang"]
        as: token_3
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.text, "*lang"]
        as: token_4
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.text, "&plain"]
        as: token_5
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.text, "*plain"]
        as: token_6
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.text, "&error_module"]
        as: token_7
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.text, "*error_module"]
        as: token_8
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.text, "<<:"]
        as: token_9
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.text, "&formatted"]
        as: token_10
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.text, "&error_id"]
        as: token_11
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.text, "*error_id"]
        as: token_12
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.text, $r.fixture_error_message]
        as: token_13
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.text, "[error_message, formatted_error_message]"]
        as: token_14
      - target: {module_path: importlib, attribute: import_module}
        method: import_module
        args: [tests.blueprints.test_test_module_writer]
        as: writer_tests
      - target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.writer_tests, NORMATIVE_MODULE]
        as: normative
      - target: {module_path: importlib, attribute: import_module}
        method: import_module
        args: [yaml]
        as: yaml_mod
      - target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.yaml_mod, safe_load]
        as: safe_load
      - target: $r.safe_load
        method: __call__
        args: [$r.normative]
        as: loaded_normative
      - target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.yaml_mod, safe_dump]
        as: safe_dump
      - target: $r.safe_dump
        method: __call__
        args: [$r.loaded_normative]
        kwargs: {sort_keys: false}
        as: dumped_normative
      - target: {module_path: operator, attribute: eq}
        method: eq
        args: [$r.text, $r.dumped_normative]
        as: same_as_safe_dump
    assert:
      - {outcome: merged_has_module_path, equals: false}
      - {outcome: token_0, equals: true}
      - {outcome: token_1, equals: true}
      - {outcome: token_2, equals: true}
      - {outcome: token_3, equals: true}
      - {outcome: token_4, equals: true}
      - {outcome: token_5, equals: true}
      - {outcome: token_6, equals: true}
      - {outcome: token_7, equals: true}
      - {outcome: token_8, equals: true}
      - {outcome: token_9, equals: true}
      - {outcome: token_10, equals: true}
      - {outcome: token_11, equals: true}
      - {outcome: token_12, equals: true}
      - {outcome: token_13, equals: true}
      - {outcome: token_14, equals: true}
      - {outcome: same_as_safe_dump, equals: false}

  get_and_list_do_not_write:
    conditions:
      stage: true
      fixtures: [loader]
    execute:
      - {target: $stage, method: path, as: base_dir}
      - target: {module_path: pathlib, attribute: Path}
        method: Path
        args: [$r.base_dir]
        as: base_path
      - target: $r.base_path
        method: __truediv__
        args: [tiferet_tests]
        as: tests_root
      - target: $r.tests_root
        method: __truediv__
        args: [domain]
        as: domain_dir
      - target: $r.domain_dir
        method: mkdir
        kwargs: {parents: true}
        as: made
      - target: $r.domain_dir
        method: __truediv__
        args: [test_error.yml]
        as: module_path
      - target: $r.module_path
        method: write_text
        args: ["fixtures:\n  error_message: &error_message\n    module_path: &error_module tiferet.domain.error\n    class_name: ErrorMessage\n    attributes: &plain_message\n      lang: &lang en_US\n      text: &plain An error occurred.\n  formatted_error_message:\n    <<: *error_message\n    attributes:\n      lang: *lang\n      text: &formatted 'An error occurred: {error}'\n\ntests:\n  error_message_format:\n    conditions:\n      fixtures: [error_message, formatted_error_message]\n    execute:\n      - target: error_message\n        method: format\n        as: raw\n    assert:\n      - outcome: raw\n        equals: *plain\n\ntesters:\n  test_error:\n    module_path: *error_module\n    class_name: Error\n    attributes:\n      id: &error_id TEST_ERROR\n      name: Test Error\n      message: [$fixture.error_message]\n    fixtures:\n      error_message: *error_message\n    tests:\n      construction_derives_error_code:\n        conditions:\n          fixtures: [error_message]\n        execute:\n          - target: self\n            method: new\n            as: built\n        assert:\n          - outcome: built\n            fields:\n              id: *error_id\n              error_code: *error_id\n"]
        as: written
      - target: $r.module_path
        method: read_bytes
        as: before
      - target: {module_path: tiferet.blueprints.tester, attribute: get_fixture}
        method: get_fixture
        args: [domain/test_error, error_message]
        kwargs: {tester: test_error, base_dir: $r.base_dir}
        as: got
      - target: $r.got
        method: __getitem__
        args: [alias]
        as: alias
      - target: $r.got
        method: __getitem__
        args: [fragment]
        as: fragment
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.fragment, class_name]
        as: fragment_has_class
      - target: {module_path: tiferet.blueprints.tester, attribute: list_fixtures}
        method: list_fixtures
        args: [domain/test_error]
        kwargs: {base_dir: $r.base_dir}
        as: listed
      - target: {module_path: tiferet.blueprints.tester, attribute: list_fixtures}
        method: list_fixtures
        args: [domain/test_error]
        kwargs: {tester: test_error, base_dir: $r.base_dir}
        as: listed_tester
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.listed_tester, formatted_error_message]
        as: tester_has_formatted
      - target: $r.module_path
        method: read_bytes
        as: after
      - target: {module_path: operator, attribute: eq}
        method: eq
        args: [$r.before, $r.after]
        as: unchanged
    assert:
      - {outcome: alias, equals: error_message}
      - outcome: fragment
        message: '*error_message'
      - {outcome: fragment_has_class, equals: false}
      - outcome: listed
        equals: [error_message, formatted_error_message]
      - {outcome: tester_has_formatted, equals: false}
      - {outcome: unchanged, equals: true}

  writers_stay_on_the_blueprint:
    conditions: {}
    execute:
      - target: {module_path: importlib, attribute: import_module}
        method: import_module
        args: [tiferet.blueprints.tester]
        as: tester_blueprints
      - target: {module_path: importlib, attribute: import_module}
        method: import_module
        args: [tiferet]
        as: tiferet_mod
      - target: {module_path: importlib, attribute: import_module}
        method: import_module
        args: [tiferet.blueprints]
        as: blueprints_mod
      - target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.tiferet_mod, __all__]
        as: tiferet_all
      - target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.blueprints_mod, __all__]
        as: blueprints_all
      - target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.tester_blueprints, add_fixture]
        as: fn_add_fixture
      - target: {module_path: builtins, attribute: hasattr}
        method: hasattr
        args: [$r.fn_add_fixture, __call__]
        as: callable_add_fixture
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.tiferet_all, add_fixture]
        as: in_tiferet_add_fixture
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.blueprints_all, add_fixture]
        as: in_blueprints_add_fixture
      - target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.tester_blueprints, get_fixture]
        as: fn_get_fixture
      - target: {module_path: builtins, attribute: hasattr}
        method: hasattr
        args: [$r.fn_get_fixture, __call__]
        as: callable_get_fixture
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.tiferet_all, get_fixture]
        as: in_tiferet_get_fixture
      - target: {module_path: operator, attribute: contains}
        method: contains
        args: [$r.blueprints_all, get_fixture]
        as: in_blueprints_get_fixture
      - target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.tester_blueprints, list_fixtures]
        as: fn_list_fixtures
      - target: {module_path: builtins, attribute: hasattr}
        method: hasattr
        args: [$r.fn_list_fixtures, __call__]

fixtures:
  empty_cache:
    module_path: &cache_module tiferet.contexts.cache
    class_name: &cache_class CacheContext
    attributes: {}
  bare_interface:
    module_path: &domain tiferet.domain
    class_name: &app_session AppSession
    attributes:
      id: test
      name: Test App
  service_override_interface:
    module_path: *domain
    class_name: *app_session
    attributes:
      id: test
      name: Test App
      services:
        - service_id: error_service
          module_path: tiferet.repos.di
          class_name: DIConfigRepository
  constant_override_interface:
    module_path: *domain
    class_name: *app_session
    attributes:
      id: test
      name: Test App
      constants:
        error_config: override.yml
  redeclared_service_interface:
    module_path: *domain
    class_name: *app_session
    attributes:
      id: test
      name: Test App
      constants:
        error_config: override.yml
      services:
        - service_id: error_service
          module_path: tiferet.repos.error
          class_name: ErrorConfigRepository
  test_app_session:
    module_path: *domain
    class_name: *app_session
    attributes:
      id: test_app
      name: Test App
  test_cli_session:
    module_path: *domain
    class_name: *app_session
    attributes:
      id: test_cli
      name: Test CLI
  cached_error:
    module_path: *domain
    class_name: Error
    attributes:
      id: CACHED_ERROR
      name: Cached Error
  miss_error:
    module_path: *domain
    class_name: Error
    attributes:
      id: MISS_ERROR
      name: Miss Error
  new_error:
    module_path: *domain
    class_name: Error
    attributes:
      id: NEW_ERROR
      name: New Error
  feature:
    module_path: *domain
    class_name: Feature
    attributes:
      id: group.feat
      group_id: group
      feature_key: feat
      name: Feat
  event_app_error:
    module_path: tiferet
    class_name: TiferetError
    attributes:
      error_code: APP_ERROR
      message: 'SQLite execution failed: no such table: users'
      error_message: 'no such table: users'
  request:
    module_path: tiferet.contexts.request
    class_name: RequestContext
    attributes:
      data: {}
  repo_formatter:
    module_path: &logging_domain tiferet.domain.logging
    class_name: Formatter
    attributes:
      id: repo
      name: Repo Formatter
      format: '%(message)s'
  repo_handler:
    module_path: *logging_domain
    class_name: Handler
    attributes:
      id: repo_h
      name: Repo Handler
      module_path: logging
      class_name: NullHandler
      level: INFO
      formatter: repo
  repo_logger:
    module_path: *logging_domain
    class_name: Logger
    attributes:
      id: root
      name: Root
      level: INFO
      handlers: [repo_h]
      is_root: true
  empty_logging_settings:
    module_path: tiferet.contexts.logging
    class_name: LoggingSettings
    attributes:
      formatters: []
      handlers: []
      loggers: []

tests:

  build_cache_seeds_no_default_catalogs:
    conditions: {}
    execute:
      - target:
          module_path: tiferet.blueprints.core
          attribute: build_cache
        method: build_cache
        as: cache
      - target: $r.cache
        method: get_by_prefix
        args: [app, errors]
        as: errors
      - target: $r.cache
        method: get_by_prefix
        args: [app, services]
        as: services
      - target: $r.cache
        method: get_by_prefix
        args: [app, constants]
        as: constants
      - target: $r.cache
        method: get_by_prefix
        args: [app, sessions]
        as: sessions
      - target: $r.cache
        method: get_by_prefix
        args: [logging]
        as: logging
    assert:
      - outcome: cache
        type:
          module_path: tiferet.contexts.cache
          class_name: CacheContext
      - outcome: errors
        equals: {}
      - outcome: services
        equals: {}
      - outcome: constants
        equals: {}
      - outcome: sessions
        equals: {}
      - outcome: logging
        equals: {}

  create_app_service_default_composes_app_config_repository:
    conditions: {}
    execute:
      - target:
          module_path: tiferet.blueprints.core
          attribute: create_app_service
        method: create_app_service
        as: service
    assert:
      - outcome: service
        type:
          module_path: tiferet.repos.app
          class_name: AppConfigRepository
      - outcome: service
        attribute: config_file
        equals: config.yml

  create_app_service_default_parameters_fallback:
    conditions: {}
    execute:
      - target:
          module_path: tiferet.blueprints.core
          attribute: create_app_service
        method: create_app_service
        as: service
      - target:
          module_path: importlib
          attribute: import_module
        method: import_module
        args: [tiferet.assets.app]
        as: app_assets
      - target:
          module_path: builtins
          attribute: getattr
        method: getattr
        args: [$r.app_assets, DEFAULT_APP_SERVICE_PARAMETERS]
        as: parameters
      - target: $r.parameters
        method: get
        args: [app_config]
        as: default_app_config
    assert:
      - outcome: service
        attribute: config_file
        equals: $r.default_app_config

  create_app_service_custom_parameter_wiring:
    conditions: {}
    execute:
      - target:
          module_path: tiferet.blueprints.core
          attribute: create_app_service
        method: create_app_service
        kwargs:
          parameters: {app_config: custom.yml}
        as: service
    assert:
      - outcome: service
        type:
          module_path: tiferet.repos.app
          class_name: AppConfigRepository
      - outcome: service
        attribute: config_file
        equals: custom.yml


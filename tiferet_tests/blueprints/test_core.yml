        args: [$r.cache_middleware, null]
        as: cache_middleware_missing
    assert:
      - outcome: di_service_missing
        equals: false
      - outcome: error_service_missing
        equals: false
      - outcome: logging_service_missing
        equals: false
      - outcome: feature_service_missing
        equals: false
      - outcome: get_error_evt_missing
        equals: false
      - outcome: get_feature_evt_missing
        equals: false
      - outcome: logging_list_all_evt_missing

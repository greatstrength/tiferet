  get_error_handler_cache_hit:
    conditions:
      fixtures: [cached_error, empty_cache]
      mocks:
        get_dependency:
          module_path: tiferet.di
          class_name: DIDynamicServiceResolver
    execute:
      - target: empty_cache
        method: set
        args: [CACHED_ERROR, $fixture.cached_error, app, errors]
      - target:
          module_path: tiferet.blueprints.core
          attribute: get_error
        method: get_error
        args: [$fixture.empty_cache, $mock.get_dependency]
        as: handler
      - target: $r.handler
        method: __call__
        args: [CACHED_ERROR]
        as: result
      - target:
          module_path: operator
          attribute: is_
        method: is_
        args: [$r.result, $fixture.cached_error]
        as: same
    assert:
      - outcome: same
        equals: true
      - mock: get_dependency
        method: __call__
        assert_called_once_with:
          times: 0


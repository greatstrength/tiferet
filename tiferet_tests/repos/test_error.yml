fixtures:
  new_error:
    module_path: tiferet.mappers.error
    class_name: ErrorAggregate
    attributes:
      id: NEW_ERROR_CODE
      name: New Error
      message:
        - lang: en
          text: A new error occurred
        - lang: es
          text: "Ocurri\u00f3 un nuevo error"

testers:
  test_error_config_repository:
    module_path: tiferet.repos.error
    class_name: ErrorConfigRepository
    attributes:
      error_config: $r.config_path
    tests:
      test_exists:
        conditions:
          stage: true
        execute:
          - target: $stage
            method: write
            args:
              - test_error.yaml
              - &error_seed |
                errors:
                  TEST_ERROR_CODE:
                    name: Test Error
                    message:
                      - lang: en
                        text: A test error occurred
                      - lang: es
                        text: "Ocurri\u00f3 un error de prueba"
                  TEST_FORMATTED_ERROR_CODE:
                    name: Test Formatted Error
                    message:
                      - lang: en
                        text: Error for {item_name}
                      - lang: es
                        text: Error para {item_name}
            as: config_path
          - target: self
            method: new
            as: repo
          - target: $r.repo
            method: exists
            args: [TEST_ERROR_CODE]
            as: error_exists
          - target: $r.repo
            method: exists
            args: [TEST_FORMATTED_ERROR_CODE]
            as: formatted_exists
          - target: $r.repo
            method: exists
            args: [MISSING_ERROR_CODE]
            as: missing_exists
        assert:
          - outcome: error_exists
            equals: true
          - outcome: formatted_exists
            equals: true
          - outcome: missing_exists
            equals: false

      test_get:
        conditions:
          stage: true
        execute:
          - target: $stage
            method: write
            args: [test_error.yaml, *error_seed]
            as: config_path
          - target: self
            method: new
            as: repo
          - target: $r.repo
            method: get
            args: [TEST_ERROR_CODE]
            as: test_error
          - target: $r.repo
            method: get
            args: [TEST_FORMATTED_ERROR_CODE]
            as: formatted_error
          - target: $r.repo
            method: get
            args: [MISSING_ERROR_CODE]
            as: missing_error
        assert:
          - outcome: test_error
            fields:
              id: TEST_ERROR_CODE
              name: Test Error
          - outcome: formatted_error
            fields:
              id: TEST_FORMATTED_ERROR_CODE
              name: Test Formatted Error
          - outcome: missing_error
            'null': true

      test_list:
        conditions:
          stage: true
        execute:
          - target: $stage
            method: write
            args: [test_error.yaml, *error_seed]
            as: config_path
          - target: self
            method: new
            as: repo
          - target: $r.repo
            method: list
            as: listed
        assert:
          - outcome: listed
            fields:
              key: id
              items:
                TEST_ERROR_CODE: {id: TEST_ERROR_CODE}
                TEST_FORMATTED_ERROR_CODE: {id: TEST_FORMATTED_ERROR_CODE}

      test_save:
        conditions:
          stage: true
          fixtures: [new_error]
        execute:
          - target: $stage
            method: write
            args: [test_error.yaml, *error_seed]
            as: config_path
          - target: self
            method: new
            as: repo
          - target: $r.repo
            method: save
            args: [$fixture.new_error]
          - target: $r.repo
            method: get
            args: [NEW_ERROR_CODE]
            as: saved
        assert:
          - outcome: saved
            fields:
              id: NEW_ERROR_CODE
              name: New Error

      test_delete:
        conditions:
          stage: true
        execute:
          - target: $stage
            method: write
            args: [test_error.yaml, *error_seed]
            as: config_path
          - target: self
            method: new
            as: repo
          - target: $r.repo
            method: delete
            args: [TEST_FORMATTED_ERROR_CODE]
          - target: $r.repo
            method: get
            args: [TEST_FORMATTED_ERROR_CODE]
            as: deleted
          - target: $r.repo
            method: delete
            args: [TEST_FORMATTED_ERROR_CODE]
        assert:
          - outcome: deleted
            'null': true

      test_new:
        conditions:
          stage: true
        execute:
          - target: $stage
            method: write
            args: [test_error.yaml, *error_seed]
            as: config_path
          - target: self
            method: new
            as: repo
        assert:
          - outcome: repo
            type:
              module_path: tiferet.repos.error
              class_name: ErrorConfigRepository
          - outcome: repo
            fields:
              default_role: to_data

      test_format_dispatch:
        conditions:
          stage: true
        execute:
          - target: $stage
            method: write
            args: [dispatch.yaml, "root: {}\n"]
            as: yaml_path
          - target: $stage
            method: write
            args: [dispatch.json, "{\"root\": {}}\n"]
            as: json_path
          - target:
              module_path: tiferet.repos.error
              attribute: ErrorConfigRepository
            method: ErrorConfigRepository
            kwargs:
              error_config: $r.yaml_path
            as: yaml_repo
          - target: $r.yaml_repo
            method: _save
            args: [{root: {ok: true}}]
          - target: $r.yaml_repo
            method: _load
            as: yaml_loaded
          - target: $r.yaml_loaded
            method: __eq__
            args: [{root: {ok: true}}]
            as: yaml_exact
          - target:
              module_path: tiferet.repos.error
              attribute: ErrorConfigRepository
            method: ErrorConfigRepository
            kwargs:
              error_config: $r.json_path
            as: json_repo
          - target: $r.json_repo
            method: _save
            args: [{root: {ok: true}}]
          - target: $r.json_repo
            method: _load
            as: json_loaded
          - target: $r.json_loaded
            method: __eq__
            args: [{root: {ok: true}}]
            as: json_exact
        assert:
          - outcome: yaml_loaded
            equals: {root: {ok: true}}
          - outcome: yaml_exact
            equals: true
          - outcome: json_loaded
            equals: {root: {ok: true}}
          - outcome: json_exact
            equals: true

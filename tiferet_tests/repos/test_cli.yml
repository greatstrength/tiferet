fixtures:
  new_cmd:
    module_path: tiferet.mappers.cli
    class_name: CliCommandAggregate
    attributes:
      id: calc.multiply
      name: Multiply Number Command
      description: Multiplies two numbers.
      key: multiply
      group_key: calc
      arguments:
        - name_or_flags: ['--value1', '-v1']
          description: The first number to multiply.
          type: str
        - name_or_flags: ['--value2', '-v2']
          description: The second number to multiply.
          type: str

testers:
  test_cli_config_repository:
    module_path: tiferet.repos.cli
    class_name: CliConfigRepository
    attributes:
      cli_config: $r.config_path
    tests:
      test_exists:
        conditions:
          stage: true
        execute:
          - target: $stage
            method: write
            args:
              - test_cli.yaml
              - &cli_seed |
                cli:
                  cmds:
                    calc:
                      add:
                        name: Add Number Command
                        description: Adds two numbers.
                        key: add
                        group_key: calc
                        args:
                          - name_or_flags: ['--value1', '-v1']
                            description: The first number to add.
                            type: str
                          - name_or_flags: ['--value2', '-v2']
                            description: The second number to add.
                            type: str
                      subtract:
                        name: Subtract Number Command
                        description: Subtracts one number from another.
                        key: subtract
                        group_key: calc
                        args:
                          - name_or_flags: ['--value1', '-v1']
                            description: The number to subtract from.
                            type: str
                          - name_or_flags: ['--value2', '-v2']
                            description: The number to subtract.
                            type: str
                  parent_args:
                    - name_or_flags: ['--verbose', '-v']
                      description: Enable verbose output.
                      type: bool
                    - name_or_flags: ['--config', '-c']
                      description: Path to configuration file.
                      type: str
            as: config_path
          - target: self
            method: new
            as: repo
          - target: $r.repo
            method: exists
            args: [calc.add]
            as: add_exists
          - target: $r.repo
            method: exists
            args: [calc.subtract]
            as: subtract_exists
          - target: $r.repo
            method: exists
            args: [calc.missing]
            as: missing_exists
        assert:
          - outcome: add_exists
            equals: true
          - outcome: subtract_exists
            equals: true
          - outcome: missing_exists
            equals: false

      test_get:
        conditions:
          stage: true
        execute:
          - target: $stage
            method: write
            args: [test_cli.yaml, *cli_seed]
            as: config_path
          - target: self
            method: new
            as: repo
          - target: $r.repo
            method: get
            args: [calc.add]
            as: add_cmd
          - target: $r.repo
            method: get
            args: [calc.missing]
            as: missing_cmd
        assert:
          - outcome: add_cmd
            fields:
              id: calc.add
              name: Add Number Command
          - outcome: missing_cmd
            'null': true

      test_list:
        conditions:
          stage: true
        execute:
          - target: $stage
            method: write
            args: [test_cli.yaml, *cli_seed]
            as: config_path
          - target: self
            method: new
            as: repo
          - target: $r.repo
            method: list
            as: listed
        assert:
          - outcome: listed
            fields:
              key: id
              items:
                calc.add: {id: calc.add}
                calc.subtract: {id: calc.subtract}

      test_save:
        conditions:
          stage: true
          fixtures: [new_cmd]
        execute:
          - target: $stage
            method: write
            args: [test_cli.yaml, *cli_seed]
            as: config_path
          - target: self
            method: new
            as: repo
          - target: $r.repo
            method: save
            args: [$fixture.new_cmd]
          - target: $r.repo
            method: get
            args: [calc.multiply]
            as: saved
        assert:
          - outcome: saved
            fields:
              id: calc.multiply
              name: Multiply Number Command

      test_delete:
        conditions:
          stage: true
        execute:
          - target: $stage
            method: write
            args: [test_cli.yaml, *cli_seed]
            as: config_path
          - target: self
            method: new
            as: repo
          - target: $r.repo
            method: delete
            args: [calc.subtract]
          - target: $r.repo
            method: get
            args: [calc.subtract]
            as: deleted
          - target: $r.repo
            method: delete
            args: [calc.subtract]
        assert:
          - outcome: deleted
            'null': true

testers:
  test_configuration_repository:
    module_path: tiferet.repos.core
    class_name: ConfigurationRepository
    attributes:
      config_file: $r.config_path
    tests:
      test_new:
        conditions:
          stage: true
        execute:
          - target: $stage
            method: write
            args: [config.yaml, "root: {}\n"]
            as: config_path
          - target: self
            method: new
            as: repo
        assert:
          - outcome: repo
            type:
              module_path: tiferet.repos.core
              class_name: ConfigurationRepository
          - outcome: repo
            fields:
              default_role: to_data

      test_format_dispatch:
        conditions:
          stage: true
        execute:
          - target: $stage
            method: write
            args: [dispatch.yaml, "root: {}\n"]
            as: yaml_path
          - target: $stage
            method: write
            args: [dispatch.json, "{\"root\": {}}\n"]
            as: json_path
          - target:
              module_path: tiferet.repos.core
              attribute: ConfigurationRepository
            method: ConfigurationRepository
            kwargs:
              config_file: $r.yaml_path
            as: yaml_repo
          - target: $r.yaml_repo
            method: _save
            args: [{root: {ok: true}}]
          - target: $r.yaml_repo
            method: _load
            as: yaml_loaded
          - target: $r.yaml_loaded
            method: __eq__
            args: [{root: {ok: true}}]
            as: yaml_exact
          - target:
              module_path: tiferet.repos.core
              attribute: ConfigurationRepository
            method: ConfigurationRepository
            kwargs:
              config_file: $r.json_path
            as: json_repo
          - target: $r.json_repo
            method: _save
            args: [{root: {ok: true}}]
          - target: $r.json_repo
            method: _load
            as: json_loaded
          - target: $r.json_loaded
            method: __eq__
            args: [{root: {ok: true}}]
            as: json_exact
        assert:
          - outcome: yaml_loaded
            equals: {root: {ok: true}}
          - outcome: yaml_exact
            equals: true
          - outcome: json_loaded
            equals: {root: {ok: true}}
          - outcome: json_exact
            equals: true

      test_get_loader_yaml:
        conditions:
          stage: true
        execute:
          - target: $stage
            method: write
            args: [config.yaml, "root: {}\n"]
            as: config_path
          - target: self
            method: new
            as: repo
          - target: $r.repo
            method: _get_loader
            as: loader
        assert:
          - outcome: loader
            type:
              module_path: tiferet.utils.yaml
              class_name: YamlLoader

      test_get_loader_json:
        conditions:
          stage: true
        execute:
          - target: $stage
            method: write
            args: [config.json, "{\"root\": {}}\n"]
            as: config_path
          - target: self
            method: new
            as: repo
          - target: $r.repo
            method: _get_loader
            as: loader
        assert:
          - outcome: loader
            type:
              module_path: tiferet.utils.json
              class_name: JsonLoader

      test_unsupported_config_file_type:
        conditions:
          stage: true
        execute:
          - target: $stage
            method: path
            args: [config.txt]
            as: config_path
          - target: self
            method: new
            as: repo
          - target: $r.repo
            method: _get_loader
            raises: true
            as: failed
        assert:
          - outcome: failed
            type:
              module_path: tiferet.interfaces.core
              class_name: ServiceError
          - outcome: failed
            error_code: UNSUPPORTED_CONFIG_FILE_TYPE
          - outcome: failed
            fields:
              class_name: ConfigurationRepository
              target_method: _get_loader

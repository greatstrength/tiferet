fixtures:
  new_app:
    module_path: tiferet.mappers.app
    class_name: AppSessionAggregate
    attributes:
      id: new.app
      name: New App
      description: A new test app interface.

testers:
  test_app_config_repository:
    module_path: tiferet.repos.app
    class_name: AppConfigRepository
    attributes:
      app_config: $r.config_path
    tests:
      test_exists:
        conditions:
          stage: true
        execute:
          - target: $stage
            method: write
            args:
              - test_app.yaml
              - &app_seed |
                sessions:
                  test.app:
                    name: Test App
                    description: A test app interface.
                    attrs: {}
                    const: {}
                  another.app:
                    name: Another App
                    description: Another test app interface.
                    attrs: {}
                    const: {}
            as: config_path
          - target: self
            method: new
            as: repo
          - target: $r.repo
            method: exists
            args: [test.app]
            as: test_app_exists
          - target: $r.repo
            method: exists
            args: [another.app]
            as: another_app_exists
          - target: $r.repo
            method: exists
            args: [missing.app]
            as: missing_app_exists
        assert:
          - outcome: test_app_exists
            equals: true
          - outcome: another_app_exists
            equals: true
          - outcome: missing_app_exists
            equals: false

      test_get:
        conditions:
          stage: true
        execute:
          - target: $stage
            method: write
            args: [test_app.yaml, *app_seed]
            as: config_path
          - target: self
            method: new
            as: repo
          - target: $r.repo
            method: get
            args: [test.app]
            as: test_app
          - target: $r.repo
            method: get
            args: [another.app]
            as: another_app
          - target: $r.repo
            method: get
            args: [missing.app]
            as: missing_app
        assert:
          - outcome: test_app
            fields:
              id: test.app
              name: Test App
          - outcome: another_app
            fields:
              id: another.app
              name: Another App
          - outcome: missing_app
            'null': true

      test_list:
        conditions:
          stage: true
        execute:
          - target: $stage
            method: write
            args: [test_app.yaml, *app_seed]
            as: config_path
          - target: self
            method: new
            as: repo
          - target: $r.repo
            method: list
            as: listed
        assert:
          - outcome: listed
            fields:
              key: id
              items:
                test.app: {id: test.app}
                another.app: {id: another.app}

      test_save:
        conditions:
          stage: true
          fixtures: [new_app]
        execute:
          - target: $stage
            method: write
            args: [test_app.yaml, *app_seed]
            as: config_path
          - target: self
            method: new
            as: repo
          - target: $r.repo
            method: save
            args: [$fixture.new_app]
          - target: $r.repo
            method: get
            args: [new.app]
            as: saved
        assert:
          - outcome: saved
            fields:
              id: new.app
              name: New App

      test_delete:
        conditions:
          stage: true
        execute:
          - target: $stage
            method: write
            args: [test_app.yaml, *app_seed]
            as: config_path
          - target: self
            method: new
            as: repo
          - target: $r.repo
            method: delete
            args: [another.app]
          - target: $r.repo
            method: get
            args: [another.app]
            as: deleted
          - target: $r.repo
            method: delete
            args: [another.app]
        assert:
          - outcome: deleted
            'null': true

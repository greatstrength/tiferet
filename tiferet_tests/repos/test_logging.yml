testers:
  test_logging_config_repository:
    module_path: tiferet.repos.logging
    class_name: LoggingConfigRepository
    attributes:
      logging_config: $r.config_path
    tests:
      test_new:
        conditions:
          stage: true
        execute:
          - target: $stage
            method: write
            args:
              - test_logging.yaml
              - |
                logging:
                  formatters:
                    test_formatter:
                      name: Test Formatter
                      description: A test formatter
                      format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
                      datefmt: '%Y-%m-%d %H:%M:%S'
                  handlers:
                    test_handler:
                      name: Test Handler
                      description: A test handler
                      module_path: logging
                      class_name: StreamHandler
                      level: INFO
                      formatter: test_formatter
                      stream: ext://sys.stdout
                  loggers:
                    test_logger:
                      name: Test Logger
                      description: A test logger
                      level: DEBUG
                      handlers: [test_handler]
                      propagate: false
                      is_root: false
            as: config_path
          - target: self
            method: new
            as: repo
        assert:
          - outcome: repo
            type:
              module_path: tiferet.repos.logging
              class_name: LoggingConfigRepository
          - outcome: repo
            fields:
              default_role: to_data

      test_format_dispatch:
        conditions:
          stage: true
        execute:
          - target: $stage
            method: write
            args: [dispatch.yaml, "root: {}\n"]
            as: yaml_path
          - target: $stage
            method: write
            args: [dispatch.json, "{\"root\": {}}\n"]
            as: json_path
          - target:
              module_path: tiferet.repos.logging
              attribute: LoggingConfigRepository
            method: LoggingConfigRepository
            kwargs:
              logging_config: $r.yaml_path
            as: yaml_repo
          - target: $r.yaml_repo
            method: _save
            args: [{root: {ok: true}}]
          - target: $r.yaml_repo
            method: _load
            as: yaml_loaded
          - target: $r.yaml_loaded
            method: __eq__
            args: [{root: {ok: true}}]
            as: yaml_exact
          - target:
              module_path: tiferet.repos.logging
              attribute: LoggingConfigRepository
            method: LoggingConfigRepository
            kwargs:
              logging_config: $r.json_path
            as: json_repo
          - target: $r.json_repo
            method: _save
            args: [{root: {ok: true}}]
          - target: $r.json_repo
            method: _load
            as: json_loaded
          - target: $r.json_loaded
            method: __eq__
            args: [{root: {ok: true}}]
            as: json_exact
        assert:
          - outcome: yaml_loaded
            equals: {root: {ok: true}}
          - outcome: yaml_exact
            equals: true
          - outcome: json_loaded
            equals: {root: {ok: true}}
          - outcome: json_exact
            equals: true

      list_all:
        conditions:
          stage: true
        execute:
          - target: $stage
            method: write
            args:
              - test_logging.yaml
              - &logging_seed |
                logging:
                  formatters:
                    test_formatter:
                      name: Test Formatter
                      description: A test formatter
                      format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
                      datefmt: '%Y-%m-%d %H:%M:%S'
                  handlers:
                    test_handler:
                      name: Test Handler
                      description: A test handler
                      module_path: logging
                      class_name: StreamHandler
                      level: INFO
                      formatter: test_formatter
                      stream: ext://sys.stdout
                  loggers:
                    test_logger:
                      name: Test Logger
                      description: A test logger
                      level: DEBUG
                      handlers: [test_handler]
                      propagate: false
                      is_root: false
            as: config_path
          - target: self
            method: new
            as: repo
          - target: $r.repo
            method: list_all
            as: listed
          - target: $r.listed
            method: __getitem__
            args: [0]
            as: formatters
          - target: $r.listed
            method: __getitem__
            args: [1]
            as: handlers
          - target: $r.listed
            method: __getitem__
            args: [2]
            as: loggers
          - target: $r.formatters
            method: __len__
            as: formatter_count
          - target: $r.handlers
            method: __len__
            as: handler_count
          - target: $r.loggers
            method: __len__
            as: logger_count
          - target: $r.formatters
            method: __getitem__
            args: [0]
            as: formatter
          - target: $r.handlers
            method: __getitem__
            args: [0]
            as: handler
          - target: $r.loggers
            method: __getitem__
            args: [0]
            as: logger
        assert:
          - outcome: formatter_count
            equals: 1
          - outcome: handler_count
            equals: 1
          - outcome: logger_count
            equals: 1
          - outcome: formatter
            fields:
              id: test_formatter
              name: Test Formatter
              format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
          - outcome: handler
            fields:
              id: test_handler
              name: Test Handler
              level: INFO
              formatter: test_formatter
          - outcome: logger
            fields:
              id: test_logger
              name: Test Logger
              level: DEBUG
              handlers: [test_handler]

      save_formatter:
        conditions:
          stage: true
        execute:
          - target: $stage
            method: write
            args: [test_logging.yaml, *logging_seed]
            as: config_path
          - target: self
            method: new
            as: repo
          - target:
              module_path: tiferet.mappers.logging
              class_name: FormatterConfigObject
            method: model_validate
            args:
              - id: new_test_formatter
                name: New Test Formatter
                description: A new test formatter
                format: '%(levelname)s - %(message)s'
                datefmt: '%H:%M:%S'
            as: config_object
          - target: $r.config_object
            method: map
            as: config
          - target: $r.repo
            method: save_formatter
            args: [$r.config]
          - target: $r.repo
            method: list_all
            as: listed
          - target: $r.listed
            method: __getitem__
            args: [0]
            as: formatters
        assert:
          - outcome: formatters
            fields:
              key: id
              items:
                test_formatter: {id: test_formatter}
                new_test_formatter:
                  id: new_test_formatter
                  name: New Test Formatter
                  format: '%(levelname)s - %(message)s'

      save_handler:
        conditions:
          stage: true
        execute:
          - target: $stage
            method: write
            args: [test_logging.yaml, *logging_seed]
            as: config_path
          - target: self
            method: new
            as: repo
          - target:
              module_path: tiferet.mappers.logging
              class_name: HandlerConfigObject
            method: model_validate
            args:
              - id: new_test_handler
                name: New Test Handler
                description: A new test handler
                module_path: logging
                class_name: FileHandler
                level: ERROR
                formatter: test_formatter
                filename: test.log
            as: config_object
          - target: $r.config_object
            method: map
            as: config
          - target: $r.repo
            method: save_handler
            args: [$r.config]
          - target: $r.repo
            method: list_all
            as: listed
          - target: $r.listed
            method: __getitem__
            args: [1]
            as: handlers
        assert:
          - outcome: handlers
            fields:
              key: id
              items:
                test_handler: {id: test_handler}
                new_test_handler:
                  id: new_test_handler
                  name: New Test Handler
                  level: ERROR
                  class_name: FileHandler

      save_logger:
        conditions:
          stage: true
        execute:
          - target: $stage
            method: write
            args: [test_logging.yaml, *logging_seed]
            as: config_path
          - target: self
            method: new
            as: repo
          - target:
              module_path: tiferet.mappers.logging
              class_name: LoggerConfigObject
            method: model_validate
            args:
              - id: new_test_logger
                name: New Test Logger
                description: A new test logger
                level: WARNING
                handlers: [test_handler]
                propagate: true
                is_root: false
            as: config_object
          - target: $r.config_object
            method: map
            as: config
          - target: $r.repo
            method: save_logger
            args: [$r.config]
          - target: $r.repo
            method: list_all
            as: listed
          - target: $r.listed
            method: __getitem__
            args: [2]
            as: loggers
        assert:
          - outcome: loggers
            fields:
              key: id
              items:
                test_logger: {id: test_logger}
                new_test_logger:
                  id: new_test_logger
                  name: New Test Logger
                  level: WARNING
                  propagate: true

      delete_formatter:
        conditions:
          stage: true
        execute:
          - target: $stage
            method: write
            args: [test_logging.yaml, *logging_seed]
            as: config_path
          - target: self
            method: new
            as: repo
          - target: $r.repo
            method: delete_formatter
            args: [test_formatter]
          - target: $r.repo
            method: list_all
            as: listed
          - target: $r.listed
            method: __getitem__
            args: [0]
            as: formatters
        assert:
          - outcome: formatters
            equals: []

      delete_handler:
        conditions:
          stage: true
        execute:
          - target: $stage
            method: write
            args: [test_logging.yaml, *logging_seed]
            as: config_path
          - target: self
            method: new
            as: repo
          - target: $r.repo
            method: delete_handler
            args: [test_handler]
          - target: $r.repo
            method: list_all
            as: listed
          - target: $r.listed
            method: __getitem__
            args: [1]
            as: handlers
        assert:
          - outcome: handlers
            equals: []

      delete_logger:
        conditions:
          stage: true
        execute:
          - target: $stage
            method: write
            args: [test_logging.yaml, *logging_seed]
            as: config_path
          - target: self
            method: new
            as: repo
          - target: $r.repo
            method: delete_logger
            args: [test_logger]
          - target: $r.repo
            method: list_all
            as: listed
          - target: $r.listed
            method: __getitem__
            args: [2]
            as: loggers
        assert:
          - outcome: loggers
            equals: []

      empty_sections:
        conditions:
          stage: true
        execute:
          - target: $stage
            method: write
            args:
              - empty_logging.yaml
              - |
                logging:
                  formatters: {}
                  handlers: {}
                  loggers: {}
            as: config_path
          - target: self
            method: new
            as: repo
          - target: $r.repo
            method: list_all
            as: listed
          - target: $r.listed
            method: __len__
            as: section_count
          - target: $r.listed
            method: __getitem__
            args: [0]
            as: formatters
          - target: $r.listed
            method: __getitem__
            args: [1]
            as: handlers
          - target: $r.listed
            method: __getitem__
            args: [2]
            as: loggers
          - target: $r.formatters
            method: __len__
            as: formatter_count
          - target: $r.handlers
            method: __len__
            as: handler_count
          - target: $r.loggers
            method: __len__
            as: logger_count
        assert:
          - outcome: section_count
            equals: 3
          - outcome: formatter_count
            equals: 0
          - outcome: handler_count
            equals: 0
          - outcome: logger_count
            equals: 0

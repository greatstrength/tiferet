testers:
  test_logging_config_repository:
    module_path: tiferet.repos.logging
    class_name: LoggingConfigRepository
    attributes:
      logging_config: $r.config_path
    tests:
      test_new:
        conditions:
          stage: true
        execute:
          - target: $stage
            method: write
            args:
              - test_logging.yaml
              - |
                logging:
                  formatters:
                    test_formatter:
                      name: Test Formatter
                      description: A test formatter
                      format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
                      datefmt: '%Y-%m-%d %H:%M:%S'
                  handlers:
                    test_handler:
                      name: Test Handler
                      description: A test handler
                      module_path: logging
                      class_name: StreamHandler
                      level: INFO
                      formatter: test_formatter
                      stream: ext://sys.stdout
                  loggers:
                    test_logger:
                      name: Test Logger
                      description: A test logger
                      level: DEBUG
                      handlers: [test_handler]
                      propagate: false
                      is_root: false
            as: config_path
          - target: self
            method: new
            as: repo
        assert:
          - outcome: repo
            type:
              module_path: tiferet.repos.logging
              class_name: LoggingConfigRepository
          - outcome: repo
            fields:
              default_role: to_data

      test_format_dispatch:
        conditions:
          stage: true
        execute:
          - target: $stage
            method: write
            args: [dispatch.yaml, "root: {}\n"]
            as: yaml_path
          - target: $stage
            method: write
            args: [dispatch.json, "{\"root\": {}}\n"]
            as: json_path
          - target:
              module_path: tiferet.repos.logging
              attribute: LoggingConfigRepository
            method: LoggingConfigRepository
            kwargs:
              logging_config: $r.yaml_path
            as: yaml_repo
          - target: $r.yaml_repo
            method: _save
            args: [{root: {ok: true}}]
          - target: $r.yaml_repo
            method: _load
            as: yaml_loaded
          - target: $r.yaml_loaded
            method: __eq__
            args: [{root: {ok: true}}]
            as: yaml_exact
          - target:
              module_path: tiferet.repos.logging
              attribute: LoggingConfigRepository
            method: LoggingConfigRepository
            kwargs:
              logging_config: $r.json_path
            as: json_repo
          - target: $r.json_repo
            method: _save
            args: [{root: {ok: true}}]
          - target: $r.json_repo
            method: _load
            as: json_loaded
          - target: $r.json_loaded
            method: __eq__
            args: [{root: {ok: true}}]
            as: json_exact
        assert:
          - outcome: yaml_loaded
            equals: {root: {ok: true}}
          - outcome: yaml_exact
            equals: true
          - outcome: json_loaded
            equals: {root: {ok: true}}
          - outcome: json_exact
            equals: true

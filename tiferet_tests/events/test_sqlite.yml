            sqlite_service: *sqlite_service
        execute:
          - target: self
            method: handle
            kwargs:
              table_name: users
              columns: {}
            raises: true
            as: failed
        assert:
          - outcome: failed
            error_code: COMMAND_PARAMETER_REQUIRED
          - outcome: failed
            message: Columns must be a non-empty dictionary
      invalid_column_name:

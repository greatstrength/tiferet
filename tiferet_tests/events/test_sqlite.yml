            raises: true
            as: failed
        assert:
          - outcome: failed
            error_code: COMMAND_PARAMETER_REQUIRED
          - outcome: failed
            message: Column name must be a non-empty string
      invalid_column_type:
        conditions:
          mocks:
            sqlite_service: *sqlite_service
        execute:
          - target: self
            method: handle
            kwargs:
              table_name: users
              columns:

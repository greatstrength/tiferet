            raises: true
            as: failed
        assert:
          - outcome: failed
            error_code: COMMAND_PARAMETER_REQUIRED
          - outcome: failed
            message: must be a non-empty string
      service_error_propagates:
        conditions:
          mocks:
            sqlite_service:
              <<: *sqlite_service
              return_value:
                execute:
                  raises:
                    module_path: tiferet.interfaces.core
                    class_name: ServiceError
                    message: SQLITE_STATEMENT_FAILED
        execute:
          - target: self
            method: handle
            kwargs:
              table_name: users
              columns:
                id: INVALID_TYPE
            raises: true
            as: failed
        assert:
          - outcome: failed
            error_code: SQLITE_STATEMENT_FAILED
          - outcome: failed
            type:
              module_path: tiferet.assets.core
              class_name: TiferetError
              negate: true
      missing_required_params:
        conditions:
          mocks:
            sqlite_service: *sqlite_service

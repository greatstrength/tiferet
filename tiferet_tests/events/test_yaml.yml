fixtures:
  probe: &probe
    module_path: tiferet.domain.error
    class_name: ErrorMessage
    attributes:
      lang: en_US
      text: probe

testers:
  test_yaml_event:
    module_path: &yaml_events tiferet.events.yaml
    class_name: YamlEvent
    tests:
      event_base:
        conditions:
          fixtures: [probe]
          mocks:
            yaml_service: &yaml_service
              module_path: tiferet.interfaces.yaml
              class_name: YamlService
        execute:
          - target: probe
            method: format
            as: formatted
        assert:
          - event_base:
              module_path: tiferet.events.core
              class_name: DomainEvent

  test_yaml_loader:
    module_path: &yaml_utils tiferet.utils.yaml
    class_name: YamlLoader
    tests:
      unbound:
        conditions: {}
        execute:
          - target: self
            method: new
            as: loader
          - target:
              module_path: builtins
              attribute: getattr
            method: getattr
            args: [$r.loader, path]
            as: bound_path
        assert:
          - outcome: loader
            type:
              module_path: tiferet.interfaces.yaml
              class_name: YamlService
          - outcome: bound_path
            "null": true

  test_load_yaml:
    module_path: *yaml_events
    class_name: LoadYaml
    tests:
      load_mapping:
        conditions:
          mocks:
            yaml_service:
              <<: *yaml_service
              return_value:
                load_mapping:
                  name: first
        execute:
          - target: self
            method: handle
            kwargs:
              path: notes.yml
            as: loaded
        assert:
          - outcome: loaded
            equals:
              name: first
          - mock: yaml_service
            method: load_mapping
            assert_called_once_with:
              args: [notes.yml]
      missing_path:
        conditions:
          mocks:
            yaml_service: *yaml_service
        execute:
          - target: self
            method: handle
            kwargs:
              path: null
            raises: true
            as: failed
        assert:
          - outcome: failed
            error_code: COMMAND_PARAMETER_REQUIRED
      blank_path:
        conditions:
          mocks:
            yaml_service: *yaml_service
        execute:
          - target: self
            method: handle
            kwargs:
              path: '   '
            raises: true
            as: failed
        assert:
          - outcome: failed
            error_code: COMMAND_PARAMETER_REQUIRED
      service_error_propagates:
        conditions:
          mocks:
            yaml_service:
              <<: *yaml_service
              return_value:
                load_mapping:
                  raises:
                    module_path: tiferet.interfaces.core
                    class_name: ServiceError
                    message: YAML_FILE_NOT_FOUND
        execute:
          - target: self
            method: handle
            kwargs:
              path: missing.yml
            raises: true
            as: failed
        assert:
          - outcome: failed
            type:
              module_path: tiferet.interfaces.core
              class_name: ServiceError
          - outcome: failed
            error_code: YAML_FILE_NOT_FOUND
          - outcome: failed
            type:
              module_path: tiferet.assets.core
              class_name: TiferetError
              negate: true
      mapping_required_propagates:
        conditions:
          mocks:
            yaml_service:
              <<: *yaml_service
              return_value:
                load_mapping:
                  raises:
                    module_path: tiferet.interfaces.core
                    class_name: ServiceError
                    message: YAML_MAPPING_REQUIRED
        execute:
          - target: self
            method: handle
            kwargs:
              path: list.yml
            raises: true
            as: failed
        assert:
          - outcome: failed
            error_code: YAML_MAPPING_REQUIRED

  test_save_yaml:
    module_path: *yaml_events
    class_name: SaveYaml
    tests:
      save_mapping:
        conditions:
          mocks:
            yaml_service:
              <<: *yaml_service
              return_value:
                save_mapping:
                  name: saved
                  count: 2
        execute:
          - target: self
            method: handle
            kwargs:
              path: saved.yml
              data:
                name: saved
                count: 2
            as: saved
        assert:
          - outcome: saved
            equals:
              name: saved
              count: 2
          - mock: yaml_service
            method: save_mapping
            assert_called_once_with:
              args:
                - saved.yml
                - name: saved
                  count: 2
      empty_mapping:
        conditions:
          mocks:
            yaml_service:
              <<: *yaml_service
              return_value:
                save_mapping: {}
        execute:
          - target: self
            method: handle
            kwargs:
              path: empty-map.yml
              data: {}
            as: saved
        assert:
          - outcome: saved
            equals: {}
          - mock: yaml_service
            method: save_mapping
            assert_called_once_with:
              args: [empty-map.yml, {}]
      missing_data:
        conditions:
          mocks:
            yaml_service: *yaml_service
        execute:
          - target: self
            method: handle
            kwargs:
              path: saved.yml
              data: null
            raises: true
            as: failed
        assert:
          - outcome: failed
            error_code: COMMAND_PARAMETER_REQUIRED

  test_read_anchored_yaml:
    module_path: *yaml_events
    class_name: ReadAnchoredYaml
    tests:
      read_anchored:
        conditions:
          mocks:
            yaml_service:
              <<: *yaml_service
              return_value:
                read_anchored:
                  text: 'item: &item\n'
                  anchors: [item]
        execute:
          - target: self
            method: handle
            kwargs:
              path: anchored.yml
            as: read
        assert:
          - outcome: read
            equals:
              text: 'item: &item\n'
              anchors: [item]
          - mock: yaml_service
            method: read_anchored
            assert_called_once_with:
              args: [anchored.yml]

  test_write_anchored_yaml:
    module_path: *yaml_events
    class_name: WriteAnchoredYaml
    tests:
      write_anchored:
        conditions:
          mocks:
            yaml_service:
              <<: *yaml_service
              return_value:
                write_anchored:
                  text: 'item: &item\n'
                  anchors: [item]
        execute:
          - target: self
            method: handle
            kwargs:
              path: anchored.yml
              text: 'item: &item\n'
            as: written
        assert:
          - outcome: written
            equals:
              text: 'item: &item\n'
              anchors: [item]
          - mock: yaml_service
            method: write_anchored
            assert_called_once_with:
              args: ['anchored.yml', 'item: &item\n']
      blank_text:
        conditions:
          mocks:
            yaml_service: *yaml_service
        execute:
          - target: self
            method: handle
            kwargs:
              path: anchored.yml
              text: '   '
            raises: true
            as: failed
        assert:
          - outcome: failed
            error_code: COMMAND_PARAMETER_REQUIRED
      anchor_conflict_propagates:
        conditions:
          mocks:
            yaml_service:
              <<: *yaml_service
              return_value:
                write_anchored:
                  raises:
                    module_path: tiferet.interfaces.core
                    class_name: ServiceError
                    message: YAML_ANCHOR_CONFLICT
        execute:
          - target: self
            method: handle
            kwargs:
              path: conflict.yml
              text: 'a: &item 1\n'
            raises: true
            as: failed
        assert:
          - outcome: failed
            error_code: YAML_ANCHOR_CONFLICT
          - outcome: failed
            type:
              module_path: tiferet.interfaces.core
              class_name: ServiceError

  test_list_yaml_anchors:
    module_path: *yaml_events
    class_name: ListYamlAnchors
    tests:
      list_anchors:
        conditions:
          mocks:
            yaml_service:
              <<: *yaml_service
              return_value:
                list_anchors: [first, second]
        execute:
          - target: self
            method: handle
            kwargs:
              path: notes.yml
              key_path: ignored
            as: names
        assert:
          - outcome: names
            equals: [first, second]
          - mock: yaml_service
            method: list_anchors
            assert_called_once_with:
              args: [notes.yml]
      empty_list:
        conditions:
          mocks:
            yaml_service:
              <<: *yaml_service
              return_value:
                list_anchors: []
        execute:
          - target: self
            method: handle
            kwargs:
              path: empty.yml
            as: names
        assert:
          - outcome: names
            equals: []
      missing_path:
        conditions:
          mocks:
            yaml_service: *yaml_service
        execute:
          - target: self
            method: handle
            kwargs:
              path: null
            raises: true
            as: failed
        assert:
          - outcome: failed
            error_code: COMMAND_PARAMETER_REQUIRED
      blank_path:
        conditions:
          mocks:
            yaml_service: *yaml_service
        execute:
          - target: self
            method: handle
            kwargs:
              path: '   '
            raises: true
            as: failed
        assert:
          - outcome: failed
            error_code: COMMAND_PARAMETER_REQUIRED

  test_get_yaml_anchor:
    module_path: *yaml_events
    class_name: GetYamlAnchor
    tests:
      null_value:
        conditions:
          mocks:
            yaml_service:
              <<: *yaml_service
              return_value:
                get_anchor:
                  value: null
        execute:
          - target: self
            method: handle
            kwargs:
              path: notes.yml
              name: item
              key_path: ignored
            as: got
        assert:
          - outcome: got
            equals:
              value: null
          - mock: yaml_service
            method: get_anchor
            assert_called_once_with:
              args: [notes.yml, item]
      star_string:
        conditions:
          mocks:
            yaml_service:
              <<: *yaml_service
              return_value:
                get_anchor:
                  value: '*other'
        execute:
          - target: self
            method: handle
            kwargs:
              path: notes.yml
              name: item
            as: got
        assert:
          - outcome: got
            equals:
              value: '*other'
      blank_name:
        conditions:
          mocks:
            yaml_service: *yaml_service
        execute:
          - target: self
            method: handle
            kwargs:
              path: notes.yml
              name: '   '
            raises: true
            as: failed
        assert:
          - outcome: failed
            error_code: COMMAND_PARAMETER_REQUIRED
      service_error_propagates:
        conditions:
          mocks:
            yaml_service:
              <<: *yaml_service
              return_value:
                get_anchor:
                  raises:
                    module_path: tiferet.interfaces.core
                    class_name: ServiceError
                    message: YAML_ANCHOR_NOT_FOUND
        execute:
          - target: self
            method: handle
            kwargs:
              path: notes.yml
              name: missing
            raises: true
            as: failed
        assert:
          - outcome: failed
            error_code: YAML_ANCHOR_NOT_FOUND
          - outcome: failed
            type:
              module_path: tiferet.interfaces.core
              class_name: ServiceError
          - outcome: failed
            type:
              module_path: tiferet.assets.core
              class_name: TiferetError
              negate: true

  test_set_yaml_anchor:
    module_path: *yaml_events
    class_name: SetYamlAnchor
    tests:
      set_value:
        conditions:
          mocks:
            yaml_service:
              <<: *yaml_service
              return_value:
                set_anchor:
                  value: ada
        execute:
          - target: self
            method: handle
            kwargs:
              path: notes.yml
              name: user
              value: ada
              key_path:
                - [val, fixtures]
                - [val, user]
            as: set
        assert:
          - outcome: set
            equals:
              value: ada
          - mock: yaml_service
            method: set_anchor
            assert_called_once_with:
              args: [notes.yml, user]
              kwargs:
                value: ada
                key_path:
                  - [val, fixtures]
                  - [val, user]
      empty_string:
        conditions:
          mocks:
            yaml_service:
              <<: *yaml_service
              return_value:
                set_anchor:
                  value: ''
        execute:
          - target: self
            method: handle
            kwargs:
              path: notes.yml
              name: item
              value: ''
            as: set
        assert:
          - outcome: set
            equals:
              value: ''
          - mock: yaml_service
            method: set_anchor
            assert_called_once_with:
              args: [notes.yml, item]
              kwargs:
                value: ''
                key_path: null
      null_value:
        conditions:
          mocks:
            yaml_service:
              <<: *yaml_service
              return_value:
                set_anchor:
                  value: null
        execute:
          - target: self
            method: handle
            kwargs:
              path: notes.yml
              name: item
              value: null
            as: set
        assert:
          - outcome: set
            equals:
              value: null
          - mock: yaml_service
            method: set_anchor
            assert_called_once_with:
              args: [notes.yml, item]
              kwargs:
                value: null
                key_path: null
      empty_key_path:
        conditions:
          mocks:
            yaml_service:
              <<: *yaml_service
              return_value:
                set_anchor:
                  value: 1
        execute:
          - target: self
            method: handle
            kwargs:
              path: notes.yml
              name: item
              value: 1
              key_path: []
            as: set
        assert:
          - outcome: set
            equals:
              value: 1
          - mock: yaml_service
            method: set_anchor
            assert_called_once_with:
              args: [notes.yml, item]
              kwargs:
                value: 1
                key_path: []
      omitted_value:
        conditions:
          mocks:
            yaml_service: *yaml_service
        execute:
          - target: self
            method: handle
            kwargs:
              path: notes.yml
              name: item
            raises: true
            as: failed
        assert:
          - outcome: failed
            error_code: YAML_ANCHOR_VALUE_REQUIRED
          - outcome: failed
            type:
              module_path: tiferet.assets.core
              class_name: TiferetError
          - outcome: failed
            type:
              module_path: tiferet.interfaces.core
              class_name: ServiceError
              negate: true
          - mock: yaml_service
            method: set_anchor
            assert_called_once_with:
              times: 0
      blank_path:
        conditions:
          mocks:
            yaml_service: *yaml_service
        execute:
          - target: self
            method: handle
            kwargs:
              path: '   '
              name: item
              value: ''
            raises: true
            as: failed
        assert:
          - outcome: failed
            error_code: COMMAND_PARAMETER_REQUIRED
      value_required_propagates:
        conditions:
          mocks:
            yaml_service:
              <<: *yaml_service
              return_value:
                set_anchor:
                  raises:
                    module_path: tiferet.interfaces.core
                    class_name: ServiceError
                    message: YAML_ANCHOR_VALUE_REQUIRED
        execute:
          - target: self
            method: handle
            kwargs:
              path: notes.yml
              name: item
            raises: true
            as: failed
        assert:
          - outcome: failed
            error_code: YAML_ANCHOR_VALUE_REQUIRED
          - outcome: failed
            type:
              module_path: tiferet.assets.core
              class_name: TiferetError
          - outcome: failed
            type:
              module_path: tiferet.interfaces.core
              class_name: ServiceError
              negate: true
      plain_value_propagates:
        conditions:
          mocks:
            yaml_service:
              <<: *yaml_service
              return_value:
                set_anchor:
                  raises:
                    module_path: tiferet.interfaces.core
                    class_name: ServiceError
                    message: YAML_PLAIN_VALUE_REQUIRED
        execute:
          - target: self
            method: handle
            kwargs:
              path: notes.yml
              name: item
              value: ada
            raises: true
            as: failed
        assert:
          - outcome: failed
            error_code: YAML_PLAIN_VALUE_REQUIRED
      key_path_propagates:
        conditions:
          mocks:
            yaml_service:
              <<: *yaml_service
              return_value:
                set_anchor:
                  raises:
                    module_path: tiferet.interfaces.core
                    class_name: ServiceError
                    message: YAML_KEY_PATH_INVALID
        execute:
          - target: self
            method: handle
            kwargs:
              path: missing.yml
              name: item
              value: 1
              key_path: fixtures.user
            raises: true
            as: failed
        assert:
          - outcome: failed
            error_code: YAML_KEY_PATH_INVALID
          - outcome: failed
            type:
              module_path: tiferet.assets.core
              class_name: TiferetError
          - outcome: failed
            type:
              module_path: tiferet.interfaces.core
              class_name: ServiceError
              negate: true
      file_not_found_propagates:
        conditions:
          mocks:
            yaml_service:
              <<: *yaml_service
              return_value:
                set_anchor:
                  raises:
                    module_path: tiferet.interfaces.core
                    class_name: ServiceError
                    message: YAML_FILE_NOT_FOUND
        execute:
          - target: self
            method: handle
            kwargs:
              path: missing.yml
              name: item
              value: 1
            raises: true
            as: failed
        assert:
          - outcome: failed
            error_code: YAML_FILE_NOT_FOUND
      anchor_conflict_propagates:
        conditions:
          mocks:
            yaml_service:
              <<: *yaml_service
              return_value:
                set_anchor:
                  raises:
                    module_path: tiferet.interfaces.core
                    class_name: ServiceError
                    message: YAML_ANCHOR_CONFLICT
        execute:
          - target: self
            method: handle
            kwargs:
              path: notes.yml
              name: item
              value: 1
            raises: true
            as: failed
        assert:
          - outcome: failed
            error_code: YAML_ANCHOR_CONFLICT
          - outcome: failed
            type:
              module_path: tiferet.assets.core
              class_name: TiferetError
              negate: true

  test_remove_yaml_anchor:
    module_path: *yaml_events
    class_name: RemoveYamlAnchor
    tests:
      remove_anchor:
        conditions:
          mocks:
            yaml_service:
              <<: *yaml_service
              return_value:
                remove_anchor: item
        execute:
          - target: self
            method: handle
            kwargs:
              path: notes.yml
              name: item
              key_path: ignored
            as: removed
        assert:
          - outcome: removed
            equals: item
          - mock: yaml_service
            method: remove_anchor
            assert_called_once_with:
              args: [notes.yml, item]
      blank_name:
        conditions:
          mocks:
            yaml_service: *yaml_service
        execute:
          - target: self
            method: handle
            kwargs:
              path: notes.yml
              name: ''

            as: failed
        assert:
          - outcome: failed
            error_code: COMMAND_PARAMETER_REQUIRED
      anchor_conflict_propagates:
        conditions:
          mocks:
            yaml_service:
              <<: *yaml_service
              return_value:
                remove_anchor:
                  raises:
                    module_path: tiferet.interfaces.core

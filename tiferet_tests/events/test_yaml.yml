  test_rename_yaml_anchor:
    module_path: *yaml_events
    class_name: RenameYamlAnchor
    tests:
      rename_anchor:
        conditions:
          mocks:
            yaml_service:
              <<: *yaml_service
              return_value:
                rename_anchor: next
        execute:
          - target: self
            method: handle
            kwargs:
              path: notes.yml
              name: item
              new_name: next
              key_path: ignored
            as: renamed
        assert:
          - outcome: renamed
            equals: next
          - mock: yaml_service
            method: rename_anchor
            assert_called_once_with:
              args: [notes.yml, item, next]
      same_name:
        conditions:
          mocks:
            yaml_service:
              <<: *yaml_service
              return_value:
                rename_anchor: item
        execute:
          - target: self
            method: handle
            kwargs:
              path: notes.yml
              name: item
              new_name: item
            as: renamed
        assert:
          - outcome: renamed
            equals: item
      blank_new_name:
        conditions:
          mocks:
            yaml_service: *yaml_service
        execute:
          - target: self
            method: handle
            kwargs:
              path: notes.yml
              name: item
              new_name: '   '
            raises: true
            as: failed
        assert:
          - outcome: failed
            error_code: COMMAND_PARAMETER_REQUIRED
      anchor_conflict_propagates:
        conditions:
          mocks:
            yaml_service:
              <<: *yaml_service
              return_value:
                rename_anchor:
                  raises:
                    module_path: tiferet.interfaces.core
                    class_name: ServiceError
                    message: YAML_ANCHOR_CONFLICT
        execute:
          - target: self
            method: handle
            kwargs:
              path: notes.yml
              name: item
              new_name: other
            raises: true
            as: failed
        assert:
          - outcome: failed
            error_code: YAML_ANCHOR_CONFLICT
          - outcome: failed
            type:
              module_path: tiferet.interfaces.core
              class_name: ServiceError
          - outcome: failed
            type:
              module_path: tiferet.assets.core
              class_name: TiferetError
              negate: true

  test_yaml_anchor_files:
    module_path: tiferet.utils.yaml
    class_name: YamlLoader
    tests:
      different_path:
        conditions: {}
        execute:
          - target: self
            method: new
            as: loader
          - target:
              module_path: tempfile
              attribute: mkdtemp
            method: mkdtemp
            as: directory
          - target:
              module_path: pathlib
              attribute: Path
            method: Path
            args: [$r.directory, method.yml]
            as: method_path
          - target:
              module_path: pathlib
              attribute: Path
            method: Path
            args: [$r.directory, bound.yml]
            as: bound_path
          - target: $r.method_path
            method: write_text
            args: ["item: &item 1\n"]
            kwargs:
              encoding: utf-8
          - target:
              module_path: builtins
              attribute: str
            method: str
            args: [$r.method_path]
            as: method_text
          - target:
              module_path: builtins
              attribute: str
            method: str
            args: [$r.bound_path]
            as: bound_text
          - target:
              module_path: tiferet.utils.yaml
              attribute: YamlLoader
            method: YamlLoader
            kwargs:
              path: $r.bound_text
            as: other
          - target:
              module_path: builtins
              attribute: getattr
            method: getattr
            args: [$r.other, path]
            as: other_path
          - target:
              module_path: builtins
              attribute: str
            method: str
            args: [$r.other_path]
            as: other_text
          - target:
              module_path: importlib
              attribute: import_module
            method: import_module
            args: [tiferet.events.yaml]
            as: events_mod
          - target:
              module_path: importlib
              attribute: import_module
            method: import_module
            args: [tiferet.events.core]
            as: core_mod
          - target:
              module_path: builtins
              attribute: getattr
            method: getattr
            args: [$r.events_mod, SetYamlAnchor]
            as: event_cls
          - target:
              module_path: builtins
              attribute: getattr
            method: getattr
            args: [$r.core_mod, DomainEvent]
            as: event_base
          - target:
              module_path: builtins
              attribute: getattr
            method: getattr
            args: [$r.event_base, handle]
            as: handle_fn
          - target: $r.handle_fn
            method: __call__
            args: [$r.event_cls]
            kwargs:
              dependencies:
                yaml_service: $r.other
              path: $r.method_text
              name: item
              value: 9
            as: set
          - target: $r.bound_path
            method: exists
            as: bound_exists
          - target: $r.loader
            method: get_anchor
            args: [$r.method_text, item]
            as: got
        assert:
          - outcome: other_text
            equals: $r.bound_text

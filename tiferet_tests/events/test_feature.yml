fixtures:
  probe: &probe
    module_path: tiferet.domain.error
    class_name: ErrorMessage
    attributes:
      lang: en_US
      text: probe
  sample_feature: &sample_feature
    module_path: tiferet.mappers.feature
    class_name: FeatureAggregate
    attributes:
      id: &feature_id group.sample_feature
      name: Sample Feature
      group_id: group
      feature_key: sample_feature
      description: A sample feature for testing.
  opaque: &opaque
    module_path: tiferet.domain.error
    class_name: ErrorMessage
    attributes:
      lang: en_US
      text: opaque
  unread_index: &unread_index
    module_path: tiferet.domain.error
    class_name: ErrorMessage
    attributes:
      lang: en_US
      text: unread

testers:
  test_feature_event:
    module_path: &feature_events tiferet.events.feature
    class_name: FeatureEvent
    tests:
      event_base:
        conditions:
          fixtures: [probe]
          mocks:
            feature_service: &feature_service
              module_path: tiferet.interfaces
              class_name: FeatureService
        execute:
          - target: probe
            method: format
            as: formatted
        assert:
          - event_base:
              module_path: tiferet.events.core
              class_name: DomainEvent

  test_add_feature:
    module_path: *feature_events
    class_name: AddFeature
    fixtures:
      opaque: *opaque
    tests:
      minimal_success:
        conditions:
          mocks:
            feature_service:
              <<: *feature_service
              return_value:
                exists: false
        execute:
          - target: self
            method: handle
            kwargs:
              name: New Feature
              group_id: group
            as: created
        assert:
          - outcome: created
            type:
              module_path: tiferet.domain.feature
              class_name: Feature
          - outcome: created
            fields:
              name: New Feature
              group_id: group
              feature_key: new_feature
              id: group.new_feature
              description: New Feature
          - mock: feature_service
            method: exists
            assert_called_once_with:
              args: [group.new_feature]
          - mock: feature_service
            method: save
            assert_called_once_with:
              args: [$r.created]
      full_parameters:
        conditions:
          mocks:
            feature_service:
              <<: *feature_service
              return_value:
                exists: false
        execute:
          - target: self
            method: handle
            kwargs:
              name: Explicit Feature
              group_id: group
              feature_key: explicit_key
              id: group.explicit_key
              description: Explicit description.
              steps: []
              log_params:
                foo: bar
            as: created
        assert:
          - outcome: created
            fields:
              name: Explicit Feature
              group_id: group
              feature_key: explicit_key
              id: group.explicit_key
              description: Explicit description.
              steps: []
              log_params:
                foo: bar
      duplicate_id:
        conditions:
          mocks:
            feature_service:
              <<: *feature_service
              return_value:
                exists: true
        execute:
          - target: self
            method: handle
            kwargs:
              name: New Feature
              group_id: group
            raises: true
            as: failed
        assert:
          - outcome: failed
            error_code: FEATURE_ALREADY_EXISTS
          - mock: feature_service
            method: save
            assert_called_once_with:
              times: 0
      contextual_kwargs_not_forwarded:
        conditions:
          fixtures: [opaque]
          mocks:
            feature_service:
              <<: *feature_service
              return_value:
                exists: false
        execute:
          - target: self
            method: handle
            kwargs:
              name: New Feature
              group_id: group
              request: $fixture.opaque
              logger: $fixture.opaque
            as: created
        assert:
          - outcome: created
            type:
              module_path: tiferet.domain.feature
              class_name: Feature
          - outcome: created
            fields:
              name: New Feature
          - outcome: created
            absent: [request, logger]
      missing_required_params:
        conditions:
          mocks:
            feature_service: *feature_service
        execute:
          - target: self
            method: handle
            kwargs:
              name: null
              group_id: group
            raises: true
            as: missing_name
          - target: self
            method: handle
            kwargs:
              name: New Feature
              group_id: null
            raises: true
            as: missing_group
        assert:
          - outcome: missing_name
            error_code: COMMAND_PARAMETER_REQUIRED
          - outcome: missing_name
            message: name
          - outcome: missing_group
            error_code: COMMAND_PARAMETER_REQUIRED
          - outcome: missing_group
            message: group_id

  test_get_feature:
    module_path: *feature_events
    class_name: GetFeature
    fixtures:
      sample_feature: *sample_feature
      unread_index: *unread_index
    tests:
      success:
        conditions:
          fixtures: [sample_feature]
          mocks:
            feature_service:
              <<: *feature_service
              return_value:
                get: $fixture.sample_feature
        execute:
          - target: self
            method: handle
            kwargs:
              id: *feature_id
            as: found
        assert:
          - outcome: found
            equals: $fixture.sample_feature
          - mock: feature_service
            method: get
            assert_called_once_with:
              args: [*feature_id]
      fallback_to_default_index:
        conditions:
          fixtures: [sample_feature]
          mocks:
            feature_service:
              <<: *feature_service
              return_value:
                get: null
        execute:
          - target: self
            method: handle
            kwargs:
              id: *feature_id
              default_feature_index:
                group.sample_feature: $fixture.sample_feature
            as: found
        assert:
          - outcome: found
            equals: $fixture.sample_feature
          - mock: feature_service
            method: get
            assert_called_once_with:
              args: [*feature_id]
      miss_with_nonmatching_index:
        conditions:
          fixtures: [unread_index]
          mocks:
            feature_service:
              <<: *feature_service
              return_value:
                get: null
        execute:
          - target: self
            method: handle
            kwargs:
              id: *feature_id
              default_feature_index:
                other.feature: $fixture.unread_index
            raises: true
            as: failed
        assert:
          - outcome: failed
            error_code: FEATURE_NOT_FOUND
      missing_required_params:
        conditions:
          mocks:
            feature_service: *feature_service
        execute:
          - target: self
            method: handle
            kwargs:
              id: null
            raises: true
            as: failed
        assert:
          - outcome: failed
            error_code: COMMAND_PARAMETER_REQUIRED
          - outcome: failed
            message: id
      not_found:
        conditions:
          mocks:
            feature_service:
              <<: *feature_service
              return_value:
                get: null
        execute:
          - target: self
            method: handle
            kwargs:
              id: *feature_id
            raises: true
            as: failed
        assert:
          - outcome: failed
            error_code: FEATURE_NOT_FOUND


              <<: *feature_service
              return_value:
                get: $fixture.sample_feature
        execute:
          - target: self
            method: handle
            kwargs:
              id: *feature_id
              name: do_something
              service_id: container.attribute
              parameters:
                foo: bar
              data_key: result_key
              pass_on_error: true
            as: added
        assert:
          - outcome: added
            equals: *feature_id
          - outcome: sample_feature
            fields:
              steps:
                - name: do_something
                  service_id: container.attribute
                  parameters:
                    foo: bar
                  data_key: result_key
                  pass_on_error: true
          - mock: feature_service
            method: get
            assert_called_once_with:
              args: [*feature_id]
          - mock: feature_service
            method: save
            assert_called_once_with:
              args: [$fixture.sample_feature]
      insert_success:
        conditions:
          fixtures: [sample_feature]
          mocks:
            feature_service:
              <<: *feature_service
              return_value:
                get: $fixture.sample_feature
        execute:
          - target: sample_feature
            method: add_step
            kwargs:
              name: first
              service_id: container.first
              parameters:
                index: 0
              data_key: first_key
              pass_on_error: false
            as: first
          - target: sample_feature
            method: add_step
            kwargs:
              name: second
              service_id: container.second
              parameters:
                index: 1
              data_key: second_key
            as: second
          - target: self
            method: handle
            kwargs:
              id: *feature_id
              name: inserted
              service_id: container.inserted
              parameters:
                index: 1
              data_key: inserted_key
              position: 1
            as: added
        assert:
          - outcome: added
            equals: *feature_id
          - outcome: sample_feature
            fields:
              steps:
                - name: first
                - name: inserted
                  service_id: container.inserted
                - name: second
      missing_required_params:
        conditions:
          mocks:
            feature_service: *feature_service
        execute:
          - target: self
            method: handle
            kwargs:
              id: null
              name: do_something
              service_id: container.attribute
            raises: true
            as: missing_id
          - target: self
            method: handle
            kwargs:
              id: *feature_id
              name: null
              service_id: container.attribute
            raises: true
            as: missing_name
          - target: self
            method: handle
            kwargs:
              id: *feature_id
              name: do_something
              service_id: null
            raises: true
            as: missing_service
        assert:
          - outcome: missing_id
            error_code: COMMAND_PARAMETER_REQUIRED
          - outcome: missing_name
            error_code: COMMAND_PARAMETER_REQUIRED
          - outcome: missing_name
            message: name
          - outcome: missing_service
            error_code: COMMAND_PARAMETER_REQUIRED
          - outcome: missing_service
            message: service_id
      not_found:
        conditions:
          mocks:
            feature_service:
              <<: *feature_service
              return_value:
                get: null
        execute:
          - target: self
            method: handle
            kwargs:
              id: missing.feature
              name: do_something
              service_id: container.attribute
            raises: true
            as: failed
        assert:
          - outcome: failed
            error_code: FEATURE_NOT_FOUND


            fields:
              level: *logger_level
              handlers: *logger_handlers
              propagate: false
      empty_handlers_root:
        conditions:
          fixtures: [root_logger]
        execute:
          - target:
              module_path: builtins
              attribute: getattr
            method: getattr
            args: [$fixture.root_logger, is_root]
            as: is_root
        assert:
          - outcome: root_logger
            fields:
              is_root: true
              handlers: []
              level: WARNING
          - outcome: is_root
            equals: true
  test_formatter_config_object:
    module_path: *logging_mapper
    class_name: FormatterConfigObject
    attributes: *formatter_sample
    fixtures:
      formatter_aggregate: *formatter_aggregate
    tests:
      map:
        conditions: {}
        execute:
          - target:
              module_path: *logging_mapper
              class_name: FormatterConfigObject
            method: model_validate
            args: [*formatter_sample]
            as: transfer
          - target: $r.transfer
            method: map
            as: mapped
        assert:
          - outcome: mapped
            type:
              module_path: *logging_mapper
              class_name: FormatterAggregate
          - outcome: mapped
            fields:
              id: *formatter_id
              name: *formatter_name
              format: *formatter_format
              datefmt: *formatter_datefmt
      from_model:
        conditions:
          fixtures: [formatter_aggregate]
        execute:
          - target:
              module_path: *logging_mapper
              class_name: FormatterConfigObject
            method: from_model
            args: [$fixture.formatter_aggregate]
            as: copied
        assert:
          - outcome: copied
            type:
              module_path: *logging_mapper
              class_name: FormatterConfigObject
      round_trip:
        conditions:
          fixtures: [formatter_aggregate]
        execute:
          - target:
              module_path: *logging_mapper
              class_name: FormatterConfigObject
            method: from_model
            args: [$fixture.formatter_aggregate]

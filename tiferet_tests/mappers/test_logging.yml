fixtures:
  formatter_aggregate: &formatter_aggregate
    module_path: &logging_mapper tiferet.mappers.logging
    class_name: FormatterAggregate
    attributes: &formatter_sample
      id: &formatter_id simple
      name: &formatter_name Simple Formatter
      format: &formatter_format '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
      datefmt: &formatter_datefmt '%Y-%m-%d %H:%M:%S'
  handler_aggregate: &handler_aggregate
    module_path: *logging_mapper
    class_name: HandlerAggregate
    attributes: &handler_sample
      id: &handler_id console
      name: &handler_name Console Handler
      module_path: &handler_module logging
      class_name: &handler_class StreamHandler
      level: &handler_level DEBUG
      formatter: *formatter_id
      stream: &handler_stream ext://sys.stdout
  handler_without_destination: &handler_without_destination
    module_path: *logging_mapper
    class_name: HandlerAggregate
    attributes:
      id: file_handler
      name: File Handler
      module_path: *handler_module
      class_name: FileHandler
      level: INFO
      formatter: *formatter_id
  logger_aggregate: &logger_aggregate
    module_path: *logging_mapper
    class_name: LoggerAggregate
    attributes: &logger_sample
      id: &logger_id app
      name: &logger_name App Logger
      level: &logger_level DEBUG
      handlers: &logger_handlers [console]
  root_logger: &root_logger
    module_path: *logging_mapper
    class_name: LoggerAggregate
    attributes:
      id: root
      name: Root Logger
      level: WARNING
      handlers: []
      is_root: true

tests:
  logging_settings_from_data_success:
    conditions: {}
    execute:
      - target:
          module_path: *logging_mapper
          class_name: LoggingSettingsConfigObject
        method: from_data
        kwargs:
          formatters:
            simple:
              name: *formatter_name
              format: *formatter_format
              datefmt: *formatter_datefmt
          handlers:
            console:
              name: *handler_name
              module_path: *handler_module
              class_name: *handler_class
              level: *handler_level
              formatter: *formatter_id
              stream: *handler_stream
          loggers:
            app:
              name: *logger_name
              level: *logger_level
              handlers: *logger_handlers
        as: settings
      - target:
          module_path: builtins
          attribute: getattr
        method: getattr
        args: [$r.settings, formatters]
        as: formatters
      - target: $r.formatters
        method: __getitem__
        args: [simple]
        as: formatter
      - target:
          module_path: builtins
          attribute: getattr
        method: getattr
        args: [$r.settings, handlers]
        as: handlers
      - target: $r.handlers
        method: __getitem__
        args: [console]
        as: handler
      - target:
          module_path: builtins
          attribute: getattr
        method: getattr
        args: [$r.settings, loggers]
        as: loggers
      - target: $r.loggers
        method: __getitem__
        args: [app]
        as: logger
    assert:
      - outcome: formatter
        type:
          module_path: *logging_mapper
          class_name: FormatterConfigObject
      - outcome: formatter
        fields:
          id: *formatter_id
          name: *formatter_name
      - outcome: handler
        type:
          module_path: *logging_mapper
          class_name: HandlerConfigObject
      - outcome: handler
        fields:
          id: *handler_id
          name: *handler_name
      - outcome: logger
        type:
          module_path: *logging_mapper
          class_name: LoggerConfigObject
      - outcome: logger
        fields:
          id: *logger_id
          name: *logger_name
  logging_settings_from_data_empty:
    conditions: {}
    execute:
      - target:
          module_path: *logging_mapper
          class_name: LoggingSettingsConfigObject
        method: from_data
        kwargs:
          formatters: {}
          handlers: {}
          loggers: {}
        as: settings
      - target:
          module_path: builtins
          attribute: getattr
        method: getattr
        args: [$r.settings, formatters]
        as: formatters
      - target:
          module_path: builtins
          attribute: getattr
        method: getattr
        args: [$r.settings, handlers]
        as: handlers
      - target:
          module_path: builtins
          attribute: getattr
        method: getattr
        args: [$r.settings, loggers]
        as: loggers
    assert:
      - outcome: formatters
        equals: {}
      - outcome: handlers
        equals: {}
      - outcome: loggers
        equals: {}

testers:
  test_formatter_aggregate:
    module_path: *logging_mapper
    class_name: FormatterAggregate
    attributes: *formatter_sample
    tests:
      new:
        conditions: {}
        execute:
          - target: self
            method: new
            as: built
        assert:
          - outcome: built
            type:
              module_path: *logging_mapper
              class_name: FormatterAggregate
          - outcome: built
            fields:
              id: *formatter_id
              name: *formatter_name
              format: *formatter_format
              datefmt: *formatter_datefmt
      set_attribute:
        conditions: {}
        execute:
          - target: self
            method: new
            as: renamed
          - target: $r.renamed
            method: set_attribute
            args: [name, Updated Formatter]
          - target: self
            method: new
            as: reformatted
          - target: $r.reformatted
            method: set_attribute
            args: [format, '%(message)s']
        assert:
          - outcome: renamed
            fields:
              name: Updated Formatter
          - outcome: reformatted
            fields:
              format: '%(message)s'
      set_attribute_invalid:
        conditions: {}
        execute:
          - target: self
            method: new
            as: invalid
          - target: $r.invalid
            method: set_attribute
            args: [invalid_attribute, value]
            raises: true
            as: failed
        assert:
          - outcome: failed
            error_code: INVALID_MODEL_ATTRIBUTE
      format_config:
        conditions: {}
        execute:
          - target: self
            method: new
            as: built
          - target: $r.built
            method: format_config
            as: config
        assert:
          - outcome: config
            fields:
              format: *formatter_format
              datefmt: *formatter_datefmt
  test_handler_aggregate:
    module_path: *logging_mapper
    class_name: HandlerAggregate
    attributes: *handler_sample
    fixtures:
      handler_without_destination: *handler_without_destination
    tests:

            fields:
              id: *handler_id
              name: *handler_name
              module_path: *handler_module
              class_name: *handler_class
              level: *handler_level
              formatter: *formatter_id
              stream: *handler_stream
      set_attribute:
        conditions: {}
        execute:
          - target: self
            method: new
            as: renamed
          - target: $r.renamed
            method: set_attribute
            args: [name, Updated Handler]
          - target: self
            method: new
            as: leveled
          - target: $r.leveled
            method: set_attribute
            args: [level, ERROR]
        assert:
          - outcome: renamed
            fields:
              name: Updated Handler
          - outcome: leveled
            fields:
              level: ERROR
      set_attribute_invalid:
        conditions: {}
        execute:
          - target: self
            method: new
            as: invalid
          - target: $r.invalid
            method: set_attribute
            args: [invalid_attribute, value]
            raises: true
            as: failed
        assert:
          - outcome: failed
            error_code: INVALID_MODEL_ATTRIBUTE
      format_config:
        conditions: {}
        execute:
          - target: self
            method: new
            as: built
          - target: $r.built
            method: format_config
            as: config
        assert:
          - outcome: config
            fields:
              class: logging.StreamHandler
              level: *handler_level
              formatter: *formatter_id
              stream: *handler_stream
      format_config_no_optional:
        conditions:
          fixtures: [handler_without_destination]
        execute:
          - target: handler_without_destination
            method: format_config
            as: config
        assert:
          - outcome: config
            absent: [stream, filename]
          - outcome: config
            fields:
              class: logging.FileHandler
              level: INFO
  test_logger_aggregate:
    module_path: *logging_mapper
    class_name: LoggerAggregate
    attributes: *logger_sample

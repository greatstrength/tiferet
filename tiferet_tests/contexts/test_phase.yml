        as: stage_in_nested
      - target: $r.pos_runtime
        method: handle_execution
        args: [$r.stage_in_nested]
        raises: true
        as: stage_in_nested_failed
      - target: {module_path: tiferet.domain.tester_phase, class_name: Execution}
        method: __call__
        kwargs: {target: $r.stage_ref, method: exists, kwargs: {name: config.yaml}, data_key: present}
        as: exists_exec
      - target: $r.pos_runtime
        method: handle_execution
        args: [$r.exists_exec]
      - target: {module_path: tiferet.domain.tester_phase, class_name: Execution}
        method: __call__
        kwargs: {target: $r.stage_ref, method: path, data_key: directory}
        as: path_exec
      - target: $r.pos_runtime
        method: handle_execution
        args: [$r.path_exec]
      - target: {module_path: tiferet.domain.tester_phase, class_name: Assertion}
        method: __call__
        kwargs: {check: equals, outcome: directory, equals: $r.stage_ref}
        as: equals_stage
      - target: $r.pos_runtime
        method: handle_assertion
        args: [$r.equals_stage]
        raises: true
        as: equals_stage_failed
      - target: {module_path: tiferet.domain.tester_phase, class_name: Assertion}
        method: __call__
        kwargs: {check: equals, outcome: directory, equals: [$r.stage_ref]}
        as: equals_list_stage
      - target: $r.pos_runtime
        method: handle_assertion
        args: [$r.equals_list_stage]
        raises: true
        as: equals_list_stage_failed
      - target: {module_path: tiferet.domain.tester_phase, class_name: Assertion}
        method: __call__
        kwargs: {check: fields, outcome: directory, fields: {real: $r.stage_ref}}
        as: fields_stage
      - target: $r.pos_runtime
        method: handle_assertion
        args: [$r.fields_stage]
        raises: true
        as: fields_stage_failed
      - target: {module_path: tiferet.domain.tester_phase, class_name: Execution}
        method: __call__
        kwargs: {target: $r.stage_ref, method: path, data_key: still_dir}
        as: still_dir_exec
      - target: $r.pos_runtime
        method: handle_execution
        args: [$r.still_dir_exec]
      - target: $r.pos_runtime
        method: close_stage
      - target: {module_path: tiferet.blueprints.tester, attribute: build_phase_runtime}
        method: build_phase_runtime
        kwargs:
          session: $fixture.session
          tester_module_path: tiferet.domain.error
          tester_class_name: ErrorMessage
        as: unwired
      - target: $r.unwired
        method: __setattr__
        args: [stage_factory, null]
      - target: $r.unwired
        method: handle_conditions
        args: [$r.staged_conditions]
        raises: true
        as: unwired_failed
    assert:
      - outcome: fixture_failed
        error_code: PHASE_STEP_FAILED
      - outcome: fixture_failed
        message: '$stage'
      - outcome: session
        attribute: data
        fields:
          literal: '$stage.file'
      - outcome: bare_stage_failed
        error_code: PHASE_STEP_FAILED
      - outcome: bare_stage_failed
        message: not a fixture
      - outcome: bad_close_failed
        error_code: PHASE_STEP_FAILED
      - outcome: bad_arrange_failed
        error_code: PHASE_STEP_FAILED
      - outcome: bad_message_failed
        error_code: PHASE_STEP_FAILED
      - outcome: bad_read_failed
        error_code: PHASE_STEP_FAILED
      - outcome: bad_path_failed
        error_code: PHASE_STEP_FAILED
      - outcome: stage_in_args_failed
        error_code: PHASE_STEP_FAILED
      - outcome: stage_in_args_failed
        message: only an execute target
      - outcome: stage_in_kwargs_failed
        error_code: PHASE_STEP_FAILED
      - outcome: stage_in_kwargs_failed
        message: only an execute target
      - outcome: stage_in_nested_failed
        error_code: PHASE_STEP_FAILED
      - outcome: stage_in_nested_failed
        message: only an execute target
      - outcome: session
        attribute: data
        fields:
          present: false
      - outcome: equals_stage_failed
        error_code: PHASE_STEP_FAILED
      - outcome: equals_stage_failed
        message: only an execute target
      - outcome: equals_list_stage_failed
        error_code: PHASE_STEP_FAILED
      - outcome: equals_list_stage_failed
        message: only an execute target
      - outcome: fields_stage_failed
        error_code: PHASE_STEP_FAILED
      - outcome: fields_stage_failed
        message: only an execute target
      - outcome: unwired_failed
        error_code: APP_ERROR
      - outcome: unwired_failed
        message: stage_factory

fixtures:
  session:
    module_path: tiferet.contexts.request
    class_name: RequestContext
    attributes: {}
  data_key_test:
    module_path: &phase_domain tiferet.domain.tester_phase
    class_name: Test
    attributes:
      id: phase.data_key
      name: phase.data_key
      conditions: {}
      executes:
        - target: self
          method: new
          data_key: built
      asserts:
        - check: 'null'
          outcome: built
  format_test:
    module_path: *phase_domain
    class_name: Test
    attributes:
      id: phase.format
      name: phase.format
      conditions:
        fixtures: [formatted_error_message]
      executes:
        - target: formatted_error_message
          method: format
          kwargs:
            error: test failure
          data_key: formatted
      asserts:
        - check: equals
          outcome: formatted
          equals: 'An error occurred: test failure'
  add_success_test:
    module_path: *phase_domain
    class_name: Test
    attributes:
      id: phase.add_success
      name: phase.add_success
      conditions:
        mocks:
          error_service:
            module_path: &interfaces tiferet.interfaces
            class_name: ErrorService
            return_value:
              exists: false
      executes:
        - target: self
          method: handle
          kwargs: &add_error_kwargs
            id: NEW_ERROR
            name: New Error
            message: This is a new error message.
            lang: en_US
          data_key: created
      asserts:
        - check: type
          outcome: created
          module_path: tiferet.domain.error
          class_name: Error
        - check: fields
          outcome: created
          fields:
            id: NEW_ERROR
            name: New Error
            message:
              - lang: en_US
                text: This is a new error message.
        - check: assert_called_once_with
          mock: error_service
          method: exists
          assert_called_once_with:
            args: [NEW_ERROR]
  already_exists_test:
    module_path: *phase_domain
    class_name: Test
    attributes:
      id: phase.already_exists
      name: phase.already_exists
      conditions:
        mocks:
          error_service:
            module_path: *interfaces
            class_name: ErrorService
            return_value:
              exists: true
      executes:
        - target: self
          method: handle
          kwargs: *add_error_kwargs
          raises: true
          data_key: failed
      asserts:
        - check: error_code
          outcome: failed
          error_code: ERROR_ALREADY_EXISTS
  not_found_test:
    module_path: *phase_domain
    class_name: Test
    attributes:
      id: phase.not_found
      name: phase.not_found
      conditions:
        mocks:
          error_service:
            module_path: *interfaces
            class_name: ErrorService
            return_value:
              get: null
      executes:
        - target: self
          method: handle
          kwargs:
            id: TEST_ERROR
          raises: true
          data_key: failed
      asserts:
        - check: error_code
          outcome: failed
          error_code: ERROR_NOT_FOUND
  missing_id_test:
    module_path: *phase_domain
    class_name: Test
    attributes:
      id: phase.missing_id
      name: phase.missing_id
      conditions:
        mocks:
          error_service:
            module_path: *interfaces
            class_name: ErrorService
      executes:
        - target: self
          method: handle
          kwargs:
            id: null
          raises: true
          data_key: failed
      asserts:
        - check: error_code
          outcome: failed
          error_code: COMMAND_PARAMETER_REQUIRED
  tester_object:
    module_path: tiferet.domain
    class_name: TesterObject
    attributes:
      type: generic
      id: phase.tester
      module_path: tiferet.domain.error
      class_name: ErrorMessage
  empty_conditions:
    module_path: *phase_domain
    class_name: Conditions
    attributes: {}

tests:
  closed_phase_keys_are_rejected:
    conditions: {}
    execute:
      - target:
          module_path: *phase_domain
          attribute: Conditions
        method: Conditions
        kwargs:
          fixtures: []
          variables: {}
        raises: true
        as: conditions_failed
      - target:
          module_path: *phase_domain
          attribute: Conditions
        method: Conditions
        kwargs:
          stage: true
        as: staged
      - target:
          module_path: *phase_domain
          attribute: Execution
        method: Execution
        kwargs:
          target: self
          method: new
          sample_kwargs: {}
        raises: true
        as: execution_failed
      - target:
          module_path: *phase_domain
          attribute: Assertion
        method: Assertion
        kwargs:
          check: equals
          outcome: built
          equals: a
          'null': true
        raises: true
        as: assertion_failed
    assert:
      - outcome: conditions_failed
        type: &model_error
          module_path: tiferet.domain
          class_name: ModelError
      - outcome: execution_failed
        type: *model_error
      - outcome: assertion_failed
        type: *model_error
      - outcome: staged
        attribute: stage
        equals: true

  as_is_data_key_and_not_parameters:
    conditions:
      fixtures: [data_key_test]
    execute:
      - target:
          module_path: &phase_context tiferet.contexts.tester_phase
          attribute: compile_phase_steps
        method: compile_phase_steps
        args: [$fixture.data_key_test]
        as: steps
      - target: $r.steps
        method: __len__
        as: step_count
      - target: $r.steps
        method: __getitem__
        args: [0]
        as: conditions_step
      - target: $r.steps
        method: __getitem__
        args: [1]
        as: execute_step
      - target: $r.steps
        method: __getitem__
        args: [2]
        as: assert_step
    assert:
      - outcome: execute_step
        fields:
          data_key: built
          parameters: {}
          pass_on_error: false
      - outcome: step_count
        equals: 3
      - outcome: conditions_step
        type: &event_feature_step
          module_path: tiferet.domain
          class_name: EventFeatureStep
      - outcome: execute_step
        type: *event_feature_step
      - outcome: assert_step
        type: *event_feature_step

  error_format_with_kwargs:
    conditions:
      fixtures: [session, format_test]
    execute:
      - target: &build_phase_runtime
          module_path: tiferet.blueprints.tester
          attribute: build_phase_runtime
        method: build_phase_runtime
        args: [$fixture.session, tiferet.domain.error, ErrorMessage]
        kwargs:
          root_fixtures:
            formatted_error_message:
              module_path: tiferet.domain.error
              class_name: ErrorMessage
              attributes:
                lang: en_US
                text: 'An error occurred: {error}'
        as: runtime
      - target: $r.runtime
        method: run
        args: [$fixture.format_test]
      - target: &getattr
          module_path: builtins
          attribute: getattr
        method: getattr
        args: [$fixture.session, data]
        as: data
    assert:
      - outcome: data
        attribute: formatted
        equals: 'An error occurred: test failure'

  event_success:
    conditions:
      fixtures: [session, add_success_test]
    execute:
      - target: *build_phase_runtime
        method: build_phase_runtime
        args: [$fixture.session, tiferet.events.error, AddError]
        as: runtime
      - target: $r.runtime
        method: run
        args: [$fixture.add_success_test]
      - target: *getattr
        method: getattr
        args: [$fixture.session, data]
        as: data
    assert:
      - outcome: data
        attribute: created
        fields:
          id: NEW_ERROR
          name: New Error

  event_already_exists:
    conditions:
      fixtures: [session, already_exists_test]
    execute:
      - target: *build_phase_runtime
        method: build_phase_runtime
        args: [$fixture.session, tiferet.events.error, AddError]
        as: runtime
      - target: $r.runtime
        method: run
        args: [$fixture.already_exists_test]
      - target: *getattr
        method: getattr
        args: [$fixture.session, data]
        as: data
    assert:
      - outcome: data
        attribute: failed
        error_code: ERROR_ALREADY_EXISTS

  event_not_found:
    conditions:
      fixtures: [session, not_found_test]
    execute:
      - target: *build_phase_runtime
        method: build_phase_runtime
        args: [$fixture.session, tiferet.events.error, GetError]
        as: runtime
      - target: $r.runtime
        method: run
        args: [$fixture.not_found_test]
      - target: *getattr
        method: getattr
        args: [$fixture.session, data]
        as: data
    assert:
      - outcome: data
        attribute: failed
        error_code: ERROR_NOT_FOUND

  event_missing_required_parameter:
    conditions:
      fixtures: [session, missing_id_test]
    execute:
      - target: *build_phase_runtime
        method: build_phase_runtime
        args: [$fixture.session, tiferet.events.error, AddError]
        as: runtime
      - target: $r.runtime
        method: run
        args: [$fixture.missing_id_test]
      - target: *getattr
        method: getattr
        args: [$fixture.session, data]
        as: data
    assert:
      - outcome: data
        attribute: failed
        error_code: COMMAND_PARAMETER_REQUIRED

  handlers_are_registered_and_not_default_features:
    conditions: {}
    execute:
      - target:
          module_path: tiferet.blueprints.tester
          attribute: register_phase_handlers
        method: register_phase_handlers
        as: handlers
      - target: $r.handlers
        method: __len__
        as: handler_count
      - target: &import_module
          module_path: importlib
          attribute: import_module
        method: import_module
        args: [tiferet.contexts.tester_phase]
        as: phase_context
      - target: *getattr
        method: getattr
        args: [$r.phase_context, PhaseRuntimeContext]
        as: runtime_class
      - target: *getattr
        method: getattr
        args: [$r.runtime_class, handle_conditions]
        as: handle_conditions
      - target: *getattr
        method: getattr
        args: [$r.runtime_class, handle_execution]
        as: handle_execution
      - target: *getattr
        method: getattr
        args: [$r.runtime_class, handle_assertion]
        as: handle_assertion
      - target: *import_module
        method: import_module
        args: [tiferet.domain]
        as: domain
      - target: *getattr
        method: getattr
        args: [$r.domain, Feature]
        as: feature_class
      - target: &hasattr
          module_path: builtins
          attribute: hasattr
        method: hasattr
        args: [$r.feature_class, CORE_DEFAULT_FEATURES]
        as: has_default_features
    assert:
      - outcome: handler_count
        equals: 3
      - outcome: handlers
        attribute: conditions
        equals: $r.handle_conditions
      - outcome: handlers
        attribute: execute
        equals: $r.handle_execution
      - outcome: handlers
        attribute: assert
        equals: $r.handle_assertion
      - outcome: has_default_features
        equals: false

  phase_runtime_is_reached_through_from_domain:
    conditions:
      fixtures: [tester_object, session]
    execute:
      - target: *import_module
        method: import_module
        args: [tiferet.domain.tester_phase]
        as: phase_domain
      - target: *getattr
        method: getattr
        args: [$r.phase_domain, PhaseRuntime]
        as: phase_runtime_class
      - target: *getattr
        method: getattr
        args: [$r.phase_domain, Test]
        as: test_class
      - target: *import_module
        method: import_module
        args: [tiferet.domain]
        as: domain
      - target: *getattr
        method: getattr
        args: [$r.domain, Feature]
        as: feature_class
      - target: &base_context
          module_path: tiferet.contexts.core
          class_name: BaseContext
        method: for_domain
        args: [$r.phase_runtime_class]
        as: phase_runtime_context
      - target: *base_context
        method: for_domain
        args: [$r.feature_class]
        as: feature_context
      - target: *base_context
        method: for_domain
        args: [$r.test_class]
        as: test_context
      - target:
          module_path: tiferet.contexts.tester
          class_name: TesterContext
        method: from_domain
        args: [$fixture.tester_object]
        as: unwired
      - target: $r.unwired
        method: build_phase_runtime
        args: [$fixture.session, tiferet.domain.error, ErrorMessage]
        raises: true
        as: unwired_failed
      - target:
          module_path: tiferet.blueprints.tester
          attribute: build_tester_context
        method: build_tester_context
        args: [$fixture.tester_object]
        as: wired
      - target: $r.wired
        method: build_phase_runtime
        args: [$fixture.session, tiferet.domain.error, ErrorMessage]
        as: wired_runtime
      - target: *getattr
        method: getattr
        args: [$r.wired_runtime, domain]
        as: wired_domain
    assert:
      - outcome: phase_runtime_context
        is:
          module_path: *phase_context
          class_name: PhaseRuntimeContext
      - outcome: feature_context
        is:
          module_path: tiferet.contexts.feature
          class_name: FeatureContext
      - outcome: test_context
        is:
          module_path: *phase_context
          class_name: TestContext
      - outcome: unwired_failed
        message: build_phase_runtime_handler
      - outcome: wired_runtime
        type:
          module_path: *phase_context
          class_name: PhaseRuntimeContext
      - outcome: wired_domain
        type:
          module_path: *phase_domain
          class_name: PhaseRuntime
      - outcome: wired_domain
        attribute: tester_class_name
        equals: ErrorMessage

  conditions_stage_round_trips_to_data:
    conditions:
      fixtures: [empty_conditions]
    execute:
      - target: &conditions_config
          module_path: &phase_mappers tiferet.mappers.tester_phase
          class_name: ConditionsConfigObject
        method: model_validate
        args: [{}]
        as: bare
      - target: $r.bare
        method: to_primitive
        kwargs: {role: to_data}
        as: bare_dump
      - target: *conditions_config
        method: model_validate
        args: [{stage: true}]
        as: staged
      - target: $r.staged
        method: to_primitive
        kwargs: {role: to_data}
        as: staged_dump
      - target: $r.staged
        method: map
        as: staged_model
      - target: *conditions_config
        method: from_model
        args: [$r.staged_model]
        as: round_trip
      - target: empty_conditions
        method: model_dump
        as: empty_dump
    assert:
      - outcome: bare_dump
        absent: [stage]
      - outcome: staged_dump
        attribute: stage
        equals: true
      - outcome: staged_model
        attribute: stage
        equals: true
      - outcome: round_trip
        attribute: stage
        equals: true
      - outcome: empty_dump
        absent: [stage]

  check_set_is_unchanged:
    conditions: {}
    execute:
      - target: &assertion_checks
          module_path: *phase_domain
          class_name: ASSERTION_CHECKS
        method: __len__
        as: check_count
      - target: *import_module
        method: import_module
        args: [tiferet.domain.tester_phase]
        as: phase_domain
      - target: *getattr
        method: getattr
        args: [$r.phase_domain, ASSERTION_CHECKS]
        as: check_set
      - target: *assertion_checks
        method: __getitem__
        args: [0]
        as: check_0
      - target: *assertion_checks
        method: __getitem__
        args: [1]
        as: check_1
      - target: *assertion_checks
        method: __getitem__
        args: [2]
        as: check_2
      - target: *assertion_checks
        method: __getitem__
        args: [3]
        as: check_3
      - target: *assertion_checks
        method: __getitem__
        args: [4]
        as: check_4
      - target: *assertion_checks
        method: __getitem__
        args: [5]
        as: check_5
      - target: *assertion_checks
        method: __getitem__
        args: [6]
        as: check_6
      - target: *assertion_checks
        method: __getitem__
        args: [7]
        as: check_7
      - target: *assertion_checks
        method: __getitem__
        args: [8]
        as: check_8
      - target: *assertion_checks
        method: __getitem__
        args: [9]
        as: check_9
      - target: *assertion_checks
        method: __getitem__
        args: [10]
        as: check_10
      - target: *assertion_checks
        method: __getitem__
        args: [11]
        as: check_11
      - target: *assertion_checks
        method: __getitem__
        args: [12]
        as: check_12
      - target: *assertion_checks
        method: __getitem__
        args: [13]
        as: check_13
      - target: *assertion_checks
        method: __getitem__
        args: [14]
        as: check_14
      - target: *assertion_checks
        method: __getitem__
        args: [15]
        as: check_15
    assert:
      - outcome: check_set
        type:
          module_path: builtins
          class_name: tuple
      - outcome: check_count
        equals: 16
      - outcome: check_0
        equals: 'equals'
      - outcome: check_1
        equals: 'null'
      - outcome: check_2
        equals: 'fields'
      - outcome: check_3
        equals: 'absent'
      - outcome: check_4
        equals: 'error_code'
      - outcome: check_5
        equals: 'type'
      - outcome: check_6
        equals: 'is'
      - outcome: check_7
        equals: 'message'
      - outcome: check_8
        equals: 'assert_called_once_with'
      - outcome: check_9
        equals: 'domain_contract'
      - outcome: check_10
        equals: 'mapper_contract'
      - outcome: check_11
        equals: 'event_base'
      - outcome: check_12
        equals: 'parameters_required'
      - outcome: check_13
        equals: 'service_contract'
      - outcome: check_14
        equals: 'middleware_chain'
      - outcome: check_15
        equals: 'cause'

  raises_stores_the_exception:
    conditions:
      fixtures: [session]
    execute:
      - target: &request_prefix
          module_path: tiferet.assets.core
          class_name: REQUEST_REF_PREFIX
        method: __add__
        args: [built]
        as: ref_built
      - target: *build_phase_runtime
        method: build_phase_runtime
        args: [$fixture.session, tiferet.mappers, ErrorAggregate]
        kwargs:
          tester_attributes: &error_aggregate_attributes
            id: TEST_ERROR
            name: TEST_ERROR
            error_code: TEST_ERROR
            message:
              - lang: en
                text: Test error message.
        as: runtime
      - target: &make_test
          module_path: &test_module tests.contexts.test_phase
          attribute: _test
        method: _test
        args:
          - phase.raises
          - {}
          - - target: self
              method: new
              data_key: built
            - target: $r.ref_built
              method: set_attribute
              args: [invalid_attribute, value]
              raises: true
              data_key: failed
          - - check: error_code
              outcome: failed
              error_code: INVALID_MODEL_ATTRIBUTE
        as: inner
      - target: *make_test
        method: _test
        args:
          - phase.no_raise
          - {}
          - - target: self
              method: new
              raises: true
              data_key: failed
          - - check: 'null'
              outcome: failed
        as: quiet
      - target: $r.runtime
        method: run
        args: [$r.inner]
      - target: *getattr
        method: getattr
        args: [$fixture.session, data]
        as: data
      - target: $r.runtime
        method: run
        args: [$r.quiet]
        raises: true
        as: quiet_failed
    assert:
      - outcome: data
        attribute: failed
        error_code: INVALID_MODEL_ATTRIBUTE
      - outcome: quiet_failed
        error_code: PHASE_STEP_FAILED

  invalid_set_attribute:
    conditions:
      fixtures: [session]
    execute:
      - target: *request_prefix
        method: __add__
        args: [built]
        as: ref_built
      - target: *build_phase_runtime
        method: build_phase_runtime
        args: [$fixture.session, tiferet.mappers, ErrorAggregate]
        kwargs:
          tester_attributes: *error_aggregate_attributes
        as: runtime
      - target: *make_test
        method: _test
        args:
          - phase.invalid_attribute
          - {}
          - - target: self
              method: new
              data_key: built
            - target: $r.ref_built
              method: set_attribute
              args: [invalid_attribute, value]
              raises: true
              data_key: failed
          - - check: error_code
              outcome: failed
              error_code: INVALID_MODEL_ATTRIBUTE
        as: inner
      - target: $r.runtime
        method: run
        args: [$r.inner]
      - target: *getattr
        method: getattr
        args: [$fixture.session, data]
        as: data
    assert:
      - outcome: data
        attribute: failed
        error_code: INVALID_MODEL_ATTRIBUTE

  aggregate_rename_and_set_message:
    conditions:
      fixtures: [session]
    execute:
      - target: *request_prefix
        method: __add__
        args: [built]
        as: ref_built
      - target: *build_phase_runtime
        method: build_phase_runtime
        args: [$fixture.session, tiferet.mappers, ErrorAggregate]
        kwargs:
          tester_attributes: *error_aggregate_attributes
        as: runtime
      - target: *make_test
        method: _test
        args:
          - phase.rename
          - {}
          - - target: self
              method: new
              data_key: built
            - target: $r.ref_built
              method: rename
              args: [Renamed Error]
            - target: $r.ref_built
              method: set_message
              args: [es, Mensaje de error de prueba.]
          - - check: fields
              outcome: built
              fields: &renamed_fields
                name: Renamed Error
                message:
                  - lang: en
                    text: Test error message.
                  - lang: es
                    text: Mensaje de error de prueba.
        as: inner
      - target: $r.runtime
        method: run
        args: [$r.inner]
      - target: *getattr
        method: getattr
        args: [$fixture.session, data]
        as: data
    assert:
      - outcome: data
        attribute: built
        fields: *renamed_fields

  error_format_message_missing_language:
    conditions:
      fixtures: [session]
    execute:
      - target: *request_prefix
        method: __add__
        args: [built]
        as: ref_built
      - target: &fixture_prefix
          module_path: *phase_context
          class_name: FIXTURE_REF_PREFIX
        method: __add__
        args: [error_message]
        as: ref_error_message
      - target: *build_phase_runtime
        method: build_phase_runtime
        args: [$fixture.session, tiferet.domain.error, Error]
        kwargs:
          tester_attributes:
            id: TEST_ERROR
            name: Test Error
            message: [$r.ref_error_message]
          tester_fixtures:
            error_message: &error_message_spec
              module_path: tiferet.domain.error
              class_name: ErrorMessage
              attributes:
                lang: en_US
                text: An error occurred.
        as: runtime
      - target: *make_test
        method: _test
        args:
          - phase.missing_lang
          - fixtures: [error_message]
          - - target: self
              method: new
              data_key: built
            - target: $r.ref_built
              method: format_message
              kwargs: {lang: fr_FR}
              data_key: missing
          - - check: 'null'
              outcome: missing
        as: inner
      - target: $r.runtime
        method: run
        args: [$r.inner]
      - target: *getattr
        method: getattr
        args: [$fixture.session, data]
        as: data
    assert:
      - outcome: data
        attribute: missing
        'null': true

  refs_resolve_before_the_call:
    conditions:
      fixtures: [session]
    execute:
      - target: *fixture_prefix
        method: __add__
        args: [missing]
        as: ref_missing
      - target: *build_phase_runtime
        method: build_phase_runtime
        args: [$fixture.session, tiferet.domain.error, ErrorMessage]
        kwargs:
          root_fixtures:
            error_message: *error_message_spec
        as: runtime
      - target: &make_conditions
          module_path: *phase_domain
          attribute: Conditions
        method: Conditions
        kwargs:
          fixtures: [error_message]
        as: inner_conditions
      - target: $r.runtime
        method: handle_conditions
        args: [$r.inner_conditions]
      - target: &make_execution
          module_path: *phase_domain
          attribute: Execution
        method: Execution
        kwargs:
          target: $r.ref_missing
          method: format
        as: missing_step
      - target: $r.runtime
        method: handle_execution
        args: [$r.missing_step]
        raises: true
        as: missing_failed
      - target: *make_execution
        method: Execution
        kwargs:
          target:
            module_path: builtins
            attribute: str
          method: str
          args: ['An error occurred: $r.x']
          data_key: literal
        as: literal_step
      - target: $r.runtime
        method: handle_execution
        args: [$r.literal_step]
      - target:
          module_path: builtins
          attribute: str
        method: str
        args: ['An error occurred: $r.x']
        as: literal
      - target: *getattr
        method: getattr
        args: [$fixture.session, data]
        as: data
    assert:
      - outcome: missing_failed
        error_code: PHASE_REFERENCE_NOT_FOUND
      - outcome: literal
        equals: 'An error occurred: $r.x'
      - outcome: data
        attribute: literal
        equals: 'An error occurred: $r.x'

  attribute_model_rules:
    conditions: {}
    execute:
      - target: *request_prefix
        method: __add__
        args: [value]
        as: ref_value
      - target: &make_assertion
          module_path: *phase_domain
          attribute: Assertion
        method: Assertion
        kwargs: {check: equals, outcome: got, attribute: value, equals: 1}
        as: legal_equals
      - target: *make_assertion
        method: Assertion
        kwargs: {check: 'null', outcome: got, attribute: value}
        as: legal_null
      - target: *make_assertion
        method: Assertion
        kwargs:
          check: assert_called_once_with
          mock: command
          method: run
          assert_called_once_with:
            args: []
        as: legal_called
      - target: *make_assertion
        method: Assertion
        kwargs:
          check: assert_called_once_with
          mock: command
          method: run
          assert_called_once_with:
            args: []
          attribute: value
        raises: true
        as: called_failed
      - target: *make_assertion
        method: Assertion
        kwargs: {check: domain_contract, attribute: value}
        raises: true
        as: contract_failed
      - target: *make_assertion
        method: Assertion
        kwargs: {check: equals, outcome: got, attribute: '', equals: 1}
        raises: true
        as: empty_failed
      - target: *make_assertion
        method: Assertion
        kwargs: {check: equals, outcome: got, attribute: message.1.lang, equals: 1}
        raises: true
        as: path_failed
      - target: *make_assertion
        method: Assertion
        kwargs: {check: equals, outcome: got, attribute: $r.ref_value, equals: 1}
        raises: true
        as: ref_failed
      - target: *make_assertion
        method: Assertion
        kwargs: {check: equals, outcome: got, attribute: a b, equals: 1}
        raises: true
        as: space_failed
    assert:
      - outcome: legal_equals
        attribute: attribute
        equals: value
      - outcome: legal_null
        attribute: attribute
        equals: value
      - outcome: legal_called
        attribute: check
        equals: assert_called_once_with
      - outcome: called_failed
        error_code: INVALID_MODEL_ATTRIBUTE
      - outcome: contract_failed
        error_code: INVALID_MODEL_ATTRIBUTE
      - outcome: empty_failed
        error_code: INVALID_MODEL_VALUE
      - outcome: path_failed
        error_code: INVALID_MODEL_VALUE
      - outcome: ref_failed
        error_code: INVALID_MODEL_VALUE
      - outcome: space_failed
        error_code: INVALID_MODEL_VALUE

  handle_model_rules:
    conditions: {}
    execute:
      - target: &mock_prefix
          module_path: *phase_context
          class_name: MOCK_REF_PREFIX
        method: __add__
        args: [command]
        as: ref_command
      - target: *request_prefix
        method: __add__
        args: [event]
        as: ref_event
      - target: *request_prefix
        method: __add__
        args: [a.b]
        as: ref_dotted
      - target: *fixture_prefix
        method: __add__
        args: [event]
        as: ref_fixture_event
      - target: &stage_ref
          module_path: *phase_context
          class_name: STAGE_REF
        method: __add__
        args: ['']
        as: ref_stage
      - target: *make_execution
        method: Execution
        kwargs: {target: self, method: handle}
        as: self_handle
      - target: *make_execution
        method: Execution
        kwargs:
          target: {module_path: m, class_name: E}
          method: handle
          dependencies: {a: 1}
        as: class_handle
      - target: *make_execution
        method: Execution
        kwargs: {target: $r.ref_command, method: handle, dependencies: {}}
        as: mock_handle
      - target: *make_execution
        method: Execution
        kwargs: {target: $r.ref_event, method: handle}
        as: ref_handle
      - target: *make_execution
        method: Execution
        kwargs: {target: self, method: handle, dependencies: {}}
        as: self_empty_handle
      - target: *make_execution
        method: Execution
        kwargs: {target: event, method: handle}
        raises: true
        as: bare_failed
      - target: *make_execution
        method: Execution
        kwargs: {target: $r.ref_fixture_event, method: handle}
        raises: true
        as: fixture_failed
      - target: *make_execution
        method: Execution
        kwargs: {target: $r.ref_stage, method: handle}
        raises: true
        as: stage_failed
      - target: *make_execution
        method: Execution
        kwargs: {target: $r.ref_dotted, method: handle}
        raises: true
        as: dotted_failed
      - target: *make_execution
        method: Execution
        kwargs:
          target: {module_path: m, attribute: f}
          method: handle
        raises: true
        as: attribute_failed
      - target: *make_execution
        method: Execution
        kwargs: {target: self, method: handle, dependencies: {a: 1}}
        raises: true
        as: self_dependencies_failed
      - target: *make_execution
        method: Execution
        kwargs: {target: self, method: handle, args: [1]}
        raises: true
        as: args_failed
      - target: *make_execution
        method: Execution
        kwargs: {target: $r.ref_command, method: new}
        raises: true
        as: new_failed
      - target: &execution_config
          module_path: *phase_mappers
          class_name: ExecutionConfigObject
        method: model_validate
        args: [{target: {module_path: m, class_name: E}, method: handle, dependencies: null}]
        raises: true
        as: null_dependencies_failed
      - target: *execution_config
        method: model_validate
        args: [{target: {module_path: m, class_name: E}, method: handle, dependencies: []}]
        raises: true
        as: list_dependencies_failed
      - target: *execution_config
        method: model_validate
        args: [{target: {module_path: m, class_name: E}, method: handle, dependencies: dep}]
        raises: true
        as: string_dependencies_failed
      - target: &to_text
          module_path: builtins
          attribute: str
        method: str
        args: [$r.bare_failed]
        as: bare_text
      - target: $r.bare_text
        method: __contains__
        args: [legal only on target self]
        as: bare_has_old_sentence
    assert:
      - outcome: self_handle
        attribute: method
        equals: handle
      - outcome: class_handle
        attribute: dependencies
        equals: {a: 1}
      - outcome: mock_handle
        attribute: target
        equals: $r.ref_command
      - outcome: ref_handle
        attribute: target
        equals: $r.ref_event
      - outcome: self_empty_handle
        attribute: dependencies
        equals: {}
      - outcome: bare_failed
        error_code: INVALID_MODEL_VALUE
      - outcome: bare_failed
        message: handle requires target self, a class target, $mock.<name>, or $r.<key>.
      - outcome: fixture_failed
        error_code: INVALID_MODEL_VALUE
      - outcome: stage_failed
        error_code: INVALID_MODEL_VALUE
      - outcome: dotted_failed
        error_code: INVALID_MODEL_VALUE
      - outcome: attribute_failed
        error_code: INVALID_MODEL_VALUE
      - outcome: self_dependencies_failed
        error_code: INVALID_MODEL_VALUE
      - outcome: self_dependencies_failed
        message: dependencies is legal only on handle with a named event target.
      - outcome: args_failed
        error_code: INVALID_MODEL_VALUE
      - outcome: new_failed
        error_code: INVALID_MODEL_VALUE
      - outcome: null_dependencies_failed
        error_code: INVALID_MODEL_VALUE
      - outcome: list_dependencies_failed
        error_code: INVALID_MODEL_VALUE
      - outcome: string_dependencies_failed
        error_code: INVALID_MODEL_VALUE
      - outcome: bare_has_old_sentence
        equals: false

  observation_fields_round_trip:
    conditions: {}
    execute:
      - target: *request_prefix

              fields:
                name: Renamed Error
                message:
                  - {lang: en, text: Test error message.}
                  - {lang: es, text: Mensaje de error de prueba.}
        as: inner
      - target: {module_path: tiferet.blueprints.tester, attribute: build_phase_runtime}
        method: build_phase_runtime
        kwargs:
          session: $fixture.session
          tester_module_path: tiferet.mappers
          tester_class_name: ErrorAggregate
          tester_attributes:
            id: TEST_ERROR
            name: TEST_ERROR
            error_code: TEST_ERROR
            message: [{lang: en, text: Test error message.}]
        as: runtime
      - target: $r.runtime
        method: run
        args: [$r.inner]
    assert:
      - outcome: session
        attribute: data
        fields:
          built:
            name: Renamed Error
            message:
              - {lang: en, text: Test error message.}
              - {lang: es, text: Mensaje de error de prueba.}

  error_format_message_missing_language:
    conditions:
      fixtures: [session]
    execute:
      - target: {module_path: importlib, attribute: import_module}
        method: import_module
        args: [tiferet.assets.core]
        as: core
      - target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.core, REQUEST_REF_PREFIX]
        as: r_prefix
      - target: $r.r_prefix
        method: __add__
        args: [built]
        as: built_ref
      - target: {module_path: importlib, attribute: import_module}
        method: import_module
        args: [tiferet.contexts.tester_phase]
        as: phase_mod
      - target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.phase_mod, FIXTURE_REF_PREFIX]
        as: fixture_prefix
      - target: $r.fixture_prefix
        method: __add__
        args: [error_message]
        as: fixture_em_ref
      - target: {module_path: tiferet.domain.tester_phase, class_name: Test}
        method: __call__
        kwargs:
          id: phase.missing_lang
          name: phase.missing_lang
          conditions: {fixtures: [error_message]}
          executes:
            - {target: self, method: new, data_key: built}
            - {target: $r.built_ref, method: format_message, args: [fr_FR], data_key: missing}
          asserts:
            - {check: 'null', outcome: missing}
        as: inner
      - target: {module_path: tiferet.blueprints.tester, attribute: build_phase_runtime}
        method: build_phase_runtime
        kwargs:
          session: $fixture.session
          tester_module_path: tiferet.domain.error
          tester_class_name: Error
          tester_attributes:
            id: TEST_ERROR
            name: Test Error
            message: [$r.fixture_em_ref]
          tester_fixtures:
            error_message:
              module_path: tiferet.domain.error
              class_name: ErrorMessage
              attributes: {lang: en_US, text: An error occurred.}
        as: runtime
      - target: $r.runtime
        method: run
        args: [$r.inner]
    assert:
      - outcome: session
        attribute: data

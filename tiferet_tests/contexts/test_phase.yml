        kwargs: {target: $r.ref_stage, method: path, args: ['..']}
        as: parent_step
      - target: $r.runtime
        method: handle_execution
        args: [$r.parent_step]
        raises: true
        as: parent_failed
      - target: *make_execution
        method: Execution
        kwargs: {target: {module_path: builtins, attribute: str}, method: str, args: [$r.ref_stage]}
        as: args_step
      - target: $r.runtime
        method: handle_execution
        args: [$r.args_step]
        raises: true
        as: args_failed
      - target: *make_execution
        method: Execution
        kwargs: {target: {module_path: builtins, attribute: str}, method: str, kwargs: {object: $r.ref_stage}}
        as: kwargs_step
      - target: $r.runtime
        method: handle_execution
        args: [$r.kwargs_step]
        raises: true
        as: kwargs_failed
      - target: *make_execution

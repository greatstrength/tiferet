        as: runtime
      - target: $r.runtime
        method: run
        args: [$r.inner]
    assert:
      - outcome: session
        attribute: data
        fields:
          failed: {error_code: INVALID_MODEL_ATTRIBUTE}

  aggregate_rename_and_set_message:
    conditions:
      fixtures: [session]
    execute:
      - target: {module_path: importlib, attribute: import_module}
        method: import_module
        args: [tiferet.assets.core]
        as: core
      - target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.core, REQUEST_REF_PREFIX]
        as: r_prefix
      - target: $r.r_prefix
        method: __add__
        args: [built]
        as: built_ref
      - target: {module_path: tiferet.domain.tester_phase, class_name: Test}
        method: __call__
        kwargs:
          id: phase.rename
          name: phase.rename
          conditions: {}

        args: [{outcome: got, 'null': true}]
        as: whole
      - target: $r.whole
        method: map
        as: whole_model
      - target: *assertion_config
        method: from_model
        args: [$r.whole_model]
        as: whole_round_trip
      - target: $r.whole_round_trip
        method: to_primitive
        kwargs: {role: to_data}
        as: whole_dump
    assert:
      - outcome: present_model
        attribute: dependencies
        equals: {yaml_service: $r.ref_loader}
      - outcome: present_dump
        attribute: dependencies
        equals: {yaml_service: $r.ref_loader}
      - outcome: present_dump
        attribute: kwargs
        equals: {name: item}
      - outcome: empty_dump
        attribute: dependencies
        equals: {}
      - outcome: omitted_dump
        attribute: dependencies
        equals: {}
      - outcome: read_dump
        equals: {outcome: got, attribute: headers, equals: {}}
      - outcome: whole_dump

      - $mock.error
      - $mock.logger_builder
      as: app
    - target:
        module_path: builtins
        attribute: getattr
      method: getattr
      args:
      - $mock.error
      - format_response
      as: format_response
    - target: $r.format_response
      method: __setattr__
      args:
      - return_value
      - error_code: TEST_ERROR
        name: Test Error
        message: This is a test error message.
    - target:
        module_path: tiferet.assets
        class_name: TiferetError
      method: __call__
      kwargs:
        error_code: TEST_ERROR
        message: This is a test error message.
      as: error
    - target: $r.app
      method: handle_error
      args:
      - $r.error
      raises: true
      as: failure
    assert:
    - outcome: failure
      type:
        module_path: tiferet.assets
        class_name: TiferetAPIError
    - outcome: failure
      error_code: TEST_ERROR
    - outcome: failure
      attribute: name
      equals: Test Error
    - outcome: failure
      attribute: message
      equals: This is a test error message.
  app_interface_context_handle_response:
    conditions: {}
    execute:
    - target:
        module_path: tiferet.contexts.request

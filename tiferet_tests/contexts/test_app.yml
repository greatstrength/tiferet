testers:
  test_app_session_context:
    module_path: &app_module tiferet.contexts.app
    class_name: &app_class AppSessionContext
    tests:
      build_request_delegates_to_create_request_handler:
        conditions:
          fixtures: [app_interface, expected_request]
          mocks:
            dep: &dep_mock {module_path: tiferet.contexts.cache, class_name: CacheContext}
            factory:
              module_path: *request_module
              class_name: *request_class
              return_value:
                handle_response: $fixture.expected_request
        execute:
          - target: {module_path: builtins, attribute: getattr}
            method: getattr
            args: [$mock.factory, handle_response]
            as: handler
          - target: &app_context {module_path: tiferet.contexts.app, class_name: AppSessionContext}
            method: from_domain
            args: [$fixture.app_interface]
            kwargs:
              get_dependency: $mock.dep
              create_request_handler: $r.handler
            as: context
          - target: $r.context
            method: build_request
            args: [group.feat, {h: v}, {d: 1}]
            as: result
          - target: {module_path: operator, attribute: is_}
            method: is_
            args: [$r.result, $fixture.expected_request]
            as: same
        assert:
          - outcome: same
            equals: true
          - mock: factory
            method: handle_response
            assert_called_once_with:
              args: [test, group.feat, {h: v}, {d: 1}]

      execute_feature_delegates_to_handler:
        conditions:
          fixtures: [app_interface, request]
          mocks:
            dep: *dep_mock
            factory:
              module_path: *request_module
              class_name: *request_class
        execute:
          - target: {module_path: builtins, attribute: getattr}
            method: getattr
            args: [$mock.factory, handle_response]
            as: handler
          - target: *app_context
            method: from_domain
            args: [$fixture.app_interface]
            kwargs:
              get_dependency: $mock.dep
              execute_feature_handler: $r.handler
            as: context
          - target: $r.context
            method: execute_feature
            args: [group.feat, $fixture.request]
        assert:
          - mock: factory
            method: handle_response
            assert_called_once_with:
              args: [group.feat, $fixture.request]

      build_response_delegates_to_response_handler:
        conditions:
          fixtures: [app_interface, request]
          mocks:
            dep: *dep_mock
            factory:
              module_path: *request_module
              class_name: *request_class
              return_value:
                handle_response: {attributes: {status: ok}}
        execute:
          - target: {module_path: builtins, attribute: getattr}
            method: getattr
            args: [$mock.factory, handle_response]
            as: handler
          - target: *app_context
            method: from_domain
            args: [$fixture.app_interface]
            kwargs:
              get_dependency: $mock.dep
              response_handler: $r.handler
            as: context
          - target: $r.handler
            method: __call__
            args: [$fixture.request]
            as: expected_result
          - target: $r.handler
            method: reset_mock
          - target: $r.context
            method: build_response
            args: [$fixture.request]
            as: result
          - target: {module_path: operator, attribute: is_}
            method: is_
            args: [$r.result, $r.expected_result]
            as: same
        assert:
          - outcome: same
            equals: true
          - outcome: result
            fields:
              status: ok
          - mock: factory
            method: handle_response
            assert_called_once_with:
              args: [$fixture.request]

      build_response_unwired_handler_raises:
        conditions:
          fixtures: [app_interface, request]
          mocks:
            dep: *dep_mock
        execute:
          - &bare_context
            target: *app_context
            method: from_domain
            args: [$fixture.app_interface]
            kwargs:
              get_dependency: $mock.dep
            as: context
          - target: request
            method: set_result
            args: [the_result]
          - target: $r.context
            method: build_response
            args: [$fixture.request]
            raises: true
            as: failed
        assert:
          - outcome: failed
            type: &api_error {module_path: tiferet.assets, class_name: TiferetAPIError}
          - outcome: failed
            error_code: APP_ERROR
          - outcome: failed
            attribute: message
            message: response_handler

      build_request_unwired_handler_raises:
        conditions:
          fixtures: [app_interface]
          mocks:
            dep: *dep_mock
        execute:
          - *bare_context
          - target: $r.context
            method: build_request
            args: [group.feat, {}, {}]
            raises: true
            as: failed
        assert:
          - outcome: failed
            type: *api_error
          - outcome: failed
            error_code: APP_ERROR
          - outcome: failed
            attribute: message
            message: create_request_handler
          - outcome: failed
            attribute: kwargs
            fields:
              feature_id: group.feat

      execute_feature_unwired_handler_raises:
        conditions:
          fixtures: [app_interface, request]
          mocks:
            dep: *dep_mock
        execute:
          - *bare_context
          - target: $r.context
            method: execute_feature
            args: [group.feat, $fixture.request]
            raises: true
            as: failed
        assert:
          - outcome: failed
            type: *api_error
          - outcome: failed
            error_code: APP_ERROR
          - outcome: failed
            attribute: message
            message: execute_feature_handler
          - outcome: failed
            attribute: kwargs
            fields:
              feature_id: group.feat

      build_logger_unwired_handler_raises:
        conditions:
          fixtures: [app_interface]
          mocks:
            dep: *dep_mock
        execute:
          - *bare_context
          - target: $r.context
            method: build_logger
            raises: true
            as: failed
        assert:
          - outcome: failed
            type: *api_error
          - outcome: failed
            error_code: APP_ERROR
          - outcome: failed
            attribute: message
            message: build_logger_handler

      execute_feature_unwired_handler_passes_through_run:
        conditions:
          fixtures: [app_interface, request]
          mocks:
            dep: *dep_mock
            logger:
              module_path: logging
              class_name: Logger
            logger_factory:
              module_path: tiferet.contexts.logging
              class_name: LoggingContext
              return_value:
                build_logger: $mock.logger
            request_factory:
              module_path: *request_module
              class_name: *request_class
              return_value:
                handle_response: $fixture.request
            response_factory:
              module_path: *request_module
              class_name: *request_class
        execute:
          - target: {module_path: builtins, attribute: getattr}
            method: getattr
            args: [$mock.logger_factory, build_logger]
            as: build_logger_handler
          - target: {module_path: builtins, attribute: getattr}
            method: getattr
            args: [$mock.request_factory, handle_response]
            as: create_request_handler
          - target: {module_path: builtins, attribute: getattr}
            method: getattr
            args: [$mock.response_factory, handle_response]
            as: response_handler
          - target: *app_context
            method: from_domain
            args: [$fixture.app_interface]
            kwargs:
              get_dependency: $mock.dep
              build_logger_handler: $r.build_logger_handler
              create_request_handler: $r.create_request_handler
              response_handler: $r.response_handler
            as: context
          - target: $r.context
            method: run
            args: [group.feat]
            raises: true
            as: failed
          - target: $r.failed
            method: __str__
            as: failed_message
          - target: {module_path: operator, attribute: contains}
            method: contains
            args: [$r.failed_message, raise_error_handler]
            as: names_error_handler
          - target: {module_path: operator, attribute: contains}
            method: contains
            args: [$r.failed_message, An error occurred in the app]
            as: wrapped_as_app_error
        assert:
          - outcome: failed
            type: *api_error
          - outcome: failed
            error_code: APP_ERROR
          - outcome: failed
            attribute: message
            message: execute_feature_handler
          - outcome: names_error_handler
            equals: false
          - outcome: failed
            attribute: kwargs
            fields:
              feature_id: group.feat
          - outcome: wrapped_as_app_error
            equals: false
          - mock: logger
            method: error
            assert_called_once_with:
              times: 1

      handle_error_passes_api_errors_through:
        conditions:
          fixtures: [app_interface, api_error]
          mocks:
            dep: *dep_mock
            raise_factory:
              module_path: *request_module
              class_name: *request_class
        execute:
          - target: {module_path: builtins, attribute: getattr}
            method: getattr
            args: [$mock.raise_factory, handle_response]
            as: raise_handler
          - target: *app_context
            method: from_domain
            args: [$fixture.app_interface]
            kwargs:
              get_dependency: $mock.dep
              raise_error_handler: $r.raise_handler
            as: context
          - target: $r.context
            method: handle_error
            args: [$fixture.api_error]
            raises: true
            as: failed
          - target: {module_path: operator, attribute: is_}
            method: is_
            args: [$r.failed, $fixture.api_error]

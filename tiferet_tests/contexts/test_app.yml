    conditions: {}
    execute:
      - target: {module_path: importlib, attribute: import_module}
        method: import_module
        args: [tiferet.contexts.app]
        as: module
      - target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.module, APP_SERVICE_CACHE_PREFIX]
        as: prefix
      - target: {module_path: builtins, attribute: len}
        method: len
        args: [$r.prefix]
        as: size
      - target: $r.prefix
        method: __getitem__
        args: [0]
        as: first
      - target: $r.prefix
        method: __getitem__
        args: [1]
        as: second
    assert:
      - outcome: prefix
        type: {module_path: builtins, class_name: tuple}
      - outcome: size
        equals: 2
      - outcome: first
        equals: app
      - outcome: second
        equals: services


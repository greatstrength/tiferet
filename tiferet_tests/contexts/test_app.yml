  add_default_app_sessions_seeds_cache_with_domain_objects:
    conditions: {}
    execute:
      - target: {module_path: tiferet.contexts.app, attribute: add_default_app_sessions}
        method: add_default_app_sessions
        args:
          - tiferet_app: {id: tiferet_app, name: Admin App}
            tiferet_cli: {id: tiferet_cli, name: Admin CLI}
        as: decorator
      - *cache_module
      - *base_build

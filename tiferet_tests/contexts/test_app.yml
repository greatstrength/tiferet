      - *cache_module
      - *base_build
      - *wrap
      - target: $r.wrapped
        method: __call__
        kwargs:
          cache:
            existing_key: existing_value
        as: cache
      - target: $r.cache
        method: get
        args: [existing_key]
        as: existing
      - target: $r.cache
        method: get
        args: [cli_config, app, constants]
        as: cli
      - target: $r.cache
        method: get
        args: [di_config, app, constants]
        as: di
    assert:
      - outcome: existing
        equals: existing_value
      - outcome: cli
        equals: config.yml
      - outcome: di
        equals: config.yml

  add_default_app_constants_empty_dict_leaves_cache_clean:
    conditions: {}
    execute:
      - target: {module_path: tiferet.contexts.app, attribute: add_default_app_constants}
        method: add_default_app_constants
        args:
          - {}
        as: decorator
      - *cache_module
      - *base_build
      - *wrap
      - target: $r.wrapped
        method: __call__
        as: cache
    assert:
      - outcome: cache
        attribute: _cache
        equals: {}

  app_session_cache_prefix_value:
    conditions: {}
    execute:
      - target: {module_path: importlib, attribute: import_module}

        args: [tiferet.contexts.cache]
        as: cache_module
      - &base_build
        target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.cache_module, CacheContext]
        as: base_build
      - &wrap
        target: $r.decorator
        method: __call__
        args: [$r.base_build]
        as: wrapped
      - target: {module_path: builtins, attribute: hasattr}
        method: hasattr
        args: [$r.wrapped, __call__]
        as: is_callable
    assert:
      - outcome: is_callable
        equals: true


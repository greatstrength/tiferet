  app_interface_context_execute_feature:
    conditions:
      fixtures:
      - app_interface
      mocks:
        feature:
          module_path: tiferet.contexts.feature
          class_name: FeatureContext
        error:
          module_path: tiferet.contexts.error
          class_name: ErrorContext
        logger_builder:
          module_path: unittest.mock
          class_name: Mock
        logger:
          module_path: logging
          class_name: Logger
    execute:
    - target: $mock.logger_builder
      method: __setattr__
      args:
      - return_value
      - $mock.logger
    - target:
        module_path: importlib
        attribute: import_module
      method: import_module
      args:
      - tests.contexts.test_app
      as: paired
    - target:
        module_path: builtins
        attribute: getattr
      method: getattr
      args:
      - $r.paired
      - app_interface_context
      as: fixture_function
    - target: $r.fixture_function
      method: __getattribute__
      args:
      - __wrapped__
      as: fixture_factory
    - target: $r.fixture_factory
      method: __call__
      args:
      - $fixture.app_interface
      - $mock.feature
      - $mock.error
      - $mock.logger_builder
      as: app
    - target:
        module_path: tiferet.contexts.request
        class_name: RequestContext
      method: __call__
      kwargs:
        headers:
          Content-Type: application/json
        data:
          key: value
      as: request
    - target: $r.app
      method: execute_feature
      args:
      - test_group.test_feature
      - $r.request
    assert:
    - mock: feature
      method: execute_feature
      assert_called_once_with:
        times: 1
  app_interface_context_handle_error:
    conditions:
      fixtures:
      - app_interface
      mocks:
        feature:
          module_path: tiferet.contexts.feature
          class_name: FeatureContext
        error:
          module_path: tiferet.contexts.error
          class_name: ErrorContext
        logger_builder:

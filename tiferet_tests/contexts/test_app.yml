fixtures:
  app_interface:
    module_path: tiferet.mappers
    class_name: AppSessionAggregate
    attributes:
      id: test
      name: Test App
      description: The test app.
      flags: [test]
      services: []
  request:
    module_path: &request_module tiferet.contexts.request
    class_name: &request_class RequestContext
    attributes:
      data: {}
  expected_request:
    module_path: *request_module
    class_name: *request_class
    attributes:
      data: {k: v}
  api_error:
    module_path: tiferet.assets
    class_name: TiferetAPIError
    attributes:
      error_code: FORMATTED_ERROR
      name: Formatted Error
      message: Already formatted.
      feature_id: group.feat
  test_error:
    module_path: tiferet.assets
    class_name: TiferetError
    attributes:
      error_code: TEST_ERROR
      message: Test error message.
      feature_id: group.feat

tests:
  app_service_cache_prefix_value:
    conditions: {}
    execute:
      - target: {module_path: importlib, attribute: import_module}
        method: import_module
        args: [tiferet.contexts.app]
        as: module
      - target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.module, APP_SERVICE_CACHE_PREFIX]
        as: prefix
      - target: {module_path: builtins, attribute: len}
        method: len
        args: [$r.prefix]
        as: size
      - target: $r.prefix
        method: __getitem__
        args: [0]
        as: first
      - target: $r.prefix
        method: __getitem__
        args: [1]
        as: second
    assert:
      - outcome: prefix
        type: {module_path: builtins, class_name: tuple}
      - outcome: size
        equals: 2
      - outcome: first
        equals: app
      - outcome: second
        equals: services

  app_constant_cache_prefix_value:
    conditions: {}
    execute:
      - target: {module_path: importlib, attribute: import_module}
        method: import_module
        args: [tiferet.contexts.app]
        as: module
      - target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.module, APP_CONSTANT_CACHE_PREFIX]
        as: prefix
      - target: {module_path: builtins, attribute: len}
        method: len
        args: [$r.prefix]
        as: size
      - target: $r.prefix
        method: __getitem__
        args: [0]
        as: first
      - target: $r.prefix
        method: __getitem__
        args: [1]
        as: second
    assert:
      - outcome: prefix
        type: {module_path: builtins, class_name: tuple}
      - outcome: size
        equals: 2
      - outcome: first
        equals: app
      - outcome: second
        equals: constants

  add_default_app_services_returns_callable:
    conditions: {}
    execute:
      - target: {module_path: tiferet.contexts.app, attribute: add_default_app_services}
        method: add_default_app_services
        args:
          - &sample_services
            di_service:
              service_id: di_service
              module_path: tiferet.repos.di
              class_name: DIConfigRepository
              parameters: {}
            get_error_evt:
              service_id: get_error_evt
              module_path: tiferet.events.error
              class_name: GetError
              parameters: {}
        as: decorator
      - &cache_module
        target: {module_path: importlib, attribute: import_module}
        method: import_module
        args: [tiferet.contexts.cache]
        as: cache_module
      - &base_build
        target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.cache_module, CacheContext]
        as: base_build
      - &wrap
        target: $r.decorator
        method: __call__
        args: [$r.base_build]
        as: wrapped
    assert:
      - outcome: wrapped
        type: {module_path: types, class_name: FunctionType}

  add_default_app_services_seeds_cache_with_domain_objects:
    conditions: {}
    execute:
      - target: {module_path: tiferet.contexts.app, attribute: add_default_app_services}
        method: add_default_app_services
        args:
          - *sample_services
        as: decorator
      - *cache_module
      - *base_build
      - *wrap
      - target: $r.wrapped
        method: __call__
        as: cache
      - target: $r.cache
        method: get
        args: [di_service, app, services]
        as: di
      - target: $r.cache
        method: get
        args: [get_error_evt, app, services]
        as: evt
    assert:
      - outcome: di
        type: {module_path: tiferet.domain, class_name: AppServiceDependency}
      - outcome: di
        attribute: service_id
        equals: di_service
      - outcome: evt
        type: {module_path: tiferet.domain, class_name: AppServiceDependency}
      - outcome: evt
        attribute: service_id
        equals: get_error_evt

  add_default_app_services_preserves_initial_cache_values:
    conditions: {}
    execute:
      - target: {module_path: tiferet.contexts.app, attribute: add_default_app_services}
        method: add_default_app_services
        args:
          - *sample_services
        as: decorator
      - *cache_module
      - *base_build
      - *wrap
      - target: $r.wrapped
        method: __call__
        kwargs:
          cache:
            existing_key: existing_value
        as: cache
      - target: $r.cache
        method: get
        args: [existing_key]
        as: existing
      - target: $r.cache
        method: get
        args: [di_service, app, services]
        as: di
      - target: $r.cache
        method: get
        args: [get_error_evt, app, services]
        as: evt
    assert:
      - outcome: existing
        equals: existing_value
      - outcome: di
        type: {module_path: tiferet.domain, class_name: AppServiceDependency}
      - outcome: evt
        type: {module_path: tiferet.domain, class_name: AppServiceDependency}

  add_default_app_services_empty_dict_leaves_cache_clean:
    conditions: {}
    execute:
      - target: {module_path: tiferet.contexts.app, attribute: add_default_app_services}
        method: add_default_app_services
        args:
          - {}
        as: decorator
      - *cache_module
      - *base_build
      - *wrap
      - target: $r.wrapped
        method: __call__
        as: cache
    assert:
      - outcome: cache
        attribute: _cache
        equals: {}

  add_default_app_constants_returns_callable:
    conditions: {}
    execute:
      - target: {module_path: tiferet.contexts.app, attribute: add_default_app_constants}
        method: add_default_app_constants
        args:
          - &sample_constants
            cli_config: config.yml
            di_config: config.yml
        as: decorator
      - *cache_module
      - *base_build
      - *wrap
    assert:
      - outcome: wrapped
        type: {module_path: types, class_name: FunctionType}

  add_default_app_constants_seeds_cache_with_scalars:
    conditions: {}

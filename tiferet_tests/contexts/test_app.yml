      - target: $r.cache
        method: get
        args: [tiferet_app, app, sessions]
        as: app_session
      - target: $r.cache
        method: get
        args: [missing.session, app, sessions]
        as: missing
    assert:
      - outcome: app_session
        type: {module_path: tiferet.domain, class_name: AppSession}
      - outcome: app_session
        attribute: id
        equals: tiferet_app
      - outcome: missing
        "null": true

  add_default_app_services_readable_via_cache_by_prefix:
    conditions: {}
    execute:
      - target: {module_path: tiferet.contexts.app, attribute: add_default_app_services}

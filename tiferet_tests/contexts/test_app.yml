        headers:
          Content-Type: application/json
          interface_id: $r.interface_id
        data:
          key: value
          param: test_param
    - target:
        module_path: builtins
        attribute: getattr
      method: getattr
      args:
      - $mock.logger
      - debug
      as: debug
    - target: $r.debug
      method: __getattribute__
      args:
      - call_count
      as: debug_count
    - target:
        module_path: builtins
        attribute: bool
      method: bool
      args:
      - $r.debug_count
      as: debug_called
    - target:
        module_path: builtins
        attribute: getattr
      method: getattr
      args:
      - $mock.logger
      - info
      as: info
    - target: $r.info
      method: __getattribute__
      args:
      - call_args_list
      as: info_calls
    - target:
        module_path: builtins
        attribute: str

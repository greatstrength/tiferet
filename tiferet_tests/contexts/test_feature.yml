fixtures:
  feature:
    module_path: &domain tiferet.domain
    class_name: &feature_class Feature
    attributes:
      id: test_group.test_feature
      group_id: test_group
      feature_key: test_feature
      name: Test Feature
      description: A feature for testing purposes.
      steps: []
  coercing_feature:
    module_path: *domain
    class_name: *feature_class
    attributes:
      id: calc.add
      name: Add
      params_schema: {a: int, b: float}
      steps: []
  int_feature:
    module_path: *domain
    class_name: *feature_class
    attributes:
      id: calc.add
      name: Add
      params_schema: {a: int}
      steps: []
  two_int_feature:
    module_path: *domain
    class_name: *feature_class
    attributes:
      id: calc.add
      name: Add
      params_schema: {a: int, b: int}
      steps: []
  request_empty:
    module_path: tiferet.contexts.request
    class_name: RequestContext
    attributes:
      data: {}
  request_x5:
    module_path: tiferet.contexts.request
    class_name: RequestContext
    attributes:
      data: {x: 5}
  request_x_neg:
    module_path: tiferet.contexts.request
    class_name: RequestContext
    attributes:
      data: {x: -1}
  request_advanced:
    module_path: tiferet.contexts.request
    class_name: RequestContext
    attributes:
      data: {mode: advanced}
  request_a_str:
    module_path: tiferet.contexts.request
    class_name: RequestContext
    attributes:
      data: {a: '5'}
  request_ab_str:
    module_path: tiferet.contexts.request
    class_name: RequestContext
    attributes:
      data: {a: '5', b: '2'}
  request_a_notint:
    module_path: tiferet.contexts.request
    class_name: RequestContext
    attributes:
      data: {a: notint}
  request_ab_xy:
    module_path: tiferet.contexts.request
    class_name: RequestContext
    attributes:
      data: {a: x, b: y}
  middleware_a:
    module_path: &mw_module tiferet.contexts.request
    class_name: &mw_class RequestContext
    attributes: {data: {}}
  middleware_b:
    module_path: *mw_module
    class_name: *mw_class
    attributes: {data: {}}

tests:
  evaluate_condition_none_returns_true:
    conditions:
      fixtures: [request_empty]
    execute:
      - target: {module_path: tiferet.contexts.feature, attribute: evaluate_condition}
        method: evaluate_condition
        args: [null, $fixture.request_empty]
        as: result_0
    assert:
      - outcome: result_0
        equals: true

  evaluate_condition_empty_returns_true:
    conditions:
      fixtures: [request_empty]
    execute:
      - target: {module_path: tiferet.contexts.feature, attribute: evaluate_condition}
        method: evaluate_condition
        args: ['', $fixture.request_empty]
        as: result_0
      - target: {module_path: tiferet.contexts.feature, attribute: evaluate_condition}
        method: evaluate_condition
        args: ['   ', $fixture.request_empty]
        as: result_1
    assert:
      - outcome: result_0
        equals: true
      - outcome: result_1
        equals: true

  evaluate_condition_true_expression:
    conditions:
      fixtures: [request_x5]
    execute:
      - target: {module_path: tiferet.contexts.feature, attribute: evaluate_condition}
        method: evaluate_condition
        args: ['$r.x > 0', $fixture.request_x5]
        as: result_0
    assert:
      - outcome: result_0
        equals: true

  evaluate_condition_false_expression:
    conditions:
      fixtures: [request_x_neg]
    execute:
      - target: {module_path: tiferet.contexts.feature, attribute: evaluate_condition}
        method: evaluate_condition
        args: ['$r.x > 0', $fixture.request_x_neg]
        as: result_0
    assert:
      - outcome: result_0
        equals: false

  evaluate_condition_string_equality:
    conditions:
      fixtures: [request_advanced]
    execute:
      - target: {module_path: tiferet.contexts.feature, attribute: evaluate_condition}
        method: evaluate_condition
        args: ["$r.mode == 'advanced'", $fixture.request_advanced]
        as: result_0
      - target: {module_path: tiferet.contexts.feature, attribute: evaluate_condition}
        method: evaluate_condition
        args: ["$r.mode == 'basic'", $fixture.request_advanced]
        as: result_1
    assert:
      - outcome: result_0
        equals: true
      - outcome: result_1
        equals: false

  evaluate_condition_missing_key_returns_false:
    conditions:
      fixtures: [request_empty]
    execute:
      - target: {module_path: tiferet.contexts.feature, attribute: evaluate_condition}
        method: evaluate_condition
        args: ['$r.x > 0', $fixture.request_empty]
        as: result_0
    assert:
      - outcome: result_0
        equals: false

  evaluate_condition_invalid_expression_returns_false:
    conditions:
      fixtures: [request_x5]
    execute:
      - target: {module_path: tiferet.contexts.feature, attribute: evaluate_condition}
        method: evaluate_condition
        args: ['$r.x >>>!!! invalid', $fixture.request_x5]
        as: result_0
    assert:
      - outcome: result_0
        equals: false

  validate_request_no_schema_is_noop:
    conditions:
      fixtures: [feature, request_a_str]
    execute:
      - target: {module_path: tiferet.contexts.feature, attribute: validate_request}
        method: validate_request
        args: [$fixture.feature, $fixture.request_a_str]
    assert:
      - outcome: request_a_str
        attribute: data
        equals: {a: '5'}

  validate_request_coerces_data:
    conditions:
      fixtures: [coercing_feature, request_ab_str]
    execute:
      - target: {module_path: tiferet.contexts.feature, attribute: validate_request}
        method: validate_request
        args: [$fixture.coercing_feature, $fixture.request_ab_str]
    assert:
      - outcome: request_ab_str
        attribute: data
        fields:
          a: 5
          b: 2.0

  validate_request_invalid_data_raises:
    conditions:
      fixtures: [int_feature, request_a_notint]
    execute:
      - target: {module_path: tiferet.contexts.feature, attribute: validate_request}
        method: validate_request
        args: [$fixture.int_feature, $fixture.request_a_notint]
        raises: true
        as: failed
    assert:
      - outcome: failed
        type: &tiferet_error {module_path: tiferet.assets, class_name: TiferetError}
      - outcome: failed
        error_code: REQUEST_VALIDATION_FAILED

  validate_request_missing_required_carries_context:
    conditions:
      fixtures: [int_feature, request_empty]
    execute:
      - target: {module_path: tiferet.contexts.feature, attribute: validate_request}
        method: validate_request
        args: [$fixture.int_feature, $fixture.request_empty]
        raises: true
        as: failed
    assert:
      - outcome: failed
        type: *tiferet_error
      - outcome: failed
        error_code: REQUEST_VALIDATION_FAILED
      - outcome: failed
        attribute: kwargs
        fields:
          feature_id: calc.add
          violations: [{field: a}]

  validate_request_aggregates_multiple_violations:
    conditions:
      fixtures: [two_int_feature, request_ab_xy]
    execute:
      - target: {module_path: tiferet.contexts.feature, attribute: validate_request}
        method: validate_request
        args: [$fixture.two_int_feature, $fixture.request_ab_xy]
        raises: true
        as: failed
    assert:
      - outcome: failed
        error_code: REQUEST_VALIDATION_FAILED
      - outcome: failed
        attribute: kwargs
        fields:
          violations: [{field: a}, {field: b}]

  compose_step_middleware_both_empty:
    conditions: {}
    execute:
      - target: {module_path: tiferet.contexts.feature, attribute: compose_step_middleware}
        method: compose_step_middleware
        args: [[], []]
        as: result
    assert:
      - outcome: result
        equals: []

  compose_step_middleware_feature_only:
    conditions:
      fixtures: [middleware_a]
    execute:
      - target: {module_path: tiferet.contexts.feature, attribute: compose_step_middleware}
        method: compose_step_middleware
        args: [[$fixture.middleware_a], []]
        as: result
    assert:
      - outcome: result
        equals: [$fixture.middleware_a]

  compose_step_middleware_step_only:
    conditions:
      fixtures: [middleware_b]
    execute:
      - target: {module_path: tiferet.contexts.feature, attribute: compose_step_middleware}
        method: compose_step_middleware
        args: [[], [$fixture.middleware_b]]
        as: result
    assert:
      - outcome: result
        equals: [$fixture.middleware_b]

  compose_step_middleware_feature_first:
    conditions:
      fixtures: [middleware_a, middleware_b]
    execute:
      - target: {module_path: tiferet.contexts.feature, attribute: compose_step_middleware}
        method: compose_step_middleware
        args: [[$fixture.middleware_a], [$fixture.middleware_b]]
        as: result
    assert:
      - outcome: result
        equals: [$fixture.middleware_a, $fixture.middleware_b]

  compose_step_middleware_none_inputs:
    conditions: {}
    execute:
      - target: {module_path: tiferet.contexts.feature, attribute: compose_step_middleware}
        method: compose_step_middleware
        args: [null, null]
        as: result
    assert:
      - outcome: result
        equals: []

  feature_cache_prefix_value:
    conditions: {}
    execute:
      - target: {module_path: importlib, attribute: import_module}
        method: import_module
        args: [tiferet.contexts.feature]
        as: module
      - target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.module, FEATURE_CACHE_PREFIX]
        as: prefix
      - target: {module_path: builtins, attribute: len}
        method: len
        args: [$r.prefix]
        as: size
      - target: $r.prefix
        method: __getitem__
        args: [0]
        as: first
      - target: $r.prefix
        method: __getitem__
        args: [1]
        as: second
    assert:
      - outcome: prefix
        type: {module_path: builtins, class_name: tuple}
      - outcome: size
        equals: 2
      - outcome: first
        equals: app
      - outcome: second
        equals: features

  add_default_features_seeds_cache:
    conditions: {}
    execute:
      - target: &add_features {module_path: tiferet.contexts.feature, attribute: add_default_features}
        method: add_default_features
        args:
          - test_group.test_feature:
              group_id: test_group
              feature_key: test_feature
              name: Test Feature
              steps: []
        as: decorator
      - &cache_module
        target: {module_path: importlib, attribute: import_module}
        method: import_module
        args: [tiferet.contexts.cache]
        as: cache_module
      - &base_build
        target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.cache_module, CacheContext]
        as: base_build
      - &wrap
        target: $r.decorator
        method: __call__
        args: [$r.base_build]
        as: build_cache
      - &build
        target: $r.build_cache
        method: __call__
        as: cache
      - target: $r.cache
        method: get
        args: [test_group.test_feature, app, features]
        as: feature
    assert:
      - outcome: feature
        type: {module_path: *domain, class_name: *feature_class}
      - outcome: feature
        fields:
          id: test_group.test_feature
          name: Test Feature

  add_default_features_empty_catalog:
    conditions: {}
    execute:
      - target: *add_features
        method: add_default_features
        args: [{}]
        as: decorator
      - *cache_module
      - *base_build
      - *wrap
      - *build
      - target: $r.cache
        method: get_by_prefix
        args: [app, features]
        as: features
    assert:
      - outcome: features
        equals: {}

  # --- Saito nested-class __wrapped__ ports (Chief 2026-11-05) ---

  resolve_step_event_without_flags:
    conditions: {}
    execute:
      - &import_paired
        target: {module_path: importlib, attribute: import_module}
        method: import_module
        args: [tests.contexts.test_feature]
        as: paired
      - &load_cmd_fx
        target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.paired, test_command]
        as: cmd_fx
      - &unwrap_cmd
        target: $r.cmd_fx
        method: __getattribute__
        args: [__wrapped__]
        as: cmd_factory
      - &call_cmd
        target: $r.cmd_factory
        method: __call__
        as: test_command
      - &load_svc_fx
        target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.paired, services_context]
        as: svc_fx
      - &unwrap_svc
        target: $r.svc_fx
        method: __getattribute__
        args: [__wrapped__]
        as: svc_factory
      - &call_svc
        target: $r.svc_factory
        method: __call__
        args: [$r.test_command]
        as: services
      - &load_feat_fx
        target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.paired, feature]
        as: feat_fx
      - &unwrap_feat
        target: $r.feat_fx
        method: __getattribute__
        args: [__wrapped__]
        as: feat_factory
      - &call_feat
        target: $r.feat_factory
        method: __call__
        as: feature
      - &load_ctx_fx
        target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.paired, feature_context]
        as: ctx_fx
      - &unwrap_ctx
        target: $r.ctx_fx
        method: __getattribute__
        args: [__wrapped__]
        as: ctx_factory
      - &call_ctx
        target: $r.ctx_factory
        method: __call__
        args: [$r.services, $r.feature]
        as: ctx
      - &get_dep
        target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.services, get_dependency]
        as: get_dep

      - target: {module_path: tiferet.domain, class_name: EventFeatureStep}
        method: __call__
        kwargs: {name: Test Command, service_id: test_command}
        as: step
      - target: $r.ctx
        method: resolve_step_event
        args: [$r.step]
        as: event
      - target: {module_path: operator, attribute: is_}
        method: is_
        args: [$r.event, $r.test_command]
        as: same
      - target: $r.get_dep
        method: assert_called_once_with
        args: [test_command]
        as: called
    assert:
      - outcome: same
        equals: true
      - outcome: called
        "null": true

  resolve_step_event_with_flags:
    conditions: {}
    execute:
      - *import_paired
      - *load_cmd_fx
      - *unwrap_cmd
      - *call_cmd
      - *load_svc_fx
      - *unwrap_svc
      - *call_svc
      - *load_feat_fx
      - *unwrap_feat
      - *call_feat
      - *load_ctx_fx
      - *unwrap_ctx
      - *call_ctx
      - *get_dep

      - target: {module_path: tiferet.domain, class_name: EventFeatureStep}
        method: __call__
        kwargs: {name: Test Command, service_id: test_command, flags: [flag1, flag2]}
        as: step
      - target: $r.ctx
        method: resolve_step_event
        args: [$r.step]
        as: event
      - target: {module_path: operator, attribute: is_}
        method: is_
        args: [$r.event, $r.test_command]
        as: same
      - target: $r.get_dep
        method: assert_called_once_with
        args: [test_command, flag1, flag2]
        as: called
    assert:
      - outcome: same
        equals: true
      - outcome: called
        "null": true

  resolve_step_event_only_feature_flags:
    conditions: {}
    execute:
      - *import_paired
      - *load_cmd_fx
      - *unwrap_cmd
      - *call_cmd
      - *load_svc_fx
      - *unwrap_svc
      - *call_svc
      - *load_feat_fx
      - *unwrap_feat
      - *call_feat
      - *load_ctx_fx
      - *unwrap_ctx
      - *call_ctx
      - *get_dep

      - target: {module_path: tiferet.domain, class_name: EventFeatureStep}
        method: __call__
        kwargs: {name: Test Command, service_id: test_command, flags: []}
        as: step
      - target: $r.ctx
        method: resolve_step_event
        args: [$r.step]
        kwargs: {feature_flags: [feature_flag]}
        as: event
      - target: {module_path: operator, attribute: is_}
        method: is_
        args: [$r.event, $r.test_command]
        as: same
      - target: $r.get_dep
        method: assert_called_once_with
        args: [test_command, feature_flag]
        as: called
    assert:
      - outcome: same
        equals: true
      - outcome: called
        "null": true

  resolve_step_event_only_step_flags:
    conditions: {}
    execute:
      - *import_paired
      - *load_cmd_fx
      - *unwrap_cmd
      - *call_cmd
      - *load_svc_fx
      - *unwrap_svc
      - *call_svc
      - *load_feat_fx
      - *unwrap_feat
      - *call_feat
      - *load_ctx_fx
      - *unwrap_ctx
      - *call_ctx
      - *get_dep

      - target: {module_path: tiferet.domain, class_name: EventFeatureStep}
        method: __call__
        kwargs: {name: Test Command, service_id: test_command, flags: [command_flag]}
        as: step
      - target: $r.ctx
        method: resolve_step_event
        args: [$r.step]
        as: event
      - target: {module_path: operator, attribute: is_}
        method: is_
        args: [$r.event, $r.test_command]
        as: same
      - target: $r.get_dep
        method: assert_called_once_with
        args: [test_command, command_flag]
        as: called
    assert:
      - outcome: same
        equals: true
      - outcome: called
        "null": true

  resolve_step_event_with_combined_flags:
    conditions: {}
    execute:
      - *import_paired
      - *load_cmd_fx
      - *unwrap_cmd
      - *call_cmd
      - *load_svc_fx
      - *unwrap_svc
      - *call_svc
      - *load_feat_fx
      - *unwrap_feat
      - *call_feat
      - *load_ctx_fx
      - *unwrap_ctx
      - *call_ctx
      - *get_dep

      - target: {module_path: tiferet.domain, class_name: EventFeatureStep}
        method: __call__
        kwargs:
          name: Test Command
          service_id: test_command
          flags: [command_flag_1, command_flag_2]
        as: step
      - target: $r.ctx
        method: resolve_step_event
        args: [$r.step]
        kwargs: {feature_flags: [feature_flag_1, feature_flag_2]}
        as: event
      - target: {module_path: operator, attribute: is_}
        method: is_
        args: [$r.event, $r.test_command]
        as: same
      - target: $r.get_dep
        method: assert_called_once_with
        args: [test_command, feature_flag_1, feature_flag_2, command_flag_1, command_flag_2]
        as: called
    assert:
      - outcome: same
        equals: true
      - outcome: called
        "null": true

  resolve_step_event_failed:
    conditions: {}
    execute:
      - *import_paired
      - *load_cmd_fx
      - *unwrap_cmd
      - *call_cmd
      - *load_svc_fx
      - *unwrap_svc
      - *call_svc
      - *load_feat_fx
      - *unwrap_feat
      - *call_feat
      - *load_ctx_fx
      - *unwrap_ctx
      - *call_ctx
      - *get_dep

      - target: {module_path: tiferet.assets, class_name: TiferetError}
        method: __call__
        kwargs:
          error_code: TEST_ERROR
          message: 'Feature command not found in services: non_existent_command'
        as: missing
      - target: $r.get_dep
        method: __setattr__
        args: [side_effect, $r.missing]
      - target: {module_path: tiferet.domain, class_name: EventFeatureStep}
        method: __call__
        kwargs: {name: Missing Command, service_id: non_existent_command, flags: [flagX]}
        as: step
      - target: $r.ctx
        method: resolve_step_event
        args: [$r.step]
        raises: true
        as: failure
      - target: $r.failure
        method: __getattribute__
        args: [kwargs]
        as: err_kwargs
      - target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.err_kwargs, get]
        as: kwargs_get
      - target: $r.kwargs_get
        method: __call__
        args: [service_id]
        as: service_id
    assert:
      - outcome: failure
        error_code: FEATURE_STEP_LOADING_FAILED
      - outcome: service_id
        equals: non_existent_command
      - outcome: failure
        message: 'Failed to load feature step: non_existent_command'

  resolve_middleware:
    conditions: {}
    execute:
      - *import_paired
      - *load_cmd_fx
      - *unwrap_cmd
      - *call_cmd
      - *load_svc_fx
      - *unwrap_svc
      - *call_svc
      - *load_feat_fx
      - *unwrap_feat
      - *call_feat
      - *load_ctx_fx
      - *unwrap_ctx
      - *call_ctx
      - *get_dep

      - target: $r.ctx
        method: resolve_middleware
        args: [[mw_one, mw_two]]
        as: middleware
      - target: {module_path: builtins, attribute: len}
        method: len
        args: [$r.middleware]
        as: size
      - target: $r.middleware
        method: __getitem__
        args: [0]
        as: first
      - target: $r.middleware
        method: __getitem__
        args: [1]
        as: second
      - target: {module_path: operator, attribute: is_}
        method: is_
        args: [$r.first, $r.test_command]
        as: first_same
      - target: {module_path: operator, attribute: is_}
        method: is_
        args: [$r.second, $r.test_command]
        as: second_same
      - target: $r.get_dep
        method: __getattribute__
        args: [call_count]
        as: calls
    assert:
      - outcome: size
        equals: 2
      - outcome: first_same
        equals: true
      - outcome: second_same
        equals: true
      - outcome: calls
        equals: 2

  resolve_middleware_empty:
    conditions: {}
    execute:
      - *import_paired
      - *load_cmd_fx
      - *unwrap_cmd
      - *call_cmd
      - *load_svc_fx
      - *unwrap_svc
      - *call_svc
      - *load_feat_fx
      - *unwrap_feat
      - *call_feat
      - *load_ctx_fx
      - *unwrap_ctx
      - *call_ctx
      - *get_dep

      - target: $r.ctx
        method: resolve_middleware
        args: [[]]
        as: middleware
      - target: $r.get_dep
        method: assert_not_called
        as: quiet
    assert:
      - outcome: middleware
        equals: []
      - outcome: quiet
        "null": true

  resolve_middleware_failed:
    conditions: {}
    execute:
      - *import_paired
      - *load_cmd_fx
      - *unwrap_cmd
      - *call_cmd
      - *load_svc_fx
      - *unwrap_svc
      - *call_svc
      - *load_feat_fx
      - *unwrap_feat
      - *call_feat
      - *load_ctx_fx
      - *unwrap_ctx
      - *call_ctx
      - *get_dep

      - target: {module_path: tiferet.assets, class_name: TiferetError}
        method: __call__
        kwargs:
          error_code: TEST_ERROR
          message: 'Middleware not found in services: missing_mw'
        as: missing
      - target: $r.get_dep
        method: __setattr__
        args: [side_effect, $r.missing]
      - target: $r.ctx
        method: resolve_middleware
        args: [[missing_mw]]
        raises: true
        as: failure
      - target: $r.failure
        method: __getattribute__

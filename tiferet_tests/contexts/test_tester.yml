fixtures:
  domain_tester:
    module_path: &domain tiferet.domain
    class_name: &tester_object TesterObject
    attributes:
      type: domain
      id: domain.ErrorMessage
      module_path: tiferet.domain.error
      class_name: ErrorMessage
  aggregate_tester:
    module_path: *domain
    class_name: *tester_object
    attributes:
      type: aggregate
      id: aggregate.ErrorAggregate
      module_path: tiferet.mappers.error
      class_name: ErrorAggregate
      set_attribute_params:
        - [name, Updated Error, null]
        - [invalid_attribute, value, INVALID_MODEL_ATTRIBUTE]
      sample_data: &error_sample {id: TEST_ERROR, name: Test Error}
      equality_fields: &id_name [id, name]
  transfer_tester:
    module_path: *domain
    class_name: *tester_object
    attributes:
      type: transfer_object
      id: transfer_object.ErrorConfigObject
      module_path: tiferet.mappers.error
      class_name: ErrorConfigObject
      aggregate_module_path: tiferet.mappers.error
      aggregate_class_name: ErrorAggregate
      sample_data: *error_sample
      aggregate_sample_data: *error_sample
      equality_fields: *id_name
  sampled_domain_tester:
    module_path: *domain
    class_name: *tester_object
    attributes:
      type: domain
      id: domain.ErrorMessage
      module_path: tiferet.domain.error
      class_name: ErrorMessage
      sample_data: &message_sample {lang: en_US, text: An error occurred.}
      equality_fields: [lang, text]
  service_event_tester:
    module_path: *domain
    class_name: *tester_object
    attributes:
      type: service_event
      id: service_event.GetError
      module_path: tiferet.events.error
      class_name: GetError
      sample_data: {}
      dependencies:
        error_service: {module_path: tiferet.interfaces, class_name: ErrorService}
      sample_kwargs: {id: TEST_ERROR}
      required_params: []
      service_attr: error_service
      not_found_error_code: ERROR_NOT_FOUND
  error_aggregate:
    module_path: tiferet.mappers.error
    class_name: ErrorAggregate
    attributes:
      id: TEST_ERROR
      name: Test Error
      message: [{lang: en_US, text: An error occurred.}]
  generic_message_tester:
    module_path: *domain
    class_name: *tester_object
    attributes:
      type: generic
      id: generic.ErrorMessage
      module_path: tiferet.domain.error
      class_name: ErrorMessage
      sample_data: *message_sample
  generic_service_tester:
    module_path: *domain
    class_name: *tester_object
    attributes:
      type: generic
      id: generic.ErrorService
      module_path: tiferet.interfaces
      class_name: ErrorService
  repo_tester:
    module_path: *domain
    class_name: *tester_object
    attributes:
      type: repo
      id: repo.ErrorConfigRepository
      module_path: tiferet.repos.error
      class_name: ErrorConfigRepository
      config_parameter: error_config
  not_found_error:
    module_path: tiferet.assets
    class_name: TiferetError
    attributes:
      error_code: ERROR_NOT_FOUND
      message: gone
  bare_request_tester:
    module_path: *domain
    class_name: *tester_object
    attributes:
      type: context
      id: context.RequestContext
      module_path: &request_module tiferet.contexts.request
      class_name: &request_class RequestContext
      domain_module_path: *domain
      domain_class_name: Request
  declaring_request_tester:
    module_path: *domain
    class_name: *tester_object
    attributes:
      type: context
      id: context.RequestContext
      module_path: *request_module
      class_name: *request_class
      sample_data: &request_sample {session_id: test-session, feature_id: test.feature}
      domain_module_path: *domain
      domain_class_name: Request
      from_domain_cases: [{data: *request_sample}]
      domain_type_cases: [{declares: true}]
      for_domain_cases:
        - domain_module_path: *domain
          domain_class_name: Request
          context_module_path: *request_module
          context_class_name: *request_class
  cli_session_tester:
    module_path: *domain
    class_name: *tester_object
    attributes:
      type: context
      id: context.CliSessionContext
      module_path: tiferet.contexts.cli
      class_name: CliSessionContext
      domain_module_path: *domain
      domain_class_name: AppSession
      domain_type_cases: [{declares: false}]
      for_domain_cases:
        - domain_module_path: *domain
          domain_class_name: AppSession
          context_module_path: tiferet.contexts.app
          context_class_name: AppSessionContext
        - domain_module_path: *domain
          domain_class_name: TesterObject
          context_module_path: tiferet.contexts.tester
          context_class_name: TesterContext
  reserved_kwargs_tester:
    module_path: *domain
    class_name: *tester_object
    attributes:
      type: domain_event
      id: domain_event.ReservedKwargsEvent
      module_path: tests.contexts.test_tester
      class_name: ReservedKwargsEvent
      sample_data: {}
      dependencies: {}
      sample_kwargs: {}
      required_params: []

  pow_generic_tester:
    module_path: *domain
    class_name: *tester_object
    attributes:
      type: generic
      id: generic.pow
      module_path: builtins
      class_name: pow

  add_values_generic_tester:
    module_path: *domain
    class_name: *tester_object
    attributes:
      type: generic
      id: generic.add_values
      module_path: tests.contexts.test_tester
      class_name: _add_values

tests:
  build_tester_context_selects_variant_class:
    conditions:
      fixtures: [domain_tester, aggregate_tester, transfer_tester]
    execute:
      - &build {target: {module_path: tiferet.blueprints.tester, attribute: build_tester_context}, method: build_tester_context, args: [$fixture.domain_tester], as: domain_ctx}
      - {target: {module_path: tiferet.blueprints.tester, attribute: build_tester_context}, method: build_tester_context, args: [$fixture.aggregate_tester], as: aggregate_ctx}
      - {target: {module_path: tiferet.blueprints.tester, attribute: build_tester_context}, method: build_tester_context, args: [$fixture.transfer_tester], as: transfer_ctx}
      - {target: $r.aggregate_ctx, method: assert_set_attribute}
      - {target: $r.transfer_ctx, method: assert_map}
    assert:
      - outcome: domain_ctx
        type: &domain_tester_ctx {module_path: tiferet.contexts.tester, class_name: DomainTesterContext}
      - outcome: aggregate_ctx
        type: {module_path: tiferet.contexts.tester, class_name: AggregateTesterContext}
      - outcome: transfer_ctx
        type: {module_path: tiferet.contexts.tester, class_name: TransferObjectTesterContext}

  use_tester_injects_test_ctx:
    conditions:
      fixtures: [sampled_domain_tester]
    execute:
      - {target: {module_path: tiferet.blueprints.tester, attribute: build_tester_context}, method: build_tester_context, args: [$fixture.sampled_domain_tester], as: test_ctx}
      - {target: $r.test_ctx, method: assert_new}
    assert:
      - outcome: test_ctx
        type: *domain_tester_ctx

  use_tester_injects_only_declared_session:
    conditions:
      fixtures: [sampled_domain_tester]
    execute:
      - {target: {module_path: tiferet.blueprints.tester, attribute: build_tester_context}, method: build_tester_context, args: [$fixture.sampled_domain_tester], as: test_ctx}
      - {target: {module_path: tiferet.blueprints.tester, attribute: build_test_session}, method: build_test_session, args: [$r.test_ctx], as: session}
    assert:
      - outcome: session
        type: {module_path: tiferet.contexts.tester, class_name: TestSessionContext}
      - outcome: session
        attribute: tester_ctx
        type: *domain_tester_ctx

  service_event_tester_context_handle_and_asserts:
    conditions:
      fixtures: [service_event_tester, error_aggregate]
    execute:
      - target: {module_path: tiferet.contexts.tester, class_name: ServiceEventTesterContext}
        method: from_domain
        args: [$fixture.service_event_tester]
        as: test_ctx
      - {target: $r.test_ctx, method: mock_dependencies, as: dependencies}
      - {target: $r.dependencies, method: get, args: [error_service], as: error_service}
      - {target: $r.test_ctx, method: get_service_mock, args: [$r.dependencies], as: service_mock}
      - {target: {module_path: operator, attribute: is_}, method: is_, args: [$r.service_mock, $r.error_service], as: same_service}
      - {target: {module_path: builtins, attribute: getattr}, method: getattr, args: [$r.error_service, get], as: get_mock}
      - target: $r.get_mock
        method: configure_mock
        kwargs: {return_value: $fixture.error_aggregate}
      - {target: $r.test_ctx, method: assert_not_found}
      - {target: $r.test_ctx, method: assert_missing_required_params}
    assert:
      - outcome: test_ctx
        type: {module_path: tiferet.contexts.tester, class_name: DomainEventTesterContext}
      - outcome: same_service
        equals: true

  domain_event_tester_handle_passes_reserved_kwargs:
    conditions:
      fixtures: [reserved_kwargs_tester]
    execute:
      - target: {module_path: tiferet.contexts.tester, class_name: DomainEventTesterContext}
        method: from_domain
        args: [$fixture.reserved_kwargs_tester]
        as: test_ctx
      - target: $r.test_ctx
        method: __getattribute__
        args: [handle]
        as: handle_method
      - target: $r.handle_method
        method: __call__
        kwargs: {middleware: m, event_cls: e}
        as: result
    assert:
      - outcome: result
        equals: {middleware: m, event_cls: e, kw: {}}

  use_tester_injects_service_event_test_ctx:
    conditions:
      fixtures: [service_event_tester]
    execute:
      - {target: {module_path: tiferet.blueprints.tester, attribute: build_tester_context}, method: build_tester_context, args: [$fixture.service_event_tester], as: test_ctx}
      - {target: $r.test_ctx, method: assert_not_found}
    assert:
      - outcome: test_ctx
        type: {module_path: tiferet.contexts.tester, class_name: ServiceEventTesterContext}

  generic_tester_context_assert_contract:
    conditions:
      fixtures: [generic_message_tester, generic_service_tester]
    execute:
      - {target: &generic {module_path: tiferet.contexts.tester, class_name: GenericTesterContext}, method: from_domain, args: [$fixture.generic_message_tester], as: concrete_ctx}
      - {target: $r.concrete_ctx, method: assert_contract, as: concrete_result}
      - {target: *generic, method: from_domain, args: [$fixture.generic_service_tester], as: abc_ctx}
      - {target: {module_path: importlib, attribute: import_module}, method: import_module, args: [tiferet.interfaces], as: interfaces}
      - {target: {module_path: builtins, attribute: getattr}, method: getattr, args: [$r.interfaces, ErrorService], as: error_service_cls}
      - {target: $r.abc_ctx, method: assert_contract, kwargs: {target: $r.error_service_cls}, as: abc_result}
    assert:
      - outcome: concrete_result
        "null": true
      - outcome: abc_result
        "null": true

  repo_tester_context_empty_cases_are_noops:
    conditions:
      fixtures: [repo_tester]
    execute:
      - {target: {module_path: tiferet.contexts.tester, class_name: RepoTesterContext}, method: from_domain, args: [$fixture.repo_tester], as: test_ctx}
      - {target: $r.test_ctx, method: assert_exists, args: [null], as: exists}
      - {target: $r.test_ctx, method: assert_get, args: [null], as: got}
      - {target: $r.test_ctx, method: assert_list, args: [null], as: listed}
      - {target: $r.test_ctx, method: assert_save, args: [null], as: saved}
      - {target: $r.test_ctx, method: assert_delete, args: [null], as: deleted}
    assert:
      - {outcome: exists, "null": true}
      - {outcome: got, "null": true}
      - {outcome: listed, "null": true}
      - {outcome: saved, "null": true}
      - {outcome: deleted, "null": true}

  catalogued_tiferet_error_formats_through_handler:
    conditions:
      fixtures: [not_found_error]
    execute:
      - {target: {module_path: tiferet.blueprints.tester, attribute: _module_run_session}, method: _module_run_session, as: module_run}
      - {target: $r.module_run, method: note, args: [node.core], kwargs: {error: $fixture.not_found_error}, as: printable}
    assert:
      - outcome: printable
        type: {module_path: tiferet.assets, class_name: TiferetAPIError}
      - outcome: printable
        attribute: message
        equals: 'Error not found: {id}.'
      - outcome: module_run
        attribute: outcomes
        equals:
          - node_id: node.core
            status: FAILED
            message: 'Error not found: {id}.'

  session_context_given_merges_state_and_returns_self:
    conditions:
      fixtures: [sampled_domain_tester]
    execute:
      - {target: {module_path: tiferet.contexts.tester, class_name: DomainTesterContext}, method: from_domain, args: [$fixture.sampled_domain_tester], as: test_ctx}
      - {target: {module_path: tiferet.blueprints.tester, attribute: build_test_session}, method: build_test_session, args: [$r.test_ctx], as: session}
      - {target: $r.session, method: given, kwargs: {a: 1}, as: first}
      - {target: $r.first, method: given, kwargs: {a: 2}, as: returned}
      - {target: {module_path: operator, attribute: is_}, method: is_, args: [$r.returned, $r.session], as: same_session}
      - {target: {module_path: operator, attribute: is_}, method: is_, args: [$r.first, $r.session], as: same_first}
    assert:
      - {outcome: same_session, equals: true}
      - {outcome: same_first, equals: true}
      - {outcome: session, attribute: data, equals: {a: 2}}
      - {outcome: sampled_domain_tester, attribute: sample_data, equals: {lang: en_US, text: An error occurred.}}

  session_run_generic_uses_get_target_without_invoke:
    conditions:
      fixtures: [pow_generic_tester]
    execute:
      - {target: {module_path: tiferet.contexts.tester, class_name: GenericTesterContext}, method: from_domain, args: [$fixture.pow_generic_tester], as: test_ctx}
      - {target: {module_path: tiferet.blueprints.tester, attribute: build_test_session}, method: build_test_session, args: [$r.test_ctx], as: session}
      - {target: $r.session, method: given, kwargs: {base: 2, exp: 3}, as: given_session}
      - {target: $r.given_session, method: verify, args: [8], as: verified}
      - {target: $r.verified, method: run, as: result}
    assert:
      - {outcome: result, equals: 8}


  session_run_rejects_target_on_specialized_tester:
    conditions:
      fixtures: [sampled_domain_tester]
    execute:
      - target: {module_path: tiferet.contexts.tester, class_name: DomainTesterContext}
        method: from_domain
        args: [$fixture.sampled_domain_tester]
        as: test_ctx
      - target: {module_path: tiferet.blueprints.tester, attribute: build_test_session}
        method: build_test_session
        args: [$r.test_ctx]
        as: session
      - target: {module_path: importlib, attribute: import_module}
        method: import_module
        args: [builtins]
        as: builtins_mod
      - target: {module_path: builtins, attribute: getattr}
        method: getattr
        args: [$r.builtins_mod, pow]
        as: live_target
      - target: $r.session
        method: run
        kwargs: {target: $r.live_target}
        raises: true
        as: rejected
    assert:
      - outcome: rejected
        type: {module_path: builtins, class_name: ValueError}

  uncatalogued_tiferet_error_is_recorded_as_failed:
    conditions:
      mocks:
        unused: {module_path: tiferet.contexts.cache, class_name: CacheContext}
    execute:
      - target: {module_path: tiferet.contexts.cache, class_name: CacheContext}
        method: __call__
        as: cache
      - target: {module_path: tiferet.contexts.tester, class_name: ModuleRunContext}
        method: __call__
        args: [$mock.unused]
        kwargs: {cache: $r.cache, raise_error_handler: $mock.unused}
        as: module_run
      - target: {module_path: tiferet.assets, class_name: TiferetError}
        method: __call__
        kwargs: {error_code: APP_SPECIFIC_ERR, message: boom}
        as: error
      - target: $r.module_run
        method: note
        args: [node.app]
        kwargs: {error: $r.error}
        as: printable
      - target: $mock.unused
        method: assert_not_called
        as: unused_quiet
    assert:
      - outcome: printable
        type: {module_path: tiferet.assets, class_name: TiferetAPIError}
      - outcome: printable
        message: APP_SPECIFIC_ERR
      - outcome: module_run
        attribute: outcomes
        equals:
          - {node_id: node.app, status: FAILED, message: 'APP_SPECIFIC_ERR: boom'}
      - outcome: unused_quiet
        "null": true

  uncatalogued_tiferet_error_without_message:
    conditions:
      mocks:
        unused: {module_path: tiferet.contexts.cache, class_name: CacheContext}
    execute:
      - target: {module_path: tiferet.contexts.cache, class_name: CacheContext}
        method: __call__
        as: cache
      - target: {module_path: tiferet.contexts.tester, class_name: ModuleRunContext}
        method: __call__
        args: [$mock.unused]
        kwargs: {cache: $r.cache, raise_error_handler: $mock.unused}
        as: module_run
      - target: {module_path: tiferet.assets, class_name: TiferetError}
        method: __call__
        kwargs: {error_code: APP_SPECIFIC_ERR}
        as: error
      - target: $r.module_run
        method: note
        args: [node.app]
        kwargs: {error: $r.error}
        as: printable
      - target: $mock.unused
        method: assert_not_called
        as: unused_quiet
    assert:
      - outcome: module_run
        attribute: outcomes
        equals:
          - {node_id: node.app, status: FAILED, message: APP_SPECIFIC_ERR}
      - outcome: unused_quiet
        "null": true

  uncatalogued_tiferet_error_without_cache:
    conditions:
      mocks:
        unused: {module_path: tiferet.contexts.cache, class_name: CacheContext}
    execute:
      - target: {module_path: tiferet.contexts.tester, class_name: ModuleRunContext}
        method: __call__
        args: [$mock.unused]
        kwargs: {cache: null, raise_error_handler: $mock.unused}
        as: module_run
      - target: {module_path: tiferet.assets, class_name: TiferetError}
        method: __call__
        kwargs: {error_code: ERROR_NOT_FOUND, message: gone}
        as: error
      - target: $r.module_run
        method: note
        args: [node.app]
        kwargs: {error: $r.error}
        as: printable
      - target: $mock.unused
        method: assert_not_called
        as: unused_quiet
    assert:
      - outcome: module_run
        attribute: outcomes
        equals:
          - {node_id: node.app, status: FAILED, message: 'ERROR_NOT_FOUND: gone'}
      - outcome: unused_quiet
        "null": true

  session_context_verify_normalizes_predicates_and_literals:
    conditions: {}
    execute:
      - &paired_tester {target: {module_path: importlib, attribute: import_module}, method: import_module, args: [tests.contexts.test_tester], as: paired}
      - &get_builder {target: {module_path: builtins, attribute: getattr}, method: getattr, args: [$r.paired, _build_error_message_tester], as: build_tester}
      - &build_tester {target: $r.build_tester, method: __call__, as: tester}
      - &tester_ctx {target: {module_path: tiferet.contexts.tester, class_name: DomainTesterContext}, method: from_domain, args: [$r.tester], as: test_ctx}
      - &session {target: {module_path: tiferet.blueprints.tester, attribute: build_test_session}, method: build_test_session, args: [$r.test_ctx], as: session}
      - {target: {module_path: builtins, class_name: int}, method: __call__, args: [3], as: three}
      - {target: $r.three, method: __getattribute__, args: [__eq__], as: predicate}
      - {target: $r.session, method: verify, args: [$r.predicate], as: first_returned}
      - {target: $r.session, method: verify, args: [3], kwargs: {message: literal outcome}, as: second_returned}
      - {target: {module_path: operator, attribute: is_}, method: is_, args: [$r.first_returned, $r.session], as: first_is_session}
      - {target: {module_path: operator, attribute: is_}, method: is_, args: [$r.second_returned, $r.session], as: second_is_session}
      - {target: $r.session, method: __getattribute__, args: [verifications], as: verifications}
      - {target: {module_path: builtins, attribute: len}, method: len, args: [$r.verifications], as: count}
      - {target: $r.verifications, method: __getitem__, args: [0], as: first}
      - {target: $r.verifications, method: __getitem__, args: [1], as: second}
      - {target: $r.first, method: __getattribute__, args: [predicate], as: first_predicate}
      - {target: $r.first, method: __getattribute__, args: [source], as: first_source}
      - {target: {module_path: operator, attribute: is_}, method: is_, args: [$r.first_predicate, $r.predicate], as: predicate_kept}
      - {target: {module_path: operator, attribute: is_}, method: is_, args: [$r.first_source, $r.predicate], as: source_kept}
      - {target: $r.second, method: __getattribute__, args: [predicate], as: literal_predicate}
      - {target: $r.literal_predicate, method: __call__, args: [3], as: literal_match}
    assert:
      - {outcome: first_is_session, equals: true}
      - {outcome: second_is_session, equals: true}
      - {outcome: count, equals: 2}
      - {outcome: first, type: {module_path: tiferet.domain, class_name: Verification}}
      - {outcome: second, type: {module_path: tiferet.domain, class_name: Verification}}
      - {outcome: predicate_kept, equals: true}
      - {outcome: source_kept, equals: true}
      - {outcome: second, attribute: source, equals: 3}
      - {outcome: literal_match, equals: true}

  session_context_evaluates_all_verifications_and_clears_queue:
    conditions: {}
    execute:
      - *paired_tester
      - *get_builder
      - *build_tester
      - *tester_ctx
      - *session
      - {target: {module_path: builtins, class_name: int}, method: __call__, args: [1], as: one}
      - {target: {module_path: builtins, class_name: int}, method: __call__, args: [3], as: three}
      - {target: {module_path: builtins, class_name: int}, method: __call__, args: [2], as: two}
      - {target: $r.one, method: __getattribute__, args: [__eq__], as: eq_one}
      - {target: $r.three, method: __getattribute__, args: [__eq__], as: eq_three}
      - {target: $r.two, method: __getattribute__, args: [__eq__], as: eq_two}
      - {target: $r.session, method: verify, args: [$r.eq_one], kwargs: {message: first failure}, as: q1}
      - {target: $r.session, method: verify, args: [$r.eq_three], kwargs: {message: second failure}, as: q2}
      - {target: $r.session, method: verify, args: [$r.eq_two], kwargs: {message: passing check}, as: q3}
      - {target: $r.session, method: capture_outcome, args: [2], as: captured}
      - {target: $r.session, method: evaluate_verifications, raises: true, as: failure}
      - {target: {module_path: builtins, attribute: str}, method: str, args: [$r.failure], as: failure_text}
      - {target: {module_path: operator, attribute: contains}, method: contains, args: [$r.failure_text, first failure], as: has_first}
      - {target: {module_path: operator, attribute: contains}, method: contains, args: [$r.failure_text, second failure], as: has_second}
      - {target: $r.session, method: __getattribute__, args: [verifications], as: after_failure}
      - {target: {module_path: builtins, attribute: len}, method: len, args: [$r.after_failure], as: count_after_failure}
      - {target: $r.session, method: verify, args: [2], as: q4}
      - {target: $r.session, method: evaluate_verifications, as: passed}

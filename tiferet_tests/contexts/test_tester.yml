testers:
  test_context_tester_context:
    module_path: tiferet.contexts.tester
    class_name: ContextTesterContext
    tests:

      omits_domain_type_and_preserves_registry:
        conditions:
          fixtures: [bare_request_tester]
        execute:
          - target: {module_path: importlib, attribute: import_module}
            method: import_module
            args: [tiferet.contexts.tester]
            as: tester_mod
          - target: {module_path: builtins, attribute: getattr}
            method: getattr
            args: [$r.tester_mod, ContextTesterContext]
            as: context_cls
          - target: {module_path: importlib, attribute: import_module}
            method: import_module
            args: [builtins]
            as: builtins_mod_for_context_dict
          - target: {module_path: builtins, attribute: getattr}
            method: getattr
            args: [$r.builtins_mod_for_context_dict, object]
            as: object_cls_for_context_dict
          - target: $r.object_cls_for_context_dict
            method: __getattribute__
            args: [$r.context_cls, __dict__]
            as: context_dict
          - target: {module_path: operator, attribute: contains}
            method: contains
            args: [$r.context_dict, domain_type]
            as: context_has
          - target: {module_path: importlib, attribute: import_module}
            method: import_module
            args: [tiferet.domain]
            as: domain_mod
          - target: {module_path: builtins, attribute: getattr}
            method: getattr
            args: [$r.domain_mod, TesterObject]
            as: tester_object_cls
          - target: {module_path: builtins, attribute: getattr}
            method: getattr
            args: [$r.domain_mod, Request]
            as: request_cls
          - target: {module_path: builtins, attribute: getattr}
            method: getattr
            args: [$r.domain_mod, AppSession]
            as: app_session_cls
          - target: {module_path: tiferet.contexts.core, class_name: BaseContext}
            method: for_domain
            args: [$r.tester_object_cls]
            as: tester_registered
          - target: {module_path: tiferet.contexts.core, class_name: BaseContext}
            method: for_domain
            args: [$r.request_cls]
            as: request_registered
          - target: {module_path: tiferet.contexts.core, class_name: BaseContext}
            method: for_domain
            args: [$r.app_session_cls]
            as: app_registered
          - target: {module_path: importlib, attribute: import_module}
            method: import_module
            args: [tiferet.contexts.core]
            as: core_mod
          - target: {module_path: builtins, attribute: getattr}
            method: getattr
            args: [$r.core_mod, ContextMeta]
            as: context_meta
          - target: {module_path: builtins, attribute: getattr}
            method: getattr
            args: [$r.core_mod, BaseContext]
            as: base_context
          - target: {module_path: importlib, attribute: import_module}
            method: import_module
            args: [builtins]
            as: builtins_mod
          - target: {module_path: builtins, attribute: getattr}
            method: getattr
            args: [$r.builtins_mod, object]
            as: object_cls
          - target: $r.object_cls
            method: __getattribute__
            args: [$r.context_meta, registry]
            as: registry
          - target: $r.registry
            method: values
            as: registered
          - target: {module_path: operator, attribute: contains}
            method: contains
            args: [$r.registered, $r.base_context]
            as: base_in_registry
          - target: {module_path: tiferet.contexts.core, class_name: BaseContext}
            method: from_domain
            args: [$fixture.bare_request_tester]
            as: from_base
          - target: {module_path: tiferet.contexts.tester, class_name: ContextTesterContext}
            method: from_domain
            args: [$fixture.bare_request_tester]
            as: bound
          - target: $r.bound
            method: __getattribute__
            args:
            - domain
            as: bound_domain
          - target:
              module_path: operator
              attribute: is_
            method: is_
            args:
            - $r.bound_domain
            - $fixture.bare_request_tester
            as: domain_identity
        assert:
          - {outcome: context_has, equals: false}
          - outcome: tester_registered
            is: {module_path: tiferet.contexts.tester, class_name: TesterContext}
          - outcome: request_registered
            is: {module_path: tiferet.contexts.request, class_name: RequestContext}
          - outcome: app_registered
            is: {module_path: tiferet.contexts.app, class_name: AppSessionContext}
          - {outcome: base_in_registry, equals: false}
          - outcome: from_base
            type: {module_path: tiferet.contexts.tester, class_name: TesterContext}
          - outcome: bound
            type: {module_path: tiferet.contexts.tester, class_name: ContextTesterContext}
          - {outcome: domain_identity, equals: true}

      empty_case_lists_are_no_ops:
        conditions:
          fixtures: [bare_request_tester]
        execute:
          - {target: &context_tester {module_path: tiferet.contexts.tester, class_name: ContextTesterContext}, method: from_domain, args: [$fixture.bare_request_tester], as: test_ctx}
          - {target: $r.test_ctx, method: assert_from_domain, as: from_domain}
          - {target: $r.test_ctx, method: assert_domain_type, as: domain_type}
          - {target: $r.test_ctx, method: assert_for_domain, as: for_domain}
        assert:
          - {outcome: from_domain, "null": true}
          - {outcome: domain_type, "null": true}
          - {outcome: for_domain, "null": true}

      declaring_request_context_cases:
        conditions:
          fixtures: [declaring_request_tester]
        execute:
          - {target: *context_tester, method: from_domain, args: [$fixture.declaring_request_tester], as: test_ctx}
          - {target: $r.test_ctx, method: assert_from_domain, as: from_domain}
          - {target: $r.test_ctx, method: assert_domain_type, as: domain_type}
          - {target: $r.test_ctx, method: assert_for_domain, as: for_domain}
        assert:
          - {outcome: from_domain, "null": true}
          - {outcome: domain_type, "null": true}
          - {outcome: for_domain, "null": true}

      omitting_cli_session_does_not_clobber_app_session:
        conditions:
          fixtures: [cli_session_tester]
        execute:
          - {target: *context_tester, method: from_domain, args: [$fixture.cli_session_tester], as: test_ctx}
          - {target: $r.test_ctx, method: assert_domain_type, as: domain_type}
          - {target: $r.test_ctx, method: assert_for_domain, as: for_domain}
        assert:
          - {outcome: domain_type, "null": true}
          - {outcome: for_domain, "null": true}

  tester_object_get_target_returns_function_and_instance:
    conditions: {}
    execute:
      - target:
          module_path: *tester_module
          attribute: TesterObject
        method: TesterObject
        kwargs:
          type: generic
          id: generic.join
          module_path: os.path
          class_name: join
        as: function_tester
      - target: $r.function_tester
        method: get_target
        as: joined
      - target: $r.function_tester
        method: get_target_type
        as: join_type
      - target:
          module_path: *tester_module
          attribute: TesterObject
        method: TesterObject
        kwargs:
          type: generic
          id: generic.ErrorMessage
          module_path: *error_module
          class_name: *error_message
          sample_data: *sample_data
        as: class_tester
      - target:
          module_path: operator
          attribute: attrgetter
        method: attrgetter
        args: [sample_data]
        as: read_sample
      - target: $r.read_sample
        method: __call__
        args: [$r.class_tester]
        as: before
      - target: $r.class_tester
        method: get_target
        as: instance
      - target: $r.read_sample
        method: __call__
        args: [$r.class_tester]
        as: after
      - target:
          module_path: operator
          attribute: is_
        method: is_
        args: [$r.before, $r.after]
        as: same
    assert:
      - outcome: joined
        is:
          module_path: os.path
          class_name: join
      - outcome: join_type
        is:
          module_path: os.path
          class_name: join
      - outcome: instance
        type:
          module_path: *error_module
          class_name: *error_message
      - outcome: instance
        fields:
          lang: *lang
      - outcome: same
        equals: true
      - outcome: before
        absent: [extra]

testers:
  tester_object_context_type:
    module_path: *tester_module
    class_name: TesterObject
    tests:
      accepts_context_type_and_optional_defaults:
        conditions: {}
        execute:
          - target:
              module_path: *tester_module
              attribute: TesterObject
            method: TesterObject
            kwargs:
              type: context
              id: context.RequestContext
              module_path: tiferet.contexts.request
              class_name: RequestContext
            as: tester
          - target:
              module_path: builtins
              attribute: hasattr
            method: hasattr
            args: [$r.tester, get_target_type]
            as: has_target_type
          - target:
              module_path: builtins
              attribute: hasattr
            method: hasattr
            args: [$r.tester, get_domain_type]
            as: has_domain_type
        assert:
          - outcome: tester
            fields:
              type: context
              domain_module_path: null
              domain_class_name: null
              from_domain_cases: []
              domain_type_cases: []
              for_domain_cases: []
          - outcome: has_target_type
            equals: true
          - outcome: has_domain_type
            equals: true
      context_tester_object_does_not_exist:
        conditions: {}
        execute:
          - target:
              module_path: importlib
              attribute: import_module
            method: import_module
            args: [tiferet.domain]
            as: domain_package
          - target:
              module_path: builtins
              attribute: hasattr
            method: hasattr
            args: [$r.domain_package, ContextTesterObject]
            as: has_class
          - target:
              module_path: builtins
              attribute: getattr
            method: getattr
            args: [$r.domain_package, __all__]
            as: exported
          - target:
              module_path: operator
              attribute: contains
            method: contains
            args: [$r.exported, ContextTesterObject]
            as: listed
        assert:
          - outcome: has_class
            equals: false
          - outcome: listed
            equals: false

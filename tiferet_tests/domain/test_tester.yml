tests:
  tester_object_derives_expected_data_and_target_type:
    conditions: {}
    execute:
      - target:
          module_path: &tester_module tiferet.domain.tester
          attribute: TesterObject
        method: TesterObject
        kwargs:
          type: domain
          id: domain.ErrorMessage
          module_path: &error_module tiferet.domain.error
          class_name: &error_message ErrorMessage
          sample_data: &sample_data
            lang: &lang en_US
            text: An error occurred.
        as: tester
      - target:
          module_path: operator
          attribute: attrgetter
        method: attrgetter
        args: [expected_data]
        as: read_expected
      - target: $r.read_expected
        method: __call__
        args: [$r.tester]
        as: expected_data
      - target:
          module_path: operator
          attribute: attrgetter
        method: attrgetter
        args: [sample_data]
        as: read_sample
      - target: $r.read_sample
        method: __call__
        args: [$r.tester]
        as: sample_data
      - target: $r.tester
        method: get_target_type
        as: target_type
    assert:
      - outcome: expected_data
        equals: $r.sample_data
      - outcome: target_type
        is:
          module_path: *error_module
          class_name: *error_message
  tester_object_optional_fields_and_aggregate_target:
    conditions: {}
    execute:
      - target:
          module_path: *tester_module
          attribute: TesterObject
        method: TesterObject
        kwargs:
          type: domain
          id: domain.ErrorMessage
          module_path: *error_module
          class_name: *error_message
        as: domain_tester
      - target:
          module_path: *tester_module
          attribute: TesterObject
        method: TesterObject
        kwargs:
          type: aggregate
          id: aggregate.ErrorAggregate
          module_path: &mapper_module tiferet.mappers.error
          class_name: &aggregate_class ErrorAggregate
        as: aggregate_tester
      - target:
          module_path: *tester_module
          attribute: TesterObject
        method: TesterObject
        kwargs:
          type: transfer_object
          id: transfer_object.ErrorConfigObject
          module_path: *mapper_module
          class_name: ErrorConfigObject
          aggregate_module_path: *mapper_module
          aggregate_class_name: *aggregate_class
        as: transfer_tester
      - target: $r.aggregate_tester
        method: get_target_type
        as: aggregate_type
      - target: $r.transfer_tester
        method: get_target_type
        as: transfer_type
      - target: $r.transfer_tester
        method: get_aggregate_type
        as: transfer_aggregate
    assert:
      - outcome: domain_tester
        fields:
          description_cases: []
      - outcome: aggregate_tester
        fields:
          set_attribute_params: []
      - outcome: aggregate_type
        is:
          module_path: *mapper_module
          class_name: *aggregate_class
      - outcome: transfer_type
        is:
          module_path: *mapper_module
          class_name: ErrorConfigObject
      - outcome: transfer_aggregate
        is:
          module_path: *mapper_module
          class_name: *aggregate_class
  tester_object_accepts_event_types_and_optional_fields:
    conditions: {}
    execute:
      - target:
          module_path: *tester_module
          attribute: TesterObject
        method: TesterObject
        kwargs:
          type: domain_event
          id: domain_event.ListErrors
          module_path: tiferet.events.error
          class_name: ListErrors
        as: domain_event
      - target:
          module_path: *tester_module
          attribute: TesterObject
        method: TesterObject
        kwargs:
          type: service_event
          id: service_event.GetError
          module_path: tiferet.events.error
          class_name: GetError
          dependencies:
            error_service:
              module_path: tiferet.interfaces
              class_name: ErrorService
          sample_kwargs:
            id: TEST_ERROR
          required_params: []
          service_attr: error_service
          not_found_error_code: ERROR_NOT_FOUND
        as: service_event
      - target:
          module_path: operator
          attribute: attrgetter
        method: attrgetter
        args: [dependencies]
        as: read_dependencies
      - target: $r.read_dependencies
        method: __call__
        args: [$r.service_event]
        as: dependencies
      - target: $r.dependencies
        method: __getitem__
        args: [error_service]
        as: error_service
      - target: $r.service_event
        method: get_target_type
        as: target_type
      - target:
          module_path: operator
          attribute: attrgetter
        method: attrgetter
        args: [__name__]
        as: read_name
      - target: $r.read_name
        method: __call__
        args: [$r.target_type]
        as: target_name
    assert:
      - outcome: domain_event
        fields:
          sample_kwargs: {}
          required_params: []
          service_attr: null
          not_found_error_code: null
          not_found_kwargs: {}
      - outcome: error_service
        type:
          module_path: tiferet.domain.core
          class_name: ServiceDependency
      - outcome: error_service
        fields:
          class_name: ErrorService
      - outcome: target_name
        equals: GetError
  verification_constructs_with_optional_message_default:
    conditions: {}
    execute:
      - target:
          module_path: *tester_module
          class_name: Verification
        method: model_construct
        kwargs:
          source: 3
        as: verification
    assert:
      - outcome: verification
        fields:
          source: 3
          message: null
  tester_object_accepts_generic_type:
    conditions: {}
    execute:
      - target:
          module_path: *tester_module
          attribute: TesterObject
        method: TesterObject
        kwargs:
          id: generic.ErrorMessage
          module_path: *error_module
          class_name: *error_message
        as: tester
      - target:
          module_path: builtins
          attribute: hasattr
        method: hasattr
        args: [$r.tester, get_target_type]
        as: has_target_type
      - target:
          module_path: builtins
          attribute: hasattr
        method: hasattr
        args: [$r.tester, get_target]
        as: has_target
    assert:
      - outcome: tester
        fields:
          type: generic
      - outcome: has_target_type
        equals: true
      - outcome: has_target
        equals: true
  tester_object_accepts_repo_type_and_optional_fields:
    conditions: {}
    execute:
      - target:
          module_path: *tester_module
          attribute: TesterObject
        method: TesterObject
        kwargs:
          type: repo
          id: repo.ErrorConfigRepository
          module_path: tiferet.repos.error
          class_name: ErrorConfigRepository
          config_parameter: error_config
          aggregate_module_path: *mapper_module
          aggregate_class_name: *aggregate_class
        as: tester
      - target: $r.tester
        method: get_target_type
        as: target_type
      - target: $r.tester
        method: get_aggregate_type
        as: aggregate_type
      - target:
          module_path: operator
          attribute: attrgetter
        method: attrgetter
        args: [__name__]
        as: read_name
      - target: $r.read_name
        method: __call__
        args: [$r.target_type]
        as: target_name
      - target: $r.read_name
        method: __call__
        args: [$r.aggregate_type]
        as: aggregate_name
    assert:
      - outcome: tester
        fields:
          type: repo
          config_parameter: error_config
          exists_cases: []
          get_cases: []
          list_ids: []
          delete_ids: []
      - outcome: target_name
        equals: ErrorConfigRepository
      - outcome: aggregate_name
        equals: ErrorAggregate
  util:
    conditions: {}
    execute:
      - target:
          module_path: *tester_module
          attribute: TesterObject
        method: TesterObject
        kwargs:
          type: util
          id: invalid.Tester
          module_path: *error_module
          class_name: *error_message
        as: error
        raises: true
    assert:
      - outcome: error
        type:
          module_path: pydantic

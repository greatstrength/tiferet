fixtures:
  event_feature_step: &event_feature_step
    module_path: &feature_module tiferet.domain.feature
    class_name: EventFeatureStep
    attributes: &event_step_attrs
      name: &step_name Test Event
      service_id: &step_service test_event_service
  flagged_step:
    <<: *event_feature_step
    attributes:
      name: Flagged Event
      service_id: flagged_event_service
      flags: &step_flags [flag1, flag2]
  middleware_step:
    <<: *event_feature_step
    attributes:
      name: Middleware Event
      service_id: middleware_event_service
      middleware: &step_middleware [timing_middleware, audit_middleware]
  step_zero:
    module_path: *feature_module
    class_name: EventFeatureStep
    attributes:
      name: Step Zero
      service_id: step_zero_service
  step_one:
    module_path: *feature_module
    class_name: EventFeatureStep
    attributes:
      name: Step One
      service_id: step_one_service
  feature: &feature
    module_path: *feature_module
    class_name: Feature
    attributes: &feature_attrs
      id: &feature_id calc.add
      name: &feature_name Add
  derived_feature:
    module_path: *feature_module
    class_name: Feature
    attributes:
      group_id: calc
      name: Add Number
  described_feature:
    module_path: *feature_module
    class_name: Feature
    attributes:
      id: *feature_id
      name: *feature_name
      description: Custom description
  middleware_feature:
    module_path: *feature_module
    class_name: Feature
    attributes:
      id: *feature_id
      name: *feature_name
      middleware: [timing_middleware]
  async_feature:
    module_path: *feature_module
    class_name: Feature
    attributes:
      id: *feature_id
      name: *feature_name
      is_async: true
  feature_with_steps:
    module_path: *feature_module
    class_name: Feature
    attributes:
      id: test_group.test_feature
      name: Test Feature
      group_id: test_group
      feature_key: test_feature
      description: Test Feature
      steps:
        - $fixture.step_zero
        - $fixture.step_one
  schema_feature:
    module_path: *feature_module
    class_name: Feature
    attributes:
      id: *feature_id
      name: *feature_name
      params_schema:
        a: int
        b: int
  parameter_specification: &parameter_specification
    module_path: *feature_module
    class_name: ParameterSpecification
    attributes: &parameter_attrs
      name: a
      type: int
  str_parameter:
    <<: *parameter_specification
    attributes:
      name: a
      type: str
  int_parameter:
    <<: *parameter_specification
    attributes:
      name: a
      type: int
  float_parameter:
    <<: *parameter_specification
    attributes:
      name: a
      type: float
  bool_parameter:
    <<: *parameter_specification
    attributes:
      name: a
      type: bool
  list_parameter:
    <<: *parameter_specification
    attributes:
      name: a
      type: list
  dict_parameter:
    <<: *parameter_specification
    attributes:
      name: a
      type: dict
  optional_parameter:
    module_path: *feature_module
    class_name: ParameterSpecification
    attributes:
      name: b
      type: float
      required: false
      default: 1.0
  request_specification: &request_specification
    module_path: *feature_module
    class_name: RequestSpecification
    attributes: &request_spec_attrs
      parameters:
        - name: a
          type: int
          required: true

testers:
  test_event_feature_step:
    module_path: *feature_module
    class_name: EventFeatureStep
    attributes: *event_step_attrs
    tests:
      new:
        conditions: {}
        execute:
          - target: self
            method: new
            as: built
        assert:
          - outcome: built
            fields:
              name: *step_name
              service_id: *step_service
              type: event
              condition: null
              middleware: []
              flags: []
      flags_creation_and_round_trip:
        conditions:
          fixtures: [flagged_step]
        execute:
          - target: flagged_step
            method: model_dump
            as: dumped
          - target:
              module_path: *feature_module
              class_name: EventFeatureStep
            method: model_validate
            args: [$r.dumped]
            as: reloaded
        assert:
          - outcome: flagged_step
            fields:
              flags: *step_flags
          - outcome: reloaded
            fields:
              flags: *step_flags
      type_round_trip:
        conditions: {}
        execute:
          - target: self
            method: new
            as: built
          - target: $r.built
            method: model_dump
            as: dumped
          - target:
              module_path: *feature_module
              class_name: EventFeatureStep
            method: model_validate
            args: [$r.dumped]
            as: reloaded
        assert:
          - outcome: reloaded
            fields:
              type: event
      condition_preserves_value:
        conditions: {}
        execute:
          - target:
              module_path: operator
              attribute: add
            method: add
            args: ['$', 'r.x > 0']
            as: condition_text
          - target:
              module_path: builtins
              class_name: dict
            method: __call__
            kwargs:
              name: Conditional Event
              service_id: conditional_event_service
            as: payload
          - target:
              module_path: operator
              attribute: setitem
            method: setitem
            args: [$r.payload, condition, $r.condition_text]
          - target:
              module_path: *feature_module
              class_name: EventFeatureStep
            method: model_validate
            args: [$r.payload]
            as: built
          - target: $r.built
            method: model_dump
            as: dumped
        assert:
          - outcome: built
            fields:
              condition: $r.condition_text
          - outcome: dumped
            fields:
              condition: $r.condition_text
          - outcome: dumped
            message: '$r.x > 0'
      middleware_preserves_value:
        conditions:
          fixtures: [middleware_step]
        execute:
          - target: middleware_step
            method: model_dump
            as: dumped
          - target:
              module_path: *feature_module
              class_name: EventFeatureStep
            method: model_validate
            args: [$r.dumped]
            as: reloaded
        assert:
          - outcome: middleware_step
            fields:
              middleware: *step_middleware
          - outcome: reloaded
            fields:
              middleware: *step_middleware

  test_feature:
    module_path: *feature_module
    class_name: Feature
    attributes: *feature_attrs
    tests:
      new:
        conditions: {}
        execute:
          - target: self
            method: new
            as: built
        assert:
          - outcome: built
            fields:
              id: *feature_id
              name: *feature_name
              group_id: calc
              feature_key: add
              description: *feature_name
              middleware: []
              is_async: false
              params_schema: null
      derive_keys_from_group_and_name:
        conditions:
          fixtures: [derived_feature]
        execute:
          - target:
              module_path: operator
              attribute: attrgetter
            method: attrgetter
            args: [feature_key]
            as: read_key
          - target: $r.read_key
            method: __call__
            args: [$fixture.derived_feature]
            as: feature_key
          - target:
              module_path: operator
              attribute: attrgetter
            method: attrgetter
            args: [id]
            as: read_id
          - target: $r.read_id
            method: __call__
            args: [$fixture.derived_feature]
            as: feature_id
          - target:
              module_path: operator
              attribute: attrgetter
            method: attrgetter
            args: [description]
            as: read_description
          - target: $r.read_description
            method: __call__
            args: [$fixture.derived_feature]
            as: description
        assert:
          - outcome: feature_key
            equals: add_number
          - outcome: feature_id
            equals: calc.add_number
          - outcome: description
            equals: Add Number
      explicit_description_preserved:
        conditions:
          fixtures: [described_feature]
        execute:
          - target:
              module_path: operator
              attribute: attrgetter
            method: attrgetter
            args: [description]
            as: read_description
          - target: $r.read_description
            method: __call__
            args: [$fixture.described_feature]
            as: description
        assert:
          - outcome: description
            equals: Custom description
      middleware_preserves_value:
        conditions:
          fixtures: [middleware_feature]
        execute:
          - target: middleware_feature
            method: model_dump
            as: dumped
          - target:
              module_path: *feature_module
              class_name: Feature
            method: model_validate
            args: [$r.dumped]
            as: reloaded
        assert:
          - outcome: middleware_feature
            fields:
              middleware: [timing_middleware]
          - outcome: reloaded
            fields:
              middleware: [timing_middleware]
      is_async_preserves_value:
        conditions:
          fixtures: [async_feature]
        execute:
          - target: async_feature
            method: model_dump
            as: dumped
          - target:
              module_path: *feature_module
              class_name: Feature
            method: model_validate
            args: [$r.dumped]
            as: reloaded
        assert:
          - outcome: async_feature
            fields:
              is_async: true
          - outcome: reloaded
            fields:
              is_async: true
      get_step_valid_and_invalid_indices:
        conditions:
          fixtures: [step_zero, step_one, feature_with_steps]
        execute:
          - target: feature_with_steps
            method: get_step
            args: [0]
            as: step0
          - target: feature_with_steps
            method: get_step
            args: [1]
            as: step1
          - target: feature_with_steps
            method: get_step
            args: [2]
            as: missing_index
          - target: feature_with_steps
            method: get_step
            args: [invalid]
            as: missing_name
        assert:
          - outcome: step0
            fields:
              name: Step Zero
          - outcome: step1
            fields:
              name: Step One
          - outcome: missing_index
            'null': true
          - outcome: missing_name
            'null': true
      params_schema_construction:
        conditions:
          fixtures: [schema_feature]
        execute:
          - target:
              module_path: operator
              attribute: attrgetter
            method: attrgetter
            args: [params_schema]
            as: read_schema
          - target: $r.read_schema
            method: __call__
            args: [$fixture.schema_feature]
            as: schema
        assert:
          - outcome: schema
            type:
              module_path: *feature_module
              class_name: RequestSpecification
          - outcome: schema
            fields:
              parameters:
                - name: a
                - name: b
      params_schema_bad_value_raises:
        conditions: {}
        execute:
          - target:
              module_path: *feature_module
              class_name: Feature
            method: model_validate
            args:
              - id: calc.add
                name: Add
                params_schema:
                  a: 5
            as: error
            raises: true
        assert:
          - outcome: error
            type:
              module_path: tiferet.domain.core
              class_name: ModelError
          - outcome: error
            error_code: INVALID_MODEL_VALUE

  test_parameter_specification:
    module_path: *feature_module
    class_name: ParameterSpecification
    attributes: *parameter_attrs
    tests:
      new:
        conditions: {}
        execute:
          - target: self
            method: new
            as: built
        assert:
          - outcome: built
            fields:
              name: a
              type: int
      description:
        conditions: {}
        execute:
          - target: self
            method: new
            as: built
          - target: $r.built
            method: get_type
            as: parameter_type
        assert:
          - outcome: parameter_type
            is:
              builtin: int
      get_type_mapping:
        conditions:
          fixtures: [str_parameter, int_parameter, float_parameter, bool_parameter, list_parameter, dict_parameter]
        execute:
          - target: str_parameter
            method: get_type
            as: str_type
          - target: int_parameter
            method: get_type
            as: int_type
          - target: float_parameter
            method: get_type
            as: float_type
          - target: bool_parameter
            method: get_type
            as: bool_type
          - target: list_parameter
            method: get_type
            as: list_type
          - target: dict_parameter
            method: get_type
            as: dict_type
        assert:
          - outcome: str_type
            is:
              builtin: str
          - outcome: int_type
            is:
              builtin: int
          - outcome: float_type
            is:
              builtin: float
          - outcome: bool_type
            is:
              builtin: bool
          - outcome: list_type
            is:
              builtin: list
          - outcome: dict_type
            is:
              builtin: dict
      field_definition_required:
        conditions: {}
        execute:
          - target: self
            method: new
            as: built
          - target: $r.built
            method: field_definition
            as: definition
          - target:
              module_path: operator
              attribute: itemgetter
            method: itemgetter
            args: [0]
            as: get_annotation
          - target: $r.get_annotation
            method: __call__
            args: [$r.definition]
            as: annotation
          - target:
              module_path: operator
              attribute: itemgetter
            method: itemgetter
            args: [1]
            as: get_field
          - target: $r.get_field
            method: __call__
            args: [$r.definition]
            as: field
          - target: $r.field
            method: is_required
            as: required
        assert:
          - outcome: annotation
            is:
              builtin: int
          - outcome: required
            equals: true
      field_definition_optional_with_default:
        conditions:
          fixtures: [optional_parameter]
        execute:
          - target: optional_parameter
            method: field_definition
            as: definition
          - target:
              module_path: operator
              attribute: itemgetter
            method: itemgetter
            args: [1]
            as: get_field
          - target: $r.get_field
            method: __call__
            args: [$r.definition]
            as: field
          - target: $r.field
            method: is_required
            as: required
        assert:
          - outcome: required
            equals: false
          - outcome: field
            fields:
              default: 1.0
      from_config_entry_shorthand:
        conditions: {}
        execute:
          - target:
              module_path: *feature_module
              class_name: ParameterSpecification
            method: from_config_entry
            args: [a, int]
            as: param
          - target: $r.param
            method: to_config_value
            as: value
        assert:
          - outcome: param
            type:
              module_path: *feature_module
              class_name: ParameterSpecification
          - outcome: param
            fields:
              name: a
              type: int
              required: true
              default: null
          - outcome: value
            type:
              module_path: builtins
              class_name: str
          - outcome: value
            equals: int
      from_config_entry_expanded:
        conditions: {}
        execute:
          - target:
              module_path: *feature_module
              class_name: ParameterSpecification
            method: from_config_entry
            args:
              - b
              - type: float
                required: false
                default: 1.0
            as: param
          - target: $r.param
            method: to_config_value
            as: value
          - target:
              module_path: builtins
              attribute: list
            method: list
            args: [$r.value]
            as: value_keys
        assert:
          - outcome: param
            fields:
              name: b
              type: float
              required: false
              default: 1.0
          - outcome: value
            type:
              module_path: builtins
              class_name: dict
          - outcome: value
            fields:
              type: float
              default: 1.0
              required: false
          - outcome: value_keys
            equals: [type, default, required]
      to_config_value_key_order:
        conditions: {}
        execute:
          - target:
              module_path: *feature_module
              class_name: ParameterSpecification
            method: from_config_entry
            args:
              - c
              - choices: [x, y]
                pattern: '^[xy]$'
                max_length: 1
                min_length: 1
                maximum: 9
                minimum: 1
                description: Pick one.
                required: false
                default: x
                type: str
            as: param
          - target: $r.param
            method: to_config_value
            as: value
          - target:
              module_path: builtins
              attribute: list
            method: list
            args: [$r.value]
            as: value_keys
        assert:
          - outcome: value
            type:
              module_path: builtins
              class_name: dict
          - outcome: value_keys
            equals: [type, default, required, description, minimum, maximum, min_length, max_length, pattern, choices]
          - outcome: value
            fields:
              type: str
              default: x
              required: false
              description: Pick one.
              minimum: 1.0
              maximum: 9.0
              min_length: 1
              max_length: 1
              pattern: '^[xy]$'
              choices: [x, y]
      to_config_value_falsy_defaults:
        conditions: {}
        execute:
          - target:
              module_path: *feature_module
              class_name: ParameterSpecification
            method: from_config_entry
            args:
              - n
              - type: int
                default: 0
            as: zero_param
          - target: $r.zero_param
            method: to_config_value
            as: zero_value
          - target:
              module_path: builtins
              attribute: list
            method: list
            args: [$r.zero_value]
            as: zero_keys
          - target:
              module_path: *feature_module
              class_name: ParameterSpecification
            method: from_config_entry
            args:
              - f
              - type: bool
                default: false
            as: false_param
          - target: $r.false_param
            method: to_config_value
            as: false_value
          - target:
              module_path: builtins
              attribute: list
            method: list
            args: [$r.false_value]
            as: false_keys
        assert:
          - outcome: zero_value
            type:
              module_path: builtins
              class_name: dict
          - outcome: zero_keys
            equals: [type, default]
          - outcome: zero_value
            fields:
              type: int
              default: 0
          - outcome: false_value
            type:
              module_path: builtins
              class_name: dict
          - outcome: false_keys
            equals: [type, default]
          - outcome: false_value
            fields:
              type: bool
              default: false
      to_config_value_shorthand_rule:
        conditions: {}
        execute:
          - target:
              module_path: *feature_module
              class_name: ParameterSpecification
            method: from_config_entry
            args:
              - a
              - type: int
                required: true
                default: null
            as: plain_param
          - target: $r.plain_param
            method: to_config_value
            as: plain_value
          - target:
              module_path: *feature_module
              class_name: ParameterSpecification
            method: from_config_entry
            args:
              - d
              - description: Described.
            as: described_param
          - target: $r.described_param
            method: to_config_value
            as: described_value
          - target:
              module_path: builtins
              attribute: list
            method: list
            args: [$r.described_value]
            as: described_keys
        assert:
          - outcome: plain_value
            type:
              module_path: builtins
              class_name: str
          - outcome: plain_value
            equals: int
          - outcome: described_value
            type:
              module_path: builtins
              class_name: dict
          - outcome: described_keys
            equals: [type, description]
          - outcome: described_value
            fields:
              type: str
              description: Described.
      from_config_entry_drops_equal_name:
        conditions: {}
        execute:
          - target:
              module_path: *feature_module
              class_name: ParameterSpecification
            method: from_config_entry
            args:
              - a
              - name: a
                type: int
            as: param
          - target: $r.param
            method: to_config_value
            as: value
        assert:
          - outcome: param
            fields:
              name: a
              type: int
              required: true
          - outcome: value
            equals: int
      from_config_entry_name_mismatch_raises:
        conditions: {}
        execute:
          - target:
              module_path: *feature_module
              class_name: ParameterSpecification
            method: from_config_entry
            args: 
              - a
              - name: b
                type: int
            as: error
            raises: true
        assert:
          - outcome: error
            type:
              module_path: tiferet.domain.core
              class_name: ModelError
          - outcome: error
            error_code: INVALID_MODEL_VALUE
      from_config_entry_bad_value_raises:
        conditions: {}
        execute:
          - target:
              module_path: *feature_module
              class_name: ParameterSpecification
            method: from_config_entry
            args: [a, 5]
            as: number_error
            raises: true
          - target:
              module_path: *feature_module
              class_name: ParameterSpecification
            method: from_config_entry
            args: [a, [int]]
            as: list_error
            raises: true
          - target:
              module_path: *feature_module
              class_name: ParameterSpecification
            method: from_config_entry
            args: [a, null]
            as: none_error
            raises: true
        assert:
          - outcome: number_error
            type:
              module_path: tiferet.domain.core
              class_name: ModelError
          - outcome: number_error
            error_code: INVALID_MODEL_VALUE
          - outcome: list_error
            type:
              module_path: tiferet.domain.core
              class_name: ModelError
          - outcome: list_error
            error_code: INVALID_MODEL_VALUE
          - outcome: none_error
            type:
              module_path: tiferet.domain.core
              class_name: ModelError
          - outcome: none_error
            error_code: INVALID_MODEL_VALUE
      from_config_entry_unknown_type_raises:
        conditions: {}
        execute:
          - target:
              module_path: *feature_module
              class_name: ParameterSpecification
            method: from_config_entry
            args: [a, decimal]
            as: shorthand_error
            raises: true
          - target:
              module_path: *feature_module
              class_name: ParameterSpecification
            method: from_config_entry
            args:
              - a
              - type: decimal
            as: expanded_error
            raises: true
        assert:
          - outcome: shorthand_error
            type:
              module_path: pydantic
              class_name: ValidationError
          - outcome: expanded_error
            type:
              module_path: pydantic
              class_name: ValidationError
      from_config_map_order:
        conditions: {}
        execute:
          - target:
              module_path: *feature_module
              class_name: ParameterSpecification
            method: from_config_map
            args:
              - z: int
                a:
                  type: str
                  required: false
                parameters: bool
            as: params
          - target:
              module_path: operator
              attribute: itemgetter
            method: itemgetter
            args: [0]
            as: get0
          - target: $r.get0
            method: __call__
            args: [$r.params]
            as: first
        assert:
          - outcome: first
            type:
              module_path: *feature_module
              class_name: ParameterSpecification
          - outcome: params
            equals:
              - name: z
                type: int
                required: true
              - name: a
                type: str
                required: false
              - name: parameters
                type: bool
                required: true
      from_config_map_non_mapping_raises:
        conditions: {}
        execute:
          - target:
              module_path: *feature_module
              class_name: ParameterSpecification
            method: from_config_map
            args: 
              - - name: a
                  type: int
            as: list_error
            raises: true
          - target:
              module_path: *feature_module
              class_name: ParameterSpecification
            method: from_config_map
            args: [int]
            as: str_error
            raises: true
        assert:
          - outcome: list_error
            type:
              module_path: tiferet.domain.core
              class_name: ModelError
          - outcome: list_error
            error_code: INVALID_MODEL_VALUE
          - outcome: str_error
            type:
              module_path: tiferet.domain.core
              class_name: ModelError
          - outcome: str_error
            error_code: INVALID_MODEL_VALUE
      to_config_map_order:
        conditions: {}
        execute:
          - target:
              module_path: *feature_module
              class_name: ParameterSpecification
            method: to_config_map
            args:
              - - name: z
                  type: int
                - name: b
                  type: float
                  required: false
                  default: 1.0
            as: config
          - target:
              module_path: builtins
              attribute: list
            method: list
            args: [$r.config]
            as: config_keys
          - target:
              module_path: operator
              attribute: itemgetter
            method: itemgetter

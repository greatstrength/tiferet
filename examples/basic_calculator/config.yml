sessions:
  calc_client:
    name: Calculator Client
    description: >-
      A plain, non-fluent client for the calculator's arithmetic bounded
      context. module_path/class_name below are informational only --
      CalculatorAppContext is wired explicitly by
      app.blueprints.calc.create_calculator_app, not resolved from this
      config.
    module_path: app.contexts.calc
    class_name: CalculatorAppContext
    services:
      record_run_event:
        module_path: app.events.history
        class_name: RecordCalculation
  calc_cli:
    name: Calculator CLI
    description: Perform basic calculator operations via CLI
    module_path: tiferet.contexts.cli
    class_name: CliContext
  calc_fluent:
    name: Fluent Calculator
    description: >-
      A chainable, PEMDAS-aware calculator context. module_path/class_name
      below are informational only -- CalculatorFluentContext is wired
      explicitly by app.blueprints.fluent.create_calculator_fluent, not
      resolved from this config.
    module_path: app.contexts.fluent
    class_name: CalculatorFluentContext
    services:
      record_run_event:
        module_path: app.events.history
        class_name: RecordCalculation

services:
  list_recent_formulas_event:
    module_path: app.events.history
    class_name: ListRecentFormulas
  formula_service:
    module_path: app.repos.formula
    class_name: FormulaConfigRepository
    params:
      formula_config: formulas.yml
  save_formula_event:
    module_path: app.events.formula
    class_name: SaveFormula
  get_formula_event:
    module_path: app.events.formula
    class_name: GetFormula
  list_formulas_event:
    module_path: app.events.formula
    class_name: ListFormulas
  evaluate_formula_event:
    module_path: app.events.formula
    class_name: EvaluateFormula

features:
  calc:
    safe_divide:
      name: Safe Divide
      description: Divides only when denominator is non-zero
      steps:
        - service_id: divide_number_event
          name: Divide `a` by `b` (skipped when b is 0)
          condition: '$r.b != 0'
    history:
      name: Recent Calculations
      description: Lists the most recently executed calculations
      steps:
        - service_id: list_recent_formulas_event
          name: List recent calculations
  formula:
    save:
      name: Save Formula
      description: Saves a named, variablized formula
      params_schema:
        name: str
        expression: str
        description:
          type: str
          required: false
      steps:
        - service_id: save_formula_event
          name: Save the formula
    get:
      name: Get Formula
      description: Retrieves a saved formula by id
      params_schema:
        id: str
      steps:
        - service_id: get_formula_event
          name: Get the formula
    list:
      name: List Formulas
      description: Lists all saved formulas
      steps:
        - service_id: list_formulas_event
          name: List the formulas
    eval:
      name: Evaluate Formula
      description: Evaluates a saved formula with variable values
      params_schema:
        id: str
      steps:
        - service_id: evaluate_formula_event
          name: Evaluate the formula

errors:
  FORMULA_NOT_FOUND:
    name: Formula Not Found
    message:
      - lang: en_US
        text: 'Formula not found: {id}'
  MISSING_VARIABLE:
    name: Missing Variable
    message:
      - lang: en_US
        text: 'Missing value for variable: {variable}'
  FORMULA_EVALUATION_FAILED:
    name: Formula Evaluation Failed
    message:
      - lang: en_US
        text: 'Could not evaluate formula {id}: {error}'
  NO_ACTIVE_EXPRESSION:
    name: No Active Expression
    message:
      - lang: en_US
        text: 'No calculator expression is active; call add/subtract/multiply/divide to start a new chain.'
  EXPRESSION_ALREADY_ACTIVE:
    name: Expression Already Active
    message:
      - lang: en_US
        text: 'A calculator expression is already active; call .run() or .reset() before starting a new one.'

cli:
  cmds:
    calc:
      add:
        group_key: calc
        key: add
        name: Add Number Command
        description: Adds two numbers.
        args:
          - name_or_flags:
              - a
            description: The first number to add.
          - name_or_flags:
              - b
            description: The second number to add.
      subtract:
        group_key: calc
        key: subtract
        name: Subtract Number Command
        description: Subtracts one number from another.
        args:
          - name_or_flags:
              - a
            description: The number to subtract from.
          - name_or_flags:
              - b
            description: The number to subtract.
      multiply:
        group_key: calc
        key: multiply
        name: Multiply Number Command
        description: Multiplies two numbers.
        args:
          - name_or_flags:
              - a
            description: The first number to multiply.
          - name_or_flags:
              - b
            description: The second number to multiply.
      divide:
        group_key: calc
        key: divide
        name: Divide Number Command
        description: Divides one number by another.
        args:
          - name_or_flags:
              - a
            description: The numerator.
          - name_or_flags:
              - b
            description: The denominator.
      exp:
        group_key: calc
        key: exp
        name: Exponentiate Number Command
        description: Raises one number to the power of another.
        args:
          - name_or_flags:
              - a
            description: The base number.
          - name_or_flags:
              - b
            description: The exponent.
      sqrt:
        group_key: calc
        key: sqrt
        name: Square Root Command
        description: Calculates the square root of a number.
        args:
          - name_or_flags:
              - a
            description: The number to square root.
      history:
        group_key: calc
        key: history
        name: Recent Calculations Command
        description: Lists the most recently executed calculations.
    formula:
      save:
        group_key: formula
        key: save
        name: Save Formula Command
        description: Saves a named, variablized formula.
        args:
          - name_or_flags:
              - name
            description: The name of the formula.
          - name_or_flags:
              - expression
            description: The arithmetic expression using named variables.
      get:
        group_key: formula
        key: get
        name: Get Formula Command
        description: Retrieves a saved formula by id.
        args:
          - name_or_flags:
              - id
            description: The formula identifier.
      list:
        group_key: formula
        key: list
        name: List Formulas Command
        description: Lists all saved formulas.
      eval:
        group_key: formula
        key: eval
        name: Evaluate Formula Command
        description: Evaluates a saved formula with variable values.
        args:
          - name_or_flags:
              - id
            description: The formula identifier.
          - name_or_flags:
              - values
            description: A JSON object mapping variable names to values.

logging:
  formatters:
    default:
      name: Default Formatter
      format: '%(message)s'
  handlers:
    default:
      name: Default Handler
      module_path: logging
      class_name: StreamHandler
      level: CRITICAL
      formatter: default
      stream: ext://sys.stderr
  loggers:
    root:
      name: Root Logger
      level: CRITICAL
      handlers:
        - default
      is_root: true
    default:
      name: Default Logger
      level: CRITICAL
      handlers:
        - default

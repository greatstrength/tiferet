# Publishes Tiferet to PyPI when a GitHub Release is published.
# Tests and the package build check already ran on the pull request
# and on main. This workflow does not repeat them.
#
# It checks out the release tag, confirms the tag is v plus
# tiferet.__version__, builds the distribution to upload, and publishes.
# A release event's default github.sha is the default-branch tip, not
# the tag, so the tag is checked out explicitly.
#
# Stable and pre-release both use the pypi environment and
# upload.pypi.org, matching the previous publish jobs.

name: Publish Tiferet

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    env:
      TIFERET_SILENT_IMPORTS: "1"
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Extract version from tiferet/__init__.py
        id: get_version
        run: |
          VERSION=$(python -c "from tiferet import __version__; print(__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate version matches release tag
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          PACKAGE_VERSION="${{ steps.get_version.outputs.version }}"
          if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "Error: Release tag ($RELEASE_TAG) does not match package version ($PACKAGE_VERSION)"
            exit 1
          fi

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://upload.pypi.org/legacy/

# Publishes Tiferet when a v* tag is pushed.
# Proto betas and alphas publish on tag push, not on the GitHub Release
# event trunk uses. Tests and the package build check already ran on the
# pull request and on v2.x-proto. This workflow does not repeat them.
#
# It confirms the tag is v plus tiferet.__version__, builds the
# distribution to upload, and publishes. Stable and pre-release both
# use the pypi environment and upload.pypi.org, matching the previous
# publish jobs.

name: Publish Tiferet

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    env:
      TIFERET_SILENT_IMPORTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Extract version
        id: get_version
        run: |
          TIFERET_VERSION=$(python -c "
          import re, pathlib
          text = pathlib.Path('tiferet/__init__.py').read_text()
          print(re.search(r\"__version__\s*=\s*['\\\"](.*?)['\\\"]\" , text).group(1))
          ")
          echo "tiferet_version=$TIFERET_VERSION" >> $GITHUB_OUTPUT

      - name: Validate version matches release tag
        run: |
          TAG="${{ github.ref_name }}"
          TIFERET_VERSION="${{ steps.get_version.outputs.tiferet_version }}"
          if [ "$TAG" != "v$TIFERET_VERSION" ]; then
            echo "Error: Tag ($TAG) does not match tiferet version (v$TIFERET_VERSION)"
            exit 1
          fi

      - name: Build package
        run: python -m build --outdir dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://upload.pypi.org/legacy/

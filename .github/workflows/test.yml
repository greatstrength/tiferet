# Pull request and v2.x-proto gates. Both jobs must pass before a squash merge.
# The tag-push publish workflow does not repeat them.
# Push watches v2.x-proto, not main. Tests keep the 3.10–3.12 matrix
# this branch already required before a beta publish.

name: test

on:
  pull_request:
  push:
    branches:
      - v2.x-proto

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests
        run: pytest tests/ tests_int/ --verbose

  build:
    runs-on: ubuntu-latest
    env:
      TIFERET_SILENT_IMPORTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build --outdir dist/

      - name: Check package
        run: twine check dist/*
